networks:
  nanoclbr0:
    name: nanoclbr0
    driver: bridge
    external: false
    driver_opts:
      com.docker.network.bridge.name: nanoclbr0

services:
  nstore:
    container_name: nstore.system.c
    hostname: store.nanocl.internal
    image: docker.io/cockroachdb/cockroach:v24.3.8
    entrypoint: /bin/sh
    tty: true
    ports:
      - 26257:26257
      - 26258:26258
    networks:
      - nanoclbr0
    volumes:
      - ${STATE_DIR:-${HOME}/.nanocl_dev/state}/store:${STATE_DIR:-${HOME}/.nanocl_dev/state}/store
    environment:
      - STORE_DIR=${STATE_DIR:-${HOME}/.nanocl_dev/state}/store
    labels:
      - io.nanocl=enabled
      - io.nanocl.kind=cargo
      - io.nanocl.c=nstore.system
      - io.nanocl.n=system
    command:
      - -c
      - |
        echo "starting cockroachdb"
        cockroach start-single-node --listen-addr=:26257 --sql-addr=:26258 --insecure --store=$$STORE_DIR/data

  nmetrics:
    container_name: nmetrics.system.c
    image: ghcr.io/next-hat/metrsd:0.5.4
    tty: true
    networks:
      - nanoclbr0
    environment:
      - TZ=Europe/Paris
      - LOG_LEVEL=metrsd=info
    command:
      - --hosts
      - unix:///run/nanocl/metrics.sock
    labels:
      - io.nanocl=enabled
      - io.nanocl.kind=cargo
      - io.nanocl.c=nmetrics.system
      - io.nanocl.n=system
    volumes:
      - /run/nanocl:/run/nanocl
