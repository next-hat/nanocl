ApiVersion: v0.18

Namespace: global

Cargoes:
- Name: e2e-private-api
  NetworkMode: e2e-private
  Containers:
  - Name: api
    Image: ghcr.io/next-hat/nanocl-get-started:latest

- Name: e2e-private-peer
  NetworkMode: e2e-private
  Containers:
  - Name: peer
    Image: alpine:latest
    Cmd:
    - sleep
    - "300"
    Env:
    - E2E_INTERNAL_GATEWAY=$$INTERNAL_GATEWAY

- Name: e2e-default-client
  Containers:
  - Name: client
    Image: alpine:latest
    Cmd:
    - sleep
    - "300"

Jobs:
- Name: e2e-private-job
  Containers:
  - Image: alpine:latest
    Cmd:
    - echo
    - network-ready
    HostConfig:
      NetworkMode: e2e-private

Resources:
- Name: e2e-network-proxy
  Kind: ncproxy.io/rule
  Data:
    Rules:
    - Domain: network-partitioning.nanocl.test
      Network: e2e-private
      Locations:
      - Path: /
        Target:
          Key: global.e2e-private-api.c
          Port: 9000

- Name: e2e-network-dns
  Kind: ncdns.io/rule
  Data:
    Network: e2e-private
    Entries:
    - Name: network-partitioning.nanocl.test
      IpAddress: e2e-private
