[package]
name = "nanocl_stubs"
version = "0.19.0"
edition = "2024"
authors = ["nanocl contributors <team@next-hat.com>"]
description = "Nanocl shared data model"
readme = "readme.md"
license = "MIT OR Apache-2.0"
homepage = "https://next-hat.com/nanocl"
repository = "https://github.com/next-hat/nanocl"

[lib]
bench = false

[features]
default = ["serde"]
serde = [
  "dep:serde",
  "dep:serde_ignored",
  "dep:serde-value",
  "uuid/serde",
  "chrono/serde",
]
utoipa = ["dep:utoipa", "bollard-next/utoipa"]
schemars = ["dep:schemars", "bollard-next/schemars"]
clap = ["dep:clap"]
test = []

[dependencies]
uuid = { version = "1.28.0" }
serde_json = "1.0.151"
bollard-next = { version = "0.18.1" }
chrono = { version = "0.4.45", default-features = false, features = [
  "std",
  "clock",
] }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_ignored = { version = "0.1.14", optional = true }
serde-value = { version = "0.7.0", optional = true }
utoipa = { version = "5.5.0", features = ["uuid", "chrono"], optional = true }
schemars = { version = "0.8.22", features = ["uuid1", "chrono"], optional = true }
clap = { version = "4.6.7", features = ["derive", "cargo"], optional = true }
ipnet = { version = "2.12.2", features = ["serde"] }

[dev-dependencies]
serde_yaml = "0.9.34"
toml = "1.1.8"
