[package]
name = "nanocld_client"
version = "0.19.0"
edition = "2024"
authors = ["nanocl contributors <team@next-hat.com>"]
description = "The Nanocl daemon api client"
readme = "readme.md"
license = "MIT OR Apache-2.0"
homepage = "https://next-hat.com/nanocl"
repository = "https://github.com/next-hat/nanocl"

[lib]
bench = false

[features]
default = ["tokio"]
tokio = ["ntex/tokio"]
utoipa = ["nanocl_stubs/utoipa"]
openssl = ["dep:openssl", "ntex/openssl"]
test = []

[dev-dependencies]
tokio-util = "0.7.20"
tokio = { version = "1.53.3", features = ["fs"] }

[dependencies]
futures = "0.3.34"
serde_json = "1.0.154"
ntex = { version = "4.2.0" }
serde = { version = "1.0.229", features = ["derive"] }
bollard-next = { version = "0.22.0" }
nanocl_stubs = { version = "0.19", features = ["serde"] }
nanocl_error = { version = "0.7", features = ["io", "http_client"] }
openssl = { version = "0.10.81", optional = true }
