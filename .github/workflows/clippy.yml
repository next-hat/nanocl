# Run Clippy

name: Clippy

on:
  push:
    branches: ["nightly"]
  pull_request:
    branches: ["nightly"]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/nightly' }}

jobs:
  clippy:
    name: Clippy
    strategy:
      fail-fast: true
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v7.0.1

      # Cache Rust
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('./Cargo.lock') }}

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          components: clippy
          override: true
          cache: false
          build-warnings: ""

      - name: Run Clippy
        run: cargo clippy

  fmt:
    name: Fmt
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: 1.99.0
          components: rustfmt
          override: true
          cache: false
          build-warnings: ""
      - name: Check formatting
        run: cargo fmt --all -- --check
