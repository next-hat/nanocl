name: Ubuntu 26.04 compatibility

on:
  workflow_dispatch: {}
  pull_request:
    branches: ["nightly"]
    paths:
      - .github/workflows/tests.yml
      - .github/workflows/e2e.yml
      - .github/workflows/ubuntu-26.04.yml
      - .github/ubuntu-26.04.md

permissions:
  contents: read

concurrency:
  group: ubuntu-26.04-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    with:
      runner: ubuntu-26.04
  e2e:
    uses: ./.github/workflows/e2e.yml
    with:
      runner: ubuntu-26.04
