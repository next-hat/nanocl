name: E2E Tests

on:
  push:
    branches: ["nightly"]
  pull_request:
    branches: ["nightly"]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/nightly' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  ubuntu_e2e_test:
    strategy:
      fail-fast: true
    runs-on: ubuntu-latest

    steps:
      # Clone project
      - uses: actions/checkout@v6
      # Install buildx
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
      # Set buildx cache
      - name: Cache register
        uses: actions/cache@v5
        with:
          path: ~/buildx-cache
          key: buildx-cache
      # Install cargo make
      - uses: davidB/rust-cargo-make@v1
      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats
      # Build nightly image and install nanocl
      - name: Prepare CI
        run: |
          sh ./scripts/build_images.sh
          NANOCL_CHANNEL=nightly cargo build --release --bin nanocl
          sudo cp target/release/nanocl /usr/bin/nanocl
          sudo chmod +x /usr/bin/nanocl
          sudo groupadd nanocl
          sudo usermod -aG nanocl $USER
          sudo gpasswd -r nanocl
          newgrp nanocl
          nanocl install -t installer.yml

          ready=0
          i=0
          while [ "$i" -lt 180 ]; do
            daemon_status=$(sudo curl --silent --output /dev/null --write-out "%{http_code}" --unix-socket /run/nanocl/nanocl.sock http://localhost/v0.0/resource/kinds/ncproxy.io/rule/inspect || true)
            proxy_status=$(sudo curl --silent --output /dev/null --write-out "%{http_code}" -X DELETE --unix-socket /run/nanocl/proxy.sock http://localhost/v0.0/rules/__ci_readiness_probe__ || true)

            if [ "$daemon_status" = "200" ] && [ "$proxy_status" = "200" ]; then
              ready=1
              break
            fi

            if [ $((i % 15)) -eq 0 ]; then
              echo "readiness: daemon=${daemon_status} proxy=${proxy_status}"
            fi

            if ! docker ps --format '{{.Names}}' | grep -q '^ndaemon.system.c$'; then
              echo "ndaemon.system.c exited unexpectedly" >&2
              docker logs ndaemon.system.c || true
              exit 1
            fi

            if ! docker ps --format '{{.Names}}' | grep -q '^ncproxy.system.c$'; then
              echo "ncproxy.system.c exited unexpectedly" >&2
              docker logs ncproxy.system.c || true
              exit 1
            fi

            i=$((i + 1))
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "nanocl and ncproxy did not become ready in time" >&2
            docker ps -a
            docker logs ndaemon.system.c || true
            docker logs ncproxy.system.c || true
            exit 1
          fi

          docker ps -a
          docker logs ndaemon.system.c
          docker logs ncproxy.system.c || true
          sudo chmod -R 777 /var/lib/nanocl
          sudo chmod -R 777 /run/nanocl
          nanocl version
      # Run E2E tests
      - name: E2E
        run: |
          bats --verbose-run ./tests/e2e.bats
