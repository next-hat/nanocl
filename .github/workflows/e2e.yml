name: E2E Tests

on:
  push:
    branches: ["nightly"]
  pull_request:
    branches: ["nightly"]
  workflow_dispatch: {}
  workflow_call:
    inputs:
      runner:
        description: Host image for the compatibility probe
        type: string
        default: ubuntu-24.04

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/nightly' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  ubuntu_e2e_test:
    strategy:
      fail-fast: true
    # Keep normal CI stable until the 26.04 migration is validated.
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 90

    steps:
      # Clone project
      - uses: actions/checkout@v7.0.1
      # NanoCL mounts the runner socket, so upgrade that daemon before Buildx.
      - name: Set up Docker Engine
        env:
          DOCKER_ENGINE_VERSION: "29.9.2"
        run: |
          sudo apt-get update
          package_version="$(apt-cache madison docker-ce | awk -v version="$DOCKER_ENGINE_VERSION" 'index($3, "5:" version "-") == 1 && !found {print $3; found = 1}')"
          test -n "$package_version" || { echo "Docker Engine $DOCKER_ENGINE_VERSION is unavailable in the runner's apt repository" >&2; exit 1; }
          sudo apt-get install --yes --no-install-recommends \
            "docker-ce=$package_version" "docker-ce-cli=$package_version" containerd.io
          sudo systemctl restart docker
          test "$(docker --host unix:///var/run/docker.sock version --format '{{.Server.Version}}')" = "$DOCKER_ENGINE_VERSION"
          curl --fail --silent --show-error --output /dev/null --unix-socket /var/run/docker.sock http://localhost/v1.53/info
      # Install buildx
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
      - name: Runner diagnostics
        run: |
          cat /etc/os-release
          uname -r
          printf 'Runner image: %s (%s)\n' "$ImageOS" "$ImageVersion"
          docker version
          docker buildx version
          docker compose version
          ls -ld /run/nanocl /dev/kvm 2>/dev/null || true
      # Set buildx cache
      - name: Cache register
        uses: actions/cache@v6
        with:
          path: ~/buildx-cache
          key: buildx-${{ inputs.runner || 'ubuntu-24.04' }}-e2e-${{ hashFiles('scripts/dev.Dockerfile', 'bin/**/Dockerfile') }}
      # Install cargo make
      - uses: davidB/rust-cargo-make@v1
      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats
      # Build nightly image and install nanocl
      - name: Prepare CI
        run: |
          ./tests/e2e_prepare_ci.sh
      # Run E2E tests
      - name: E2E
        run: |
          bats --verbose-run ./tests/e2e.bats
