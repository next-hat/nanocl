name: E2E Tests

on:
  push:
    branches: ["nightly"]
  pull_request:
    branches: ["nightly"]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/nightly' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  ubuntu_e2e_test:
    strategy:
      fail-fast: true
    runs-on: ubuntu-latest

    steps:
      # Clone project
      - uses: actions/checkout@v6
      # Install buildx
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
      # Set buildx cache
      - name: Cache register
        uses: actions/cache@v5
        with:
          path: ~/buildx-cache
          key: buildx-cache
      # Install cargo make
      - uses: davidB/rust-cargo-make@v1
      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats
      # Build nightly image and install nanocl
      - name: Prepare CI
        run: |
          sh ./scripts/build_images.sh
          NANOCL_CHANNEL=nightly cargo build --release --bin nanocl
          sudo cp target/release/nanocl /usr/bin/nanocl
          sudo chmod +x /usr/bin/nanocl
          sudo groupadd nanocl
          sudo usermod -aG nanocl $USER
          sudo gpasswd -r nanocl
          newgrp nanocl
          nanocl install -t installer.yml

          if [ -d /var/lib/nanocl/store/certs ]; then
            sudo find /var/lib/nanocl/store/certs -type f -name '*.key' -exec chmod 600 {} \; || true
            sudo find /var/lib/nanocl/store/certs -type f -name '*.crt' -exec chmod 644 {} \; || true
          fi

          if [ -d /var/lib/nanocl/store/ca ]; then
            sudo find /var/lib/nanocl/store/ca -type f -name '*.key' -exec chmod 600 {} \; || true
          fi

          daemon_ready=0
          i=0
          while [ "$i" -lt 180 ]; do
            daemon_status=$(sudo curl --silent --output /dev/null --write-out "%{http_code}" --unix-socket /run/nanocl/nanocl.sock http://localhost/v0.0/resource/kinds/ncproxy.io/rule/inspect || true)

            if [ "$daemon_status" = "200" ]; then
              echo "readiness: daemon=200 (ready)"
              daemon_ready=1
              break
            fi

            if [ $((i % 15)) -eq 0 ]; then
              echo "readiness: daemon=${daemon_status}"
            fi

            if ! docker ps --format '{{.Names}}' | grep -q '^ndaemon.system.c$'; then
              echo "ndaemon.system.c exited unexpectedly" >&2
              docker logs ndaemon.system.c || true
              exit 1
            fi

            if ! docker ps --format '{{.Names}}' | grep -q '^ncproxy.system.c$'; then
              echo "ncproxy.system.c exited unexpectedly" >&2
              docker logs ncproxy.system.c || true
              exit 1
            fi

            i=$((i + 1))
            sleep 1
          done

          if [ "$daemon_ready" -ne 1 ]; then
            echo "nanocld did not become ready in time" >&2
            docker ps -a
            docker logs ndaemon.system.c || true
            docker logs ncproxy.system.c || true
            exit 1
          fi

          # The daemon socket is created after startup; relax permissions after it exists.
          sudo chmod -R 777 /run/nanocl || true
          ls -la /run/nanocl || true

          # Wait for ncproxy to bind its socket and accept connections.
          proxy_ready=0
          p=0
          while [ "$p" -lt 120 ]; do
            if [ -S /run/nanocl/proxy.sock ]; then
              sudo chmod 777 /run/nanocl/proxy.sock 2>/dev/null || true
              proxy_status=$(sudo curl --silent --output /dev/null --write-out "%{http_code}" \
                --unix-socket /run/nanocl/proxy.sock 'http://localhost/v0.15/rules' 2>/dev/null || true)
              if [ "$proxy_status" != "000" ]; then
                echo "readiness: proxy=${proxy_status} (ready)"
                proxy_ready=1
                break
              fi
            fi

            if [ $((p % 10)) -eq 0 ]; then
              echo "readiness: proxy=waiting (${p}s)"
            fi

            if ! docker ps --format '{{.Names}}' | grep -q '^ncproxy.system.c$'; then
              echo "ncproxy.system.c exited unexpectedly" >&2
              docker logs ncproxy.system.c || true
              exit 1
            fi

            p=$((p + 1))
            sleep 1
          done

          if [ "$proxy_ready" -ne 1 ]; then
            echo "ncproxy did not become ready in time" >&2
            docker ps -a
            docker logs ndaemon.system.c || true
            docker logs ncproxy.system.c || true
            exit 1
          fi

          nanocl version
          docker ps -a
          docker logs ndaemon.system.c
          docker logs ncproxy.system.c || true
      # Run E2E tests
      - name: E2E
        run: |
          bats --verbose-run ./tests/e2e.bats
