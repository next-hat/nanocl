openapi: 3.1.0
info:
  title: Nanocl Controller Dns
  description: |
    The `Nanocl Controller Daemon Dns` is an `HTTP REST API`.<br />
    It is the `API` the `Nanocl Daemon` uses, to create / update and delete `DnsRule`

    ## OpenAPI Specification
    This API is documented in **OpenAPI format** using [Utoipa](https://github.com/juhaku/utoipa)<br />
    The specification is generated automatically when running in development only.<br />
    When releasing a version, the generated file is transferred to our [Documentation](https://github.com/next-hat/documentation).


    ## Cross-Origin Resource Sharing
    This API features Cross-Origin Resource Sharing (CORS) implemented in compliance with  [W3C spec](https://www.w3.org/TR/cors/).<br />
    And that allows cross-domain communication from the browser.<br />
    All responses have a wildcard same-origin which makes them completely public and accessible to everyone, including any code on any site.
  license:
    name: ''
  version: v0.10.0
servers:
- url: /{Version}
  variables:
    Version:
      default: v0.6
      description: API version
      enum:
      - v0.5
paths:
  /health:
    get:
      tags:
      - Health
      summary: Health check endpoint to verify that the service is running and responsive.
      operationId: health
      responses:
        '200':
          description: The health status
          content:
            text/plain:
              schema:
                type: string
  /rules/{name}:
    put:
      tags:
      - Rules
      summary: Create/Update a new DnsRule
      operationId: apply_rule
      parameters:
      - name: name
        in: path
        description: Name of the rule
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceDnsRule'
        required: true
      responses:
        '200':
          description: The created rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceDnsRule'
    delete:
      tags:
      - Rules
      summary: Delete a ProxyRule
      operationId: remove_rule
      parameters:
      - name: name
        in: path
        description: Name of the rule
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Rule has been deleted
components:
  schemas:
    DnsEntry:
      type: object
      required:
      - Name
      - IpAddress
      properties:
        Name:
          type: string
        IpAddress:
          $ref: '#/components/schemas/NetworkKind'
      additionalProperties: false
    NetworkKind:
      oneOf:
      - type: string
        description: A reserved selector, IP address, or user-defined network name
      - type: object
        description: Tagged escape form for a network name which looks like a reserved selector or IP address
        required:
        - Named
        properties:
          Named:
            type: string
      - type: object
        description: Backwards-compatible tagged IP address form
        required:
        - Other
        properties:
          Other:
            type: string
      description: Network binding selector
    ResourceDnsRule:
      type: object
      required:
      - Network
      - Entries
      properties:
        Network:
          $ref: '#/components/schemas/NetworkKind'
        Entries:
          type: array
          items:
            $ref: '#/components/schemas/DnsEntry'
      additionalProperties: false
tags:
- name: Health
  description: Health check endpoint.
- name: Rules
  description: Rules management endpoints.
