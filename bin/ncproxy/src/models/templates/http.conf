{% if limit_req_zone %}
limit_req_zone $binary_remote_addr$uri zone={{ key }}:{{ limit_req_zone.Size   }}m rate={{ limit_req_zone.Rate }}r/s;
{% endif %}

server {
  {% if ssl %}
  listen {{ listen_https }} ssl;
  http2 on;
  {% if http3 %}
  # HTTP/3 and QUIC
  listen {{ listen_https }} quic;
  http3 on;
  {% if http3.Hq %}http3_hq {{ http3.Hq | downcase }};{% endif %}
  {% if http3.MaxConcurrentStreams %}http3_max_concurrent_streams {{ http3.MaxConcurrentStreams }};{% endif %}
  {% if http3.StreamBufferSize %}http3_stream_buffer_size {{ http3.StreamBufferSize }};{% endif %}
  {% if http3.ActiveConnectionIdLimit %}quic_active_connection_id_limit {{ http3.ActiveConnectionIdLimit }};{% endif %}
  {% if http3.Bpf %}quic_bpf {{ http3.Bpf | downcase }};{% endif %}
  {% if http3.Gso %}quic_gso {{ http3.Gso | downcase }};{% endif %}
  {% if http3.HostKey %}quic_host_key {{ http3.HostKey }};{% endif %}
  {% if http3.Retry %}quic_retry {{ http3.Retry | downcase }};{% endif %}
  add_header Alt-Svc 'h3=":{{ listen_https | split: ":" | last }}"; ma=86400, h3-29=":{{ listen_https | split: ":" | last }}"; ma=86400' always;
  {% endif %}
  {% else %}
  listen {{ listen }};
  {% endif %}
  {% if domain %}
  server_name {{ domain }};
  # if ($host != {{ domain }}) {
  #   return 502;
  # }
  {% endif %}
  {% if ssl %}
  ssl_certificate         {{ssl.Certificate}};
  ssl_certificate_key     {{ssl.CertificateKey}};{% if ssl.Dhparam %}
  ssl_dhparam             {{ssl.Dhparam}};{% endif %}
  ssl_protocols           TLSv1.2 TLSv1.3;
  ssl_ciphers             HIGH:!aNULL:!MD5;
  ssl_session_cache       shared:{{ key }}-SSL:20m;
  ssl_session_timeout     4h;
  # ssl_handshake_timeout   30s;
  {% if hsts %} add_header Strict-Transport-Security "max-age={{ hsts.MaxAge }}; {% if hsts.IncludeSubDomains %} includeSubDomains;{% endif %} {% if hsts.Preload %} preload{% endif %}" {% if hsts.Always %} always{% endif %};{% endif %}
  {% if ssl.CertificateClient %}ssl_client_certificate  {{ssl.CertificateClient}};
  {% endif %}{% if ssl.VerifyClient %}
  ssl_verify_client       on;
  {% endif %}{% endif %}{% if hide_upstream %}{% else %}{% for location in locations %}
  location {{ location.path }} { {% if location.headers %}{% for header in location.headers %}
    proxy_set_header {{ header }};
    {% endfor %}{% endif %}{% if location.version %}proxy_http_version {{ location.version }};
    {% endif %}{% if location.redirect %}
    return {{ location.redirect }} {{ location.upstream_key }};{% else %}
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Scheme $scheme;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header Cf-Connecting-Ip   $http_cf_connecting_ip;
    proxy_pass {{ location.upstream_key }}{{ location.upstream_path }};
    {% endif %}{% if location.allowed_ips %}{% for allowed_ip in location.allowed_ips %}
    allow {{ allowed_ip }};{% endfor %}
    deny all;{% endif %}{% if location.limit_req %}
    limit_req zone={{ key }} burst={{ location.limit_req.Burst }} {% if location.limit_req.Delay %}delay={{ location.limit_req.Delay }}{% else %}nodelay{% endif %};{% endif %}
    {% if location.ssl %}
    proxy_ssl_certificate         {{ location.ssl.Certificate }};
    proxy_ssl_certificate_key     {{ location.ssl.CertificateKey }};
    {% endif  %}
  }{% endfor %}{% endif %}
  # proxy_connect_timeout                   2s;
  # proxy_send_timeout                      2s;
  # proxy_read_timeout                      2s;
  proxy_next_upstream                     error timeout;
  proxy_next_upstream_timeout             10s;
  proxy_next_upstream_tries               3;
}
