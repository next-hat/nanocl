            $ref: '#/components/schemas/ContainerBlkioStatEntry'
        io_serviced_recursive:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ContainerBlkioStatEntry'
          description: This field is only available when using Linux containers with cgroups v1. It is omitted or `null` when using cgroups v2.
        io_queue_recursive:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ContainerBlkioStatEntry'
          description: This field is only available when using Linux containers with cgroups v1. It is omitted or `null` when using cgroups v2.
        io_service_time_recursive:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ContainerBlkioStatEntry'
          description: This field is only available when using Linux containers with cgroups v1. It is omitted or `null` when using cgroups v2.
        io_wait_time_recursive:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ContainerBlkioStatEntry'
          description: This field is only available when using Linux containers with cgroups v1. It is omitted or `null` when using cgroups v2.
        io_merged_recursive:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ContainerBlkioStatEntry'
          description: This field is only available when using Linux containers with cgroups v1. It is omitted or `null` when using cgroups v2.
        io_time_recursive:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ContainerBlkioStatEntry'
          description: This field is only available when using Linux containers with cgroups v1. It is omitted or `null` when using cgroups v2.
        sectors_recursive:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ContainerBlkioStatEntry'
          description: This field is only available when using Linux containers with cgroups v1. It is omitted or `null` when using cgroups v2.
    ContainerConfig:
      type: object
      description: Configuration for a container that is portable between hosts.
      properties:
        Hostname:
          type:
          - string
          - 'null'
          description: The hostname to use for the container, as a valid RFC 1123 hostname.
        Domainname:
          type:
          - string
          - 'null'
          description: The domain name to use for the container.
        User:
          type:
          - string
          - 'null'
          description: Commands run as this user inside the container. If omitted, commands run as the user specified in the image the container was started from.  Can be either user-name or UID, and optional group-name or GID, separated by a colon (`<user-name|UID>[<:group-name|GID>]`).
        AttachStdin:
          type:
          - boolean
          - 'null'
          description: Whether to attach to `stdin`.
        AttachStdout:
          type:
          - boolean
          - 'null'
          description: Whether to attach to `stdout`.
        AttachStderr:
          type:
          - boolean
          - 'null'
          description: Whether to attach to `stderr`.
        ExposedPorts:
          type:
          - object
          - 'null'
          description: 'An object mapping ports to an empty object in the form:  `{\"<port>/<tcp|udp|sctp>\": {}}`'
          additionalProperties:
            type: object
            additionalProperties:
              default: null
            propertyNames:
              default: null
          propertyNames:
            type: string
        Tty:
          type:
          - boolean
          - 'null'
          description: Attach standard streams to a TTY, including `stdin` if it is not closed.
        OpenStdin:
          type:
          - boolean
          - 'null'
          description: Open `stdin`
        StdinOnce:
          type:
          - boolean
          - 'null'
          description: Close `stdin` after one attached client disconnects
        Env:
          type:
          - array
          - 'null'
          items:
            type: string
          description: A list of environment variables to set inside the container in the form `[\"VAR=value\", ...]`. A variable without `=` is removed from the environment, rather than to have an empty value.
        Cmd:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Command to run specified as a string or an array of strings.
        Healthcheck:
          oneOf:
          - $ref: '#/components/schemas/HealthConfig'
          - type: 'null'
        ArgsEscaped:
          type:
          - boolean
          - 'null'
          description: Command is already escaped (Windows only)
        Image:
          type:
          - string
          - 'null'
          description: The name (or reference) of the image to use when creating the container, or which was used when the container was created.
        Volumes:
          type:
          - object
          - 'null'
          description: An object mapping mount point paths inside the container to empty objects.
          additionalProperties:
            type: object
            additionalProperties:
              default: null
            propertyNames:
              default: null
          propertyNames:
            type: string
        WorkingDir:
          type:
          - string
          - 'null'
          description: The working directory for commands to run in.
        Entrypoint:
          type:
          - array
          - 'null'
          items:
            type: string
          description: The entry point for the container as a string or an array of strings.  If the array consists of exactly one empty string (`[\"\"]`) then the entry point is reset to system default (i.e., the entry point used by docker when there is no `ENTRYPOINT` instruction in the `Dockerfile`).
        NetworkDisabled:
          type:
          - boolean
          - 'null'
          description: Disable networking for the container.
        OnBuild:
          type:
          - array
          - 'null'
          items:
            type: string
          description: '`ONBUILD` metadata that were defined in the image''s `Dockerfile`.'
        Labels:
          type:
          - object
          - 'null'
          description: User-defined key/value metadata.
          additionalProperties:
            type: string
          propertyNames:
            type: string
        StopSignal:
          type:
          - string
          - 'null'
          description: Signal to stop a container as a string or unsigned integer.
        StopTimeout:
          type:
          - integer
          - 'null'
          format: int64
          description: Timeout to stop a container in seconds.
        Shell:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Shell for when `RUN`, `CMD`, and `ENTRYPOINT` uses a shell.
