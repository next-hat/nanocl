              type: string
            encoding:
              default: raw
              description: 'Used to decode **data** provided. Allowed values are ``raw``, ``base64``, ``b64``, ``gzip``, or ``gz``.  Default: ``raw``.'
              enum:
              - raw
              - base64
              - b64
              - gzip
              - gz
              type: string
            file:
