openapi: 3.1.0
info:
  title: Nanocl Daemon
  description: |
    The `Nanocl Daemon` is an `HTTP REST API`.<br />
    It is the `API` the `Nanocl Client` uses, so everything the `Nanocl Client` can do can be done with the `API`.

    Most of the client's commands map directly to API endpoints e.g: `nanocl ps` is `GET /processes`.<br />
    The notable exception is running `Cargo`, which consists of several `API` calls.


    ## OpenAPI Specification
    This API is documented in **OpenAPI format** using [Utoipa](https://github.com/juhaku/utoipa)<br />
    The specification is generated automatically when running in development only.<br />
    When releasing a version, the generated file is transferred to our [Documentation](https://github.com/next-hat/documentation).


    ## Cross-Origin Resource Sharing
    This API features Cross-Origin Resource Sharing (CORS) implemented in compliance with  [W3C spec](https://www.w3.org/TR/cors/).<br />
    And that allows cross-domain communication from the browser.<br />
    All responses have a wildcard same-origin which makes them completely public and accessible to everyone, including any code on any site.
  contact:
    name: nanocl contributors
    email: team@next-hat.com
  license:
    name: MIT OR Apache-2.0
    identifier: MIT OR Apache-2.0
  version: v0.19.0
servers:
- url: /{Version}
  variables:
    Version:
      default: v0.19.0
      description: API version
paths:
  /_ping:
    head:
      tags:
      - System
      summary: Ping the server to check if it is up
      operationId: get_ping
      responses:
        '202':
          description: Server is up
  /cargoes:
    get:
      tags:
      - Cargoes
      summary: List cargoes with optional filter
      operationId: list_cargo
      parameters:
      - name: filter
        in: query
        description: Generic filter
        required: false
        schema:
          type: string
        example: '{ "filter": { "where": { "name": { "eq": "test" } } } }'
      - name: namespace
        in: query
        description: Optional namespace filter; omitted or blank returns all namespaces
        required: false
        schema:
          type: string
      responses:
        '200':
          description: List of cargoes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CargoSummary'
    post:
      tags:
      - Cargoes
      summary: Create a new cargo by it specification
      operationId: create_cargo
      parameters:
      - name: namespace
        in: query
        description: Namespace where to create the cargo default to 'global'
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CargoSpec'
        required: true
      responses:
        '201':
          description: Cargo created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cargo'
        '409':
          description: Cargo already exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /cargoes/count:
    get:
      tags:
      - Cargoes
      summary: Count cargoes with optional filter
      operationId: count_cargo
      parameters:
      - name: filter
        in: query
        description: Generic filter
        required: false
        schema:
          type: string
        example: '{ "filter": { "where": { "name": { "eq": "my-cargo" } } } }'
      - name: namespace
        in: query
        description: Optional namespace filter; omitted or blank returns all namespaces
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Count result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericCount'
  /cargoes/{cargo_key}/histories/{history_key}/revert:
    patch:
      tags:
      - Cargoes
      summary: Revert a cargo to a specific history record
      operationId: revert_cargo
      parameters:
      - name: cargo_key
        in: path
        description: Canonical cargo key in `{namespace}.{name}` format
        required: true
        schema:
          type: string
      - name: history_key
        in: path
        description: Key of the cargo history
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Cargo revert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cargo'
        '404':
          description: Cargo does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /cargoes/{key}:
    put:
      tags:
      - Cargoes
      summary: Update a cargo by it's new specification and create a history record
      operationId: put_cargo
      parameters:
      - name: key
        in: path
        description: Canonical cargo key in `{namespace}.{name}` format
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CargoSpec'
        required: true
      responses:
        '200':
          description: Cargo updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cargo'
        '404':
          description: Cargo does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      tags:
      - Cargoes
      summary: Delete a cargo by its canonical key
      operationId: delete_cargo
      parameters:
      - name: key
        in: path
        description: Canonical cargo key in `{namespace}.{name}` format
        required: true
        schema:
          type: string
      - name: force
        in: query
        description: If true forces the delete operation even if the cargo is started
        required: true
        schema:
          type: boolean
      responses:
        '202':
          description: Cargo deleted
        '404':
          description: Cargo does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    patch:
      tags:
      - Cargoes
      summary: Patch a cargo by canonical key and add a history record
      operationId: patch_cargo
      parameters:
      - name: key
        in: path
        description: Canonical cargo key in `{namespace}.{name}` format
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CargoSpecPatch'
        required: true
      responses:
        '200':
          description: Cargo updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cargo'
        '404':
          description: Cargo does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /cargoes/{key}/histories:
    get:
      tags:
      - Cargoes
      summary: List cargo histories
      operationId: list_cargo_history
      parameters:
      - name: key
        in: path
        description: Canonical cargo key in `{namespace}.{name}` format
        required: true
        schema:
          type: string
      responses:
        '200':
          description: List of cargo histories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CargoSpecRevision'
        '404':
          description: Cargo does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /cargoes/{key}/inspect:
    get:
      tags:
      - Cargoes
      summary: Get detailed information about a cargo by its canonical key
      operationId: inspect_cargo
      parameters:
      - name: key
        in: path
        description: Canonical cargo key in `{namespace}.{name}` format
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Cargo details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CargoInspect'
  /events:
    get:
      tags:
      - Events
      summary: List events with optional filter
      operationId: list_event
      parameters:
      - name: filter
        in: query
        description: Generic filter
        required: false
        schema:
          type: string
        example: '{ "filter": { "where": { "kind": { "eq": "normal" } } } }'
      responses:
        '200':
          description: List of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
  /events/count:
    get:
      tags:
      - Events
      summary: Count events with optional filter
      operationId: count_event
      parameters:
      - name: filter
        in: query
        description: Generic filter
        required: false
        schema:
          type: string
        example: '{ "filter": { "where": { "namespace_name": { "eq": "global" } } } }'
      responses:
        '200':
          description: Count result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericCount'
  /events/watch:
    post:
      tags:
      - Events
      summary: Watch on new events of all peer nodes with optional condition to stop the stream
      operationId: watch_event
      requestBody:
        content:
          application/json:
            schema:
              type:
              - array
              - 'null'
              items:
                $ref: '#/components/schemas/EventCondition'
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
  /events/{key}/inspect:
    get:
      tags:
      - Events
      summary: Get detailed information about an event
      operationId: inspect_event
      parameters:
      - name: key
        in: path
        description: Key of the event
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Detailed information about the event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
  /exec/{id}/start:
    get:
      tags:
      - Processes
      summary: Start and attach to a Docker exec instance through an RFC6455 WebSocket
      description: Binary client frames are raw stdin. Text controls are stdin_eof, resize, and detach. Server binary frames begin with 0x01 stdout, 0x02 stderr, or 0x03 console; text controls report exit, detached, or error.
      operationId: start_process_exec_attached
      parameters:
      - name: id
        in: path
        description: Docker exec instance ID
        required: true
        schema:
          type: string
      responses:
        '101':
          description: Attached process exec WebSocket
        '404':
          description: Process exec doesn't exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      tags:
      - Processes
      summary: Start a Docker exec instance without attaching streams
      operationId: start_process_exec_detached
      parameters:
      - name: id
        in: path
        description: Docker exec instance ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Process exec started detached
        '404':
          description: Process exec doesn't exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /info:
    get:
      tags:
      - System
      summary: Get host/node system information
      operationId: get_info
      responses:
        '200':
          description: Host/Node information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostInfo'
  /jobs:
    get:
      tags:
      - Jobs
      summary: List jobs with optional filter
      operationId: list_job
      parameters:
      - name: filter
        in: query
        description: Generic filter
        required: false
        schema:
          type: string
        example: '{ "filter": { "where": { "name": { "eq": "job-example" } } } }'
      responses:
        '200':
          description: List of jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobSummary'
    post:
      tags:
      - Jobs
      summary: Create a new job
      operationId: create_job
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobPartial'
        required: true
      responses:
        '201':
          description: Job created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '409':
          description: Job already exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /jobs/count:
    get:
      tags:
      - Jobs
      summary: Count jobs
      operationId: count_job
      parameters:
      - name: filter
        in: query
        description: Generic filter
        required: false
        schema:
          type: string
        example: '{ "filter": { "where": { "key": { "eq": "job-example" } } } }'
      responses:
        '200':
          description: Count result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericCount'
  /jobs/{name}:
    delete:
      tags:
      - Jobs
      summary: Delete a job by name
      operationId: delete_job
      parameters:
      - name: name
        in: path
        description: Name of the job
        required: true
        schema:
          type: string
      - name: incarnation
        in: query
        description: Expected incarnation; when supplied the current run must also match run, including no run
        required: false
        schema:
          type: string
          format: uuid
      - name: run
        in: query
        description: Expected current run; requires incarnation
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '202':
          description: Job deletion accepted
        '404':
          description: Job does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Job incarnation or current run changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /jobs/{name}/histories:
    get:
      tags:
      - Jobs
      summary: List saved configurations of every retained incarnation of a Job name.
      operationId: list_job_history
      parameters:
      - name: name
        in: path
        description: Job name, including a removed job
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: Page size, 1 to 100; defaults to 50
        required: false
        schema:
          type: integer
          format: int64
      - name: offset
        in: query
        description: Nonnegative offset; defaults to zero
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Configurations, newest creation first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobSpec'
        '400':
          description: Invalid pagination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /jobs/{name}/histories/{id}:
    get:
      tags:
      - Jobs
      summary: Inspect a saved configuration without requiring the live Job to exist.
      operationId: inspect_job_history
      parameters:
      - name: name
        in: path
        description: Job name, including a removed job
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: Saved configuration identity
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Saved Job configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSpec'
        '404':
          description: Configuration does not belong to the named Job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /jobs/{name}/histories/{id}/revert:
    patch:
      tags:
      - Jobs
      summary: Restore a retained configuration without executing the replacement Job.
      operationId: revert_job
      parameters:
      - name: name
        in: path
        description: Name of the live Job to replace
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: Saved configuration identity belonging to this Job
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Job configuration restored without starting a run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          description: Saved configuration is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Job or its saved configuration does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Job identity changed or another lifecycle action is pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /jobs/{name}/runs:
    get:
      tags:
      - Jobs
      summary: List retained executions of every incarnation of a Job name.
      operationId: list_job_runs
      parameters:
      - name: name
        in: path
        description: Job name, including a removed job
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: Page size, 1 to 100; defaults to 50
        required: false
        schema:
          type: integer
          format: int64
      - name: offset
        in: query
        description: Nonnegative offset; defaults to zero
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Runs, newest acceptance first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobRun'
        '400':
          description: Invalid pagination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /jobs/{name}/runs/{run}:
    get:
      tags:
      - Jobs
      summary: Inspect a retained execution without requiring the live Job to exist.
      operationId: inspect_job_run
      parameters:
      - name: name
        in: path
        description: Job name, including a removed job
        required: true
        schema:
          type: string
      - name: run
        in: path
        description: Retained execution identity
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Pinned definition, initiating operation, and ordered step results; Docker logs are not archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRunInspect'
        '404':
          description: Run does not belong to the named Job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /jobs/{name}/inspect:
    get:
      tags:
      - Jobs
      summary: Get detailed information about a job
      operationId: inspect_job
      parameters:
      - name: name
        in: path
        description: Name of the job
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Job details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobInspect'
  /metrics:
    get:
      tags:
      - Metrics
      summary: List metrics with optional filter
      operationId: list_metric
      parameters:
      - name: filter
        in: query
        description: Generic filter
        required: false
        schema:
          type: string
        example: '{ "filter": { "where": { "kind": { "eq": "CPU" } } } }'
      responses:
        '200':
          description: List of metrics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Metric'
    post:
      tags:
      - Metrics
      summary: Create a new metric
      operationId: create_metric
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetricPartial'
        required: true
      responses:
        '201':
          description: Metric created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metric'
        '409':
          description: Metric already exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /metrics/count:
    get:
      tags:
      - Metrics
      summary: Count metrics with optional filter
      operationId: count_metric
      parameters:
      - name: filter
        in: query
        description: Generic filter
        required: false
        schema:
          type: string
        example: '{ "filter": { "where": { "kind": { "eq": "ncproxy.io/http" } } } }'
      responses:
        '200':
          description: Count result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericCount'
  /metrics/{key}/inspect:
    get:
      tags:
      - Metrics
      summary: Get detailed information about a metric
      operationId: inspect_metric
      parameters:
      - name: key
        in: path
        description: Key of the metric
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Detailed information about a metric
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metric'
        '404':
          description: Metric not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /namespaces:
    get:
      tags:
      - Namespaces
      summary: List namespaces with optional filter
      operationId: list_namespace
      parameters:
      - name: filter
        in: query
        description: Generic filter
        required: false
        schema:
          type: string
        example: '{ "filter": { "where": { "name": { "eq": "test" } } } }'
      responses:
        '200':
          description: List of namespace
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NamespaceSummary'
    post:
      tags:
      - Namespaces
      summary: Create a new namespace
      operationId: create_namespace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NamespacePartial'
        required: true
      responses:
        '200':
          description: The created namespace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Namespace'
        '409':
          description: Namespace already exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /namespaces/count:
    get:
      tags:
      - Namespaces
      summary: Count namespaces
      operationId: count_namespace
      parameters:
      - name: filter
        in: query
        description: Generic filter
        required: false
        schema:
          type: string
        example: '{ "filter": { "where": { "name": { "eq": "global" } } } }'
      responses:
        '200':
          description: Count result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericCount'
  /namespaces/{name}:
    delete:
      tags:
      - Namespaces
      summary: Delete a namespace
      operationId: delete_namespace
      parameters:
      - name: name
        in: path
        description: Name of the namespace to delete
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Namespace have been deleted
        '403':
          description: Deletion of this namespace is forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Namespace is not existing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /namespaces/{name}/inspect:
    get:
      tags:
      - Namespaces
      summary: Get detailed information about a namespace
      operationId: inspect_namespace
      parameters:
      - name: name
        in: path
        description: The namespace name to inspect
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Detailed information about a namespace
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NamespaceInspect'
        '404':
          description: Namespace doesn't exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /networks:
    get:
      tags:
      - Networks
      summary: List persisted node-scoped Docker network snapshots.
      operationId: list_network
      parameters:
      - name: filter
        in: query
        description: Generic filter
        required: false
        schema:
          type: string
        example: '{ "where": { "node_name": { "eq": "node-a" } } }'
      responses:
        '200':
          description: List of networks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/nanocl.Network'
  /networks/{key}/inspect:
    get:
      tags:
      - Networks
      summary: Inspect a persisted Docker network by its deterministic key.
      operationId: inspect_network
      parameters:
      - name: key
        in: path
        description: Network key in the form node_name.network_name
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Network details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/nanocl.Network'
        '404':
          description: Network not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /nodes:
    get:
      tags:
