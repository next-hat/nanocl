          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VmSummary'
    post:
      tags:
      - Vms
      summary: Create a virtual machine
      operationId: create_vm
      parameters:
      - name: namespace
        in: query
        description: The namespace of the virtual machine
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VmSpecPartial'
        required: true
      responses:
        '200':
          description: The virtual machine has been created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vm'
        '409':
          description: The virtual machine already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /vms/count:
    get:
      tags:
      - Vms
      summary: Count vm images
      operationId: count_vm
      parameters:
      - name: filter
        in: query
        description: Generic filter
        required: false
        schema:
          type: string
        example: '{ "filter": { "where": { "name": { "eq": "global" } } } }'
      - name: namespace
        in: query
        description: Optional namespace filter; omitted or blank returns all namespaces
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Count result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericCount'
  /vms/{key}:
    delete:
      tags:
      - Vms
      summary: Delete a virtual machine by canonical key
      operationId: delete_vm
      parameters:
      - name: key
        in: path
        description: Canonical VM key in `{namespace}.{name}` format
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The virtual machine has been deleted
        '404':
          description: The virtual machine does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    patch:
      tags:
      - Vms
      summary: Patch a virtual machine config meaning merging current config with the new one and add history entry
      operationId: patch_vm
      parameters:
      - name: key
        in: path
        description: Canonical VM key in `{namespace}.{name}` format
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VmSpecUpdate'
        required: true
      responses:
        '200':
          description: Updated virtual machine
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vm'
        '404':
          description: Virtual machine not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /vms/{key}/console:
    get:
      tags:
      - Vms
      summary: Open a VM's graphical console using binary RFB over WebSocket.
      description: 'Requires Console: true and a current local VM runtime. Access follows the daemon''s configured operator access controls. Binary frames contain unmodified RFB bytes, limited to 64 KiB per frame. There is no per-user VM ownership model.'
      operationId: console_vm
      parameters:
      - name: key
        in: path
        description: Canonical VM key in `{namespace}.{name}` format
        required: true
        schema:
          type: string
      responses:
        '101':
          description: Binary RFB console WebSocket
        '403':
          description: Console is disabled
        '404':
          description: VM does not exist
        '409':
          description: VM runtime is not ready or does not match
  /vms/{key}/histories:
    get:
      tags:
      - Vms
      summary: List virtual machine histories
      operationId: list_vm_history
      parameters:
      - name: key
        in: path
        description: Canonical VM key in `{namespace}.{name}` format
        required: true
        schema:
          type: string
      - name: filter
        in: query
        description: Optional pagination JSON with limit and offset only. Omit pagination to return the complete history.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: The virtual machine histories have been listed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VmSpec'
        '400':
          description: Invalid pagination or unsupported filter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: The virtual machine does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /vms/{key}/inspect:
    get:
      tags:
      - Vms
      summary: Get detailed information about a virtual machine
      operationId: inspect_vm
      parameters:
      - name: key
        in: path
        description: Canonical VM key in `{namespace}.{name}` format
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Detailed information about a virtual machine
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VmInspect'
        '404':
          description: The virtual machine does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /vms/{key}/resize:
    post:
      tags:
      - Vms
      summary: Grow running QEMU resources without restarting the VM.
      description: |-
        Changes are not atomic. After an error, query resources before retrying;
        QEMU capacity does not confirm guest CPU/memory online state or filesystem growth.
      operationId: resize_vm
      parameters:
      - name: key
        in: path
        description: Canonical VM key in `{namespace}.{name}` format
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VmResizeOptions'
        required: true
      responses:
        '200':
          description: Observed QEMU resources and CPU/memory persistence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VmResources'
        '400':
          description: Invalid resource totals, shrink request, or boot ceiling exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: VM does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Runtime is unavailable, incompatible, or another VM operation is active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Resize or persistence failed; changes may be partially applied, query resources before retrying
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '504':
          description: Resize timed out; changes may be partially applied, query resources before retrying
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /vms/{key}/resources:
    get:
      tags:
      - Vms
      summary: Query QEMU resource totals, boot ceilings, and CPU/memory persistence.
      operationId: vm_resources
      parameters:
      - name: key
        in: path
        description: Canonical VM key in `{namespace}.{name}` format
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Observed QEMU resources and CPU/memory persistence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VmResources'
        '400':
          description: Invalid canonical VM key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: VM does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Runtime is unavailable or incompatible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '504':
          description: QMP did not respond in time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /vms/{key}/restart:
    post:
      tags:
      - Vms
      summary: Shut down a VM, then start the same runtime after confirmed exit.
      operationId: restart_vm
      parameters:
      - name: key
        in: path
        description: Canonical VM key in `{namespace}.{name}` format
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VmLifecycleOptions'
        required: true
      responses:
        '200':
          description: VM runtime has restarted
        '400':
          description: Invalid canonical key or shutdown timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: VM does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Runtime is stale or a lifecycle operation is already active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '504':
          description: VM operation timed out; check runtime status before retrying
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /vms/{key}/status:
    get:
      tags:
      - Vms
      summary: Query QEMU execution state independently of container running state.
      operationId: vm_status
      parameters:
      - name: key
        in: path
        description: Canonical VM key in `{namespace}.{name}` format
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Actual QEMU execution state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VmRuntimeStatus'
        '400':
          description: Invalid canonical VM key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: VM does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: VM runtime identity is stale or unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '504':
          description: QMP did not respond in time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /vms/{key}/stop:
    post:
      tags:
      - Vms
      summary: Shut down a VM and wait for confirmed runtime exit.
      operationId: stop_vm
      parameters:
      - name: key
        in: path
        description: Canonical VM key in `{namespace}.{name}` format
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VmLifecycleOptions'
        required: true
      responses:
        '200':
          description: VM runtime has stopped
        '400':
          description: Invalid canonical key or shutdown timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: VM does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Runtime is stale or a lifecycle operation is already active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '504':
          description: VM operation timed out; check runtime status before retrying
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /vms/{vm_key}/histories/{history_key}/revert:
    patch:
      tags:
      - Vms
      summary: Revert a virtual machine to a specific history record.
      operationId: revert_vm
      parameters:
      - name: vm_key
        in: path
        description: Canonical VM key in `{namespace}.{name}` format
        required: true
        schema:
          type: string
      - name: history_key
        in: path
        description: Specification UUID of the VM history
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Virtual machine revert accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vm'
          headers:
            X-Nanocl-Operation:
              schema:
                type: string
              description: Accepted operation UUID. Match terminal event Metadata.Operation to confirm completion.
        '400':
          description: Invalid key or history from another resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Virtual machine or history does not exist in the current incarnation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    Any:
      oneOf:
      - type: string
      - type: number
        format: double
      - type: boolean
      - type: array
        items:
          $ref: '#/components/schemas/Primitive'
      - type: object
        additionalProperties:
          $ref: '#/components/schemas/Primitive'
        propertyNames:
          type: string
      description: Helper to generate have Any type for [OpenApi](OpenApi) useful for dynamic json objects like [ResourceSpec](ResourceSpec)
    ApiError:
      type: object
      description: |-
        When returning a [HttpError](nanocl_error::http::HttpError)
        the status code is stripped and the error
        is returned as a json object with the message
        field set to the error message.
      required:
      - msg
      properties:
        msg:
          type: string
    BinaryInfo:
      type: object
      description: Details about the binary
      required:
      - Arch
      - Channel
      - Version
      - CommitId
      properties:
        Arch:
          type: string
          description: Arch is the architecture of the current binary
        Channel:
          type: string
          description: Channel is the channel of the current binary
        Version:
          type: string
          description: Version is the version of the current binary
        CommitId:
          type: string
          description: CommitID is the commit id of the current binary
    Cargo:
      type: object
      description: |-
        A Cargo is a replicable group of application containers.
        It is used to run one or multiple instances of the same container group.
        You can define the number of replicas you want to run
        The cluster will automatically scale the number of replicas to match the number of replicas you want
        Cargo contain a specification which is used to create the container
        The specification can be updated and the old specification will be kept in the history
        That way you can rollback to a previous specification quickly
      required:
      - NamespaceName
      - CreatedAt
      - Status
      - Spec
      properties:
        NamespaceName:
          type: string
          description: Name of the namespace
        CreatedAt:
          type: string
          format: date-time
          description: When the cargo was created
        Status:
          $ref: '#/components/schemas/ObjPsStatus'
          description: Status of the cargo
        Spec:
          $ref: '#/components/schemas/CargoSpecRevision'
          description: Specification of the cargo
    CargoInspect:
      type: object
      description: |-
        Cargo Inspect is a detailed view of a cargo
        It contains all the information about the cargo
        It also contains the list of containers
      required:
      - NamespaceName
      - CreatedAt
      - InstanceTotal
      - InstanceRunning
      - Status
      - Spec
      - Instances
      properties:
        NamespaceName:
          type: string
          description: Name of the namespace
        CreatedAt:
          type: string
          format: date-time
          description: When the cargo was created
        InstanceTotal:
          type: integer
          description: Number of instances
          minimum: 0
        InstanceRunning:
          type: integer
          description: Number of running instances
          minimum: 0
        Status:
          $ref: '#/components/schemas/ObjPsStatus'
          description: Status of the cargo
        Spec:
          $ref: '#/components/schemas/CargoSpecRevision'
          description: Specification of the cargo
        Instances:
          type: array
          items:
            $ref: '#/components/schemas/Process'
          description: List of instances
    CargoNetworkMode:
      type: string
      description: |-
        Docker network mode used by a Cargo.

        Docker accepts any non-blank network name in addition to its built-in
        modes. Nanocl reserves `container:<id>` because users must not join a
        container-owned network namespace directly.
    CargoPlacementSelectorSpec:
      type: object
      description: |
        Way to select specific or preferred nodes to place the cargo
      properties:
        Labels:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Select by labels
        Regions:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Select by regions
        Groups:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Select by groups
        Cargoes:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Select by cargoes running on the nodes
        Vms:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Select by vms running on the nodes
        Constraints:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/NodeConstraint'
          description: Optional advanced constraints (key/operator/value)
      additionalProperties: false
    CargoPlacementSpec:
      type: object
      description: |
        Structure to control the placement of the cargo
        It can be used to define on which nodes the cargo will be deployed
      properties:
        Strategy:
          oneOf:
          - $ref: '#/components/schemas/CargoPlacementStrategy'
            description: Strategy to use to place the cargo on the nodes
          - type: 'null'
        Regions:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Regions to deploy the cargo
        Require:
          oneOf:
          - $ref: '#/components/schemas/CargoPlacementSelectorSpec'
            description: requirements to select nodes to deploy the cargo
          - type: 'null'
        Prefer:
          oneOf:
          - $ref: '#/components/schemas/CargoPlacementSelectorSpec'
            description: preferences to select nodes to deploy the cargo
          - type: 'null'
      additionalProperties: false
    CargoPlacementStrategy:
      oneOf:
      - type: string
        enum:
        - Distinct
      - type: string
        enum:
        - LeastLoaded
      - type: string
        enum:
        - Balanced
      - type: object
        required:
        - UserDefined
        properties:
          UserDefined:
            type: string
      description: |
        Enum to define the strategy to place the cargo on the nodes
    CargoReplicaTask:
      type: object
      required:
      - Key
      - Ordinal
      properties:
        Key:
          type: string
          format: uuid
          description: Stable persisted Cargo replica identity.
        Ordinal:
          type: integer
          format: int32
          description: Stable Cargo-wide ordinal for the replica.
    CargoResourceRequirementSpec:
      type: object
      description: |
        Resource requirements for the cargo
      properties:
        CpuCores:
          type:
          - integer
          - 'null'
          description: CPU requirement in number of cores
          minimum: 0
        CpuUtilizationCap:
          type:
          - number
          - 'null'
          format: float
          description: Maximum allowed average CPU utilization on a target node (0.0 - 1.0)
        MemoryBytes:
          type:
          - integer
          - 'null'
          description: Memory requirement in bytes
          minimum: 0
        MemoryUtilizationCap:
          type:
          - number
          - 'null'
          format: float
          description: Maximum allowed average Memory utilization on a target node (0.0 - 1.0)
        CpuWeight:
          type:
          - number
          - 'null'
          format: float
          description: Optional weight for CPU in balanced placement (0.0 - 1.0)
        MemoryWeight:
          type:
          - number
          - 'null'
          format: float
          description: Optional weight for Memory in balanced placement (0.0 - 1.0)
        StorageBytes:
          type:
          - integer
          - 'null'
          description: Storage requirement in bytes
          minimum: 0
      additionalProperties: false
    CargoSpec:
      type: object
      description: Desired declaration used to create or apply a Cargo.
      required:
      - Name
      - Containers
      properties:
        Name:
          type: string
          description: Name of the cargo
        Metadata:
          type: object
          description: Metadata of the cargo (user defined)
          additionalProperties:
            $ref: '#/components/schemas/Any'
          propertyNames:
            type: string
        Replicas:
          type: integer
          description: Number of durable Cargo replicas.
          default: 1
          minimum: 1
        NetworkMode:
          oneOf:
          - $ref: '#/components/schemas/CargoNetworkMode'
            description: Cargo-owned network shared by the replica's containers.
          - type: 'null'
        PortBindings:
          oneOf:
          - $ref: '#/components/schemas/HashMap'
            description: Cargo-owned host port bindings.
          - type: 'null'
        Hostname:
          type:
          - string
          - 'null'
          description: Docker hostname assigned to the Cargo network owner.
        Dns:
          type:
          - array
          - 'null'
          items:
            type: string
          description: DNS servers assigned to the Cargo network owner.
        Secrets:
          type: array
          items:
            type: string
          description: Secrets inherited by every regular and init container.
        Placement:
          oneOf:
          - $ref: '#/components/schemas/CargoPlacementSpec'
            description: Fine tune how the cargo is placed on the nodes
          - type: 'null'
        ResourceRequirement:
          oneOf:
          - $ref: '#/components/schemas/CargoResourceRequirementSpec'
            description: Define minimal resource requirements for the cargo
          - type: 'null'
        InitContainers:
          type: array
          items:
            $ref: '#/components/schemas/ContainerSpec'
          description: |-
            Init containers executed in declaration order before application
            containers.
        Containers:
          type: array
          items:
            $ref: '#/components/schemas/ContainerSpec'
          description: Application containers in each Cargo replica.
      additionalProperties: false
    CargoSpecPatch:
      type: object
      description: |-
        Payload used to replace selected fields of a Cargo declaration.

        Collection values replace the complete corresponding collection after the
        patch is merged by the API layer.
      properties:
        Name:
          type:
          - string
          - 'null'
          description: New name of the cargo
        Metadata:
          type: object
          description: New metadata of the cargo (user defined)
          additionalProperties:
            $ref: '#/components/schemas/Any'
          propertyNames:
            type: string
        Replicas:
          type:
          - integer
          - 'null'
          description: New replica count.
          minimum: 1
        NetworkMode:
          oneOf:
          - $ref: '#/components/schemas/CargoNetworkMode'
            description: New Cargo-owned network mode.
          - type: 'null'
        PortBindings:
          oneOf:
          - $ref: '#/components/schemas/HashMap'
            description: Replacement Cargo-owned port bindings.
          - type: 'null'
        Hostname:
          type:
          - string
          - 'null'
          description: New Docker hostname for the Cargo network owner.
        Dns:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Replacement DNS servers for the Cargo network owner.
        Secrets:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Replacement Cargo-level shared secrets.
        Placement:
          oneOf:
          - $ref: '#/components/schemas/CargoPlacementSpec'
            description: Fine tune how the cargo is placed on the nodes
          - type: 'null'
        ResourceRequirement:
          oneOf:
          - $ref: '#/components/schemas/CargoResourceRequirementSpec'
            description: Define minimal resource requirements for the cargo
          - type: 'null'
        InitContainers:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ContainerSpec'
          description: Replacement ordered init-container declaration.
        Containers:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ContainerSpec'
          description: Replacement application-container declaration.
      additionalProperties: false
    CargoSpecRevision:
      type: object
      description: |-
        Stored revision of a Cargo declaration, including immutable revision
        metadata.
      required:
      - Key
      - CargoKey
      - Version
      - CreatedAt
      - Name
      - Containers
      properties:
        Key:
          type: string
          format: uuid
          description: Unique identifier of the cargo spec
        CargoKey:
          type: string
          description: Canonical cargo key in `{namespace}.{name}` format
        Version:
          type: string
          description: Version of the spec
        CreatedAt:
          type: string
          format: date-time
          description: Creation date of the cargo spec
        Name:
          type: string
          description: Name of the cargo
        Metadata:
          type: object
          description: Metadata of the cargo (user defined)
          additionalProperties:
            $ref: '#/components/schemas/Any'
          propertyNames:
            type: string
        Replicas:
          type: integer
          description: Number of durable Cargo replicas.
          default: 1
          minimum: 1
        NetworkMode:
          oneOf:
          - $ref: '#/components/schemas/CargoNetworkMode'
            description: Cargo-owned network shared by the revision's containers.
          - type: 'null'
        PortBindings:
          oneOf:
          - $ref: '#/components/schemas/HashMap'
            description: Cargo-owned host port bindings.
          - type: 'null'
        Hostname:
          type:
          - string
          - 'null'
          description: Docker hostname assigned to the Cargo network owner.
        Dns:
          type:
          - array
          - 'null'
          items:
            type: string
          description: DNS servers assigned to the Cargo network owner.
        Secrets:
          type: array
          items:
            type: string
          description: Secrets inherited by every regular and init container.
        Placement:
          oneOf:
          - $ref: '#/components/schemas/CargoPlacementSpec'
            description: Fine tune how the cargo is placed on the nodes
          - type: 'null'
        ResourceRequirement:
          oneOf:
          - $ref: '#/components/schemas/CargoResourceRequirementSpec'
          - type: 'null'
        InitContainers:
          type: array
          items:
            $ref: '#/components/schemas/ContainerSpec'
          description: Init containers executed in declaration order.
        Containers:
          type: array
          items:
            $ref: '#/components/schemas/ContainerSpec'
          description: Application containers in each Cargo replica.
    CargoSummary:
      type: object
      description: |-
        A CargoSummary is a summary of a cargo
        It's the data structure returned by the list operation
      required:
      - NamespaceName
      - Status
      - CreatedAt
      - InstanceTotal
      - InstanceRunning
      - Spec
      properties:
        NamespaceName:
          type: string
          description: Name of the namespace
        Status:
          $ref: '#/components/schemas/ObjPsStatus'
          description: Status of the cargo
        CreatedAt:
          type: string
          format: date-time
          description: When the cargo was created
        InstanceTotal:
          type: integer
          description: Number of instances
          minimum: 0
        InstanceRunning:
          type: integer
          description: Number of running instances
          minimum: 0
        Spec:
          $ref: '#/components/schemas/CargoSpecRevision'
          description: Specification of the cargo
