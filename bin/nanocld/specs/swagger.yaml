          - $ref: '#/components/schemas/SwarmSpecEncryptionConfig'
          - type: 'null'
        TaskDefaults:
          oneOf:
          - $ref: '#/components/schemas/SwarmSpecTaskDefaults'
          - type: 'null'
    SwarmSpecCaConfig:
      type: object
      description: CA configuration.
      properties:
        NodeCertExpiry:
          type:
          - integer
          - 'null'
          format: int64
          description: The duration node certificates are issued for.
        ExternalCAs:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SwarmSpecCaConfigExternalCas'
          description: Configuration for forwarding signing requests to an external certificate authority.
        SigningCACert:
          type:
          - string
          - 'null'
          description: The desired signing CA certificate for all swarm node TLS leaf certificates, in PEM format.
        SigningCAKey:
          type:
          - string
          - 'null'
          description: The desired signing CA key for all swarm node TLS leaf certificates, in PEM format.
        ForceRotate:
          type:
          - integer
          - 'null'
          format: int64
          description: An integer whose purpose is to force swarm to generate a new signing CA certificate and key, if none have been specified in `SigningCACert` and `SigningCAKey`
          minimum: 0
    SwarmSpecCaConfigExternalCas:
      type: object
      properties:
        Protocol:
          oneOf:
          - $ref: '#/components/schemas/SwarmSpecCaConfigExternalCasProtocolEnum'
            description: Protocol for communication with the external CA (currently only `cfssl` is supported).
          - type: 'null'
        URL:
          type:
          - string
          - 'null'
          description: URL where certificate signing requests should be sent.
        Options:
          type:
          - object
          - 'null'
          description: An object with key/value pairs that are interpreted as protocol-specific options for the external CA driver.
          additionalProperties:
            type: string
          propertyNames:
            type: string
        CACert:
          type:
          - string
          - 'null'
          description: The root CA certificate (in PEM format) this external CA uses to issue TLS certificates (assumed to be to the current swarm root CA certificate if not provided).
    SwarmSpecCaConfigExternalCasProtocolEnum:
      type: string
      enum:
      - EMPTY
      - cfssl
    SwarmSpecDispatcher:
      type: object
      description: Dispatcher configuration.
      properties:
        HeartbeatPeriod:
          type:
          - integer
          - 'null'
          format: int64
          description: The delay for an agent to send a heartbeat to the dispatcher.
    SwarmSpecEncryptionConfig:
      type: object
      description: Parameters related to encryption-at-rest.
      properties:
        AutoLockManagers:
          type:
          - boolean
          - 'null'
          description: If set, generate a key and use it to lock data stored on the managers.
    SwarmSpecOrchestration:
      type: object
      description: Orchestration configuration.
      properties:
        TaskHistoryRetentionLimit:
          type:
          - integer
          - 'null'
          format: int64
          description: The number of historic tasks to keep per instance or node. If negative, never remove completed or failed tasks.
    SwarmSpecRaft:
      type: object
      description: Raft configuration.
      properties:
        SnapshotInterval:
          type:
          - integer
          - 'null'
          format: int64
          description: The number of log entries between snapshots.
          minimum: 0
        KeepOldSnapshots:
          type:
          - integer
          - 'null'
          format: int64
          description: The number of snapshots to keep beyond the current snapshot.
          minimum: 0
        LogEntriesForSlowFollowers:
          type:
          - integer
          - 'null'
          format: int64
          description: The number of log entries to keep around to sync up slow followers after a snapshot is created.
          minimum: 0
        ElectionTick:
          type:
          - integer
          - 'null'
          format: int64
          description: The number of ticks that a follower will wait for a message from the leader before becoming a candidate and starting an election. `ElectionTick` must be greater than `HeartbeatTick`.  A tick currently defaults to one second, so these translate directly to seconds currently, but this is NOT guaranteed.
        HeartbeatTick:
          type:
          - integer
          - 'null'
          format: int64
          description: The number of ticks between heartbeats. Every HeartbeatTick ticks, the leader will send a heartbeat to the followers.  A tick currently defaults to one second, so these translate directly to seconds currently, but this is NOT guaranteed.
    SwarmSpecTaskDefaults:
      type: object
      description: Defaults for creating tasks in this cluster.
      properties:
        LogDriver:
          oneOf:
          - $ref: '#/components/schemas/SwarmSpecTaskDefaultsLogDriver'
          - type: 'null'
    SwarmSpecTaskDefaultsLogDriver:
      type: object
      description: The log driver to use for tasks created in the orchestrator if unspecified by a service.  Updating this value only affects new tasks. Existing tasks continue to use their previously configured log driver until recreated.
      properties:
        Name:
          type:
          - string
          - 'null'
          description: The log driver to use as a default for new tasks.
        Options:
          type:
          - object
          - 'null'
          description: Driver-specific options for the selected log driver, specified as key/value pairs.
          additionalProperties:
            type: string
          propertyNames:
            type: string
    SystemInfo:
      type: object
      properties:
        ID:
          type:
          - string
          - 'null'
          description: 'Unique identifier of the daemon.  <p><br /></p>  > **Note**: The format of the ID itself is not part of the API, and > should not be considered stable.'
        Containers:
          type:
          - integer
          - 'null'
          format: int64
          description: Total number of containers on the host.
        ContainersRunning:
          type:
          - integer
          - 'null'
          format: int64
          description: Number of containers with status `\"running\"`.
        ContainersPaused:
          type:
          - integer
          - 'null'
          format: int64
          description: Number of containers with status `\"paused\"`.
        ContainersStopped:
          type:
          - integer
          - 'null'
          format: int64
          description: Number of containers with status `\"stopped\"`.
        Images:
          type:
          - integer
          - 'null'
          format: int64
          description: Total number of images on the host.  Both _tagged_ and _untagged_ (dangling) images are counted.
        Driver:
          type:
          - string
          - 'null'
          description: Name of the storage driver in use.
        DriverStatus:
          type:
          - array
          - 'null'
          items:
            type: array
            items:
              type: string
          description: 'Information specific to the storage driver, provided as \"label\" / \"value\" pairs.  This information is provided by the storage driver, and formatted in a way consistent with the output of `docker info` on the command line.  <p><br /></p>  > **Note**: The information returned in this field, including the > formatting of values and labels, should not be considered stable, > and may change without notice.'
        DockerRootDir:
          type:
          - string
          - 'null'
          description: Root directory of persistent Docker state.  Defaults to `/var/lib/docker` on Linux, and `C:\\ProgramData\\docker` on Windows.
        Plugins:
          oneOf:
          - $ref: '#/components/schemas/PluginsInfo'
          - type: 'null'
        MemoryLimit:
          type:
          - boolean
          - 'null'
          description: Indicates if the host has memory limit support enabled.
        SwapLimit:
          type:
          - boolean
          - 'null'
          description: Indicates if the host has memory swap limit support enabled.
        CpuCfsPeriod:
          type:
          - boolean
          - 'null'
          description: Indicates if CPU CFS(Completely Fair Scheduler) period is supported by the host.
        CpuCfsQuota:
          type:
          - boolean
          - 'null'
          description: Indicates if CPU CFS(Completely Fair Scheduler) quota is supported by the host.
        CPUShares:
          type:
          - boolean
          - 'null'
          description: Indicates if CPU Shares limiting is supported by the host.
        CPUSet:
          type:
          - boolean
          - 'null'
          description: Indicates if CPUsets (cpuset.cpus, cpuset.mems) are supported by the host.  See [cpuset(7)](https://www.kernel.org/doc/Documentation/cgroup-v1/cpusets.txt)
        PidsLimit:
          type:
          - boolean
          - 'null'
          description: Indicates if the host kernel has PID limit support enabled.
        OomKillDisable:
          type:
          - boolean
          - 'null'
          description: Indicates if OOM killer disable is supported on the host.
        IPv4Forwarding:
          type:
          - boolean
          - 'null'
          description: Indicates IPv4 forwarding is enabled.
        Debug:
          type:
          - boolean
          - 'null'
          description: Indicates if the daemon is running in debug-mode / with debug-level logging enabled.
        NFd:
          type:
          - integer
          - 'null'
          format: int64
          description: The total number of file Descriptors in use by the daemon process.  This information is only returned if debug-mode is enabled.
        NGoroutines:
          type:
          - integer
          - 'null'
          format: int64
          description: The  number of goroutines that currently exist.  This information is only returned if debug-mode is enabled.
        SystemTime:
          type:
          - string
          - 'null'
          description: Current system-time in [RFC 3339](https://www.ietf.org/rfc/rfc3339.txt) format with nano-seconds.
        LoggingDriver:
          type:
          - string
          - 'null'
          description: The logging driver to use as a default for new containers.
        CgroupDriver:
          oneOf:
          - $ref: '#/components/schemas/SystemInfoCgroupDriverEnum'
            description: The driver to use for managing cgroups.
          - type: 'null'
        CgroupVersion:
          oneOf:
          - $ref: '#/components/schemas/SystemInfoCgroupVersionEnum'
            description: The version of the cgroup.
          - type: 'null'
        NEventsListener:
          type:
          - integer
          - 'null'
          format: int64
          description: Number of event listeners subscribed.
        KernelVersion:
          type:
          - string
          - 'null'
          description: Kernel version of the host.  On Linux, this information obtained from `uname`. On Windows this information is queried from the <kbd>HKEY_LOCAL_MACHINE\\\\SOFTWARE\\\\Microsoft\\\\Windows NT\\\\CurrentVersion\\\\</kbd> registry value, for example _\"10.0 14393 (14393.1198.amd64fre.rs1_release_sec.170427-1353)\"_.
        OperatingSystem:
          type:
          - string
          - 'null'
          description: 'Name of the host''s operating system, for example: \"Ubuntu 24.04 LTS\" or \"Windows Server 2016 Datacenter\"'
        OSVersion:
          type:
          - string
          - 'null'
          description: 'Version of the host''s operating system  <p><br /></p>  > **Note**: The information returned in this field, including its > very existence, and the formatting of values, should not be considered > stable, and may change without notice.'
        OSType:
          type:
          - string
          - 'null'
          description: Generic type of the operating system of the host, as returned by the Go runtime (`GOOS`).  Currently returned values are \"linux\" and \"windows\". A full list of possible values can be found in the [Go documentation](https://go.dev/doc/install/source#environment).
        Architecture:
          type:
          - string
          - 'null'
          description: Hardware architecture of the host, as returned by the operating system. This is equivalent to the output of `uname -m` on Linux.  Unlike `Arch` (from `/version`), this reports the machine's native architecture, which can differ from the Go runtime architecture when running a binary compiled for a different architecture (for example, a 32-bit binary running on 64-bit hardware).
        NCPU:
          type:
          - integer
          - 'null'
          format: int64
          description: The number of logical CPUs usable by the daemon.  The number of available CPUs is checked by querying the operating system when the daemon starts. Changes to operating system CPU allocation after the daemon is started are not reflected.
        MemTotal:
          type:
          - integer
          - 'null'
          format: int64
          description: Total amount of physical memory available on the host, in bytes.
        IndexServerAddress:
          type:
          - string
          - 'null'
          description: Address / URL of the index server that is used for image search, and as a default for user authentication for Docker Hub and Docker Cloud.
        RegistryConfig:
          oneOf:
          - $ref: '#/components/schemas/RegistryServiceConfig'
          - type: 'null'
        GenericResources:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/GenericResourcesInner'
        HttpProxy:
          type:
          - string
          - 'null'
          description: HTTP-proxy configured for the daemon. This value is obtained from the [`HTTP_PROXY`](https://www.gnu.org/software/wget/manual/html_node/Proxies.html) environment variable. Credentials ([user info component](https://tools.ietf.org/html/rfc3986#section-3.2.1)) in the proxy URL are masked in the API response.  Containers do not automatically inherit this configuration.
        HttpsProxy:
          type:
          - string
          - 'null'
          description: HTTPS-proxy configured for the daemon. This value is obtained from the [`HTTPS_PROXY`](https://www.gnu.org/software/wget/manual/html_node/Proxies.html) environment variable. Credentials ([user info component](https://tools.ietf.org/html/rfc3986#section-3.2.1)) in the proxy URL are masked in the API response.  Containers do not automatically inherit this configuration.
        NoProxy:
          type:
          - string
          - 'null'
          description: Comma-separated list of domain extensions for which no proxy should be used. This value is obtained from the [`NO_PROXY`](https://www.gnu.org/software/wget/manual/html_node/Proxies.html) environment variable.  Containers do not automatically inherit this configuration.
        Name:
          type:
          - string
          - 'null'
          description: Hostname of the host.
        Labels:
          type:
          - array
          - 'null'
          items:
            type: string
          description: 'User-defined labels (key/value metadata) as set on the daemon.  <p><br /></p>  > **Note**: When part of a Swarm, nodes can both have _daemon_ labels, > set through the daemon configuration, and _node_ labels, set from a > manager node in the Swarm. Node labels are not included in this > field. Node labels can be retrieved using the `/nodes/(id)` endpoint > on a manager node in the Swarm.'
        ExperimentalBuild:
          type:
          - boolean
          - 'null'
          description: Indicates if experimental features are enabled on the daemon.
        ServerVersion:
          type:
          - string
          - 'null'
          description: Version string of the daemon.
        Runtimes:
          type:
          - object
          - 'null'
          description: List of [OCI compliant](https://github.com/opencontainers/runtime-spec) runtimes configured on the daemon. Keys hold the \"name\" used to reference the runtime.  The Docker daemon relies on an OCI compliant runtime (invoked via the `containerd` daemon) as its interface to the Linux kernel namespaces, cgroups, and SELinux.  The default runtime is `runc`, and automatically configured. Additional runtimes can be configured by the user and will be listed here.
          additionalProperties:
            $ref: '#/components/schemas/Runtime'
          propertyNames:
            type: string
        DefaultRuntime:
          type:
          - string
          - 'null'
          description: Name of the default OCI runtime that is used when starting containers.  The default can be overridden per-container at create time.
        Swarm:
          oneOf:
          - $ref: '#/components/schemas/SwarmInfo'
          - type: 'null'
        LiveRestoreEnabled:
          type:
          - boolean
          - 'null'
          description: Indicates if live restore is enabled.  If enabled, containers are kept running when the daemon is shutdown or upon daemon start if running containers are detected.
        Isolation:
          oneOf:
          - $ref: '#/components/schemas/SystemInfoIsolationEnum'
            description: Represents the isolation technology to use as a default for containers. The supported values are platform-specific.  If no isolation value is specified on daemon start, on Windows client, the default is `hyperv`, and on Windows server, the default is `process`.  This option is currently not used on other platforms.
          - type: 'null'
        InitBinary:
          type:
          - string
          - 'null'
          description: Name and, optional, path of the `docker-init` binary.  If the path is omitted, the daemon searches the host's `$PATH` for the binary and uses the first result.
        ContainerdCommit:
          oneOf:
          - $ref: '#/components/schemas/Commit'
          - type: 'null'
        RuncCommit:
          oneOf:
          - $ref: '#/components/schemas/Commit'
          - type: 'null'
        InitCommit:
          oneOf:
          - $ref: '#/components/schemas/Commit'
          - type: 'null'
        SecurityOptions:
          type:
          - array
          - 'null'
          items:
            type: string
          description: List of security features that are enabled on the daemon, such as apparmor, seccomp, SELinux, user-namespaces (userns), rootless and no-new-privileges.  Additional configuration options for each security feature may be present, and are included as a comma-separated list of key/value pairs.
        ProductLicense:
          type:
          - string
          - 'null'
          description: Reports a summary of the product license on the daemon.  If a commercial license has been applied to the daemon, information such as number of nodes, and expiration are included.
        DefaultAddressPools:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SystemInfoDefaultAddressPools'
          description: 'List of custom default address pools for local networks, which can be specified in the daemon.json file or dockerd option.  Example: a Base \"10.10.0.0/16\" with Size 24 will define the set of 256 10.10.[0-255].0/24 address pools.'
        FirewallBackend:
          oneOf:
          - $ref: '#/components/schemas/FirewallInfo'
          - type: 'null'
        DiscoveredDevices:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/DeviceInfo'
          description: List of devices discovered by device drivers.  Each device includes information about its source driver, kind, name, and additional driver-specific attributes.
        NRI:
          oneOf:
          - $ref: '#/components/schemas/NriInfo'
          - type: 'null'
        Warnings:
          type:
          - array
          - 'null'
          items:
            type: string
          description: List of warnings / informational messages about missing features, or issues related to the daemon configuration.  These messages can be printed by the client as information to the user.
        CDISpecDirs:
          type:
          - array
          - 'null'
          items:
            type: string
          description: List of directories where (Container Device Interface) CDI specifications are located.  These specifications define vendor-specific modifications to an OCI runtime specification for a container being created.  An empty list indicates that CDI device injection is disabled.  Note that since using CDI device injection requires the daemon to have experimental enabled. For non-experimental daemons an empty list will always be returned.
        Containerd:
          oneOf:
          - $ref: '#/components/schemas/ContainerdInfo'
          - type: 'null'
    SystemInfoCgroupDriverEnum:
      type: string
      enum:
      - EMPTY
      - cgroupfs
      - systemd
      - none
    SystemInfoCgroupVersionEnum:
      type: string
      enum:
      - EMPTY
      - '1'
      - '2'
    SystemInfoDefaultAddressPools:
      type: object
      properties:
        Base:
          type:
          - string
          - 'null'
          description: The network address in CIDR format
        Size:
          type:
          - integer
          - 'null'
          format: int64
          description: The network pool size
    SystemInfoIsolationEnum:
      type: string
      enum:
      - default
      - hyperv
      - process
      - EMPTY
    ThrottleDevice:
      type: object
      properties:
        Path:
          type:
          - string
          - 'null'
          description: Device path
        Rate:
          type:
          - integer
          - 'null'
          format: int64
          description: Rate
    TlsInfo:
      type: object
      description: Information about the issuer of leaf TLS certificates and the trusted root CA certificate.
      properties:
        TrustRoot:
          type:
          - string
          - 'null'
          description: The root CA certificate(s) that are used to validate leaf TLS certificates.
        CertIssuerSubject:
          type:
          - string
          - 'null'
          description: The base64-url-safe-encoded raw subject bytes of the issuer.
        CertIssuerPublicKey:
          type:
          - string
          - 'null'
          description: The base64-url-safe-encoded raw public key bytes of the issuer.
    UnixTarget:
      type: object
      required:
      - UnixPath
      properties:
        UnixPath:
          type: string
      additionalProperties: false
    UpstreamTarget:
      type: object
      description: Config for targeting a cargo or a vm
      required:
      - Key
      - Port
      properties:
        Key:
          type: string
          description: The key of the cargo or the vm to target
        Port:
          type: integer
          format: int32
          description: The port of the cargo or the vm to target
          minimum: 0
        Path:
          type:
          - string
          - 'null'
          description: The http path to target when using http
        EnableLogging:
          type:
          - boolean
          - 'null'
          description: Enable Nginx file access logging for this target (disabled by default).
        Ssl:
          oneOf:
          - $ref: '#/components/schemas/ProxySsl'
            description: SSL configuration for this target
          - type: 'null'
      additionalProperties: false
    UriTarget:
      type: object
      required:
      - Uri
      properties:
        Uri:
          type: string
          description: Uri to target
      additionalProperties: false
    UrlRedirect:
      type: string
      enum:
      - MovedPermanently
      - Permanent
      - Temporary
    Vm:
      type: object
      description: A virtual machine instance
      required:
      - NamespaceName
      - CreatedAt
      - Status
      - Spec
      properties:
        NamespaceName:
          type: string
          description: Name of the namespace
        CreatedAt:
          type: string
          format: date-time
          description: When the vm was created
        Status:
          $ref: '#/components/schemas/ObjPsStatus'
          description: Status of the vm
        Spec:
          $ref: '#/components/schemas/VmSpec'
          description: Specification of the vm
    VmCloudInitUserData:
      oneOf:
      - type: string
        description: Verbatim user-data, including an empty string. The daemon enforces a 65536-byte UTF-8 limit; maxLength bounds characters, so non-ASCII text may reach the byte limit sooner.
        maxLength: 65536
      - $ref: '#/components/schemas/CloudInit26_2'
      - type: 'null'
        description: Restore generated User/Password/SshKey provisioning
      description: 'Complete cloud-init user-data: raw text or a cloud-config object. Replaces generated user setup; rendered UTF-8 is limited to 64 KiB. The upstream schema documents the object format; NanoCL does not validate guest module semantics.'
    VmHostConfig:
      type: object
      description: A vm's resources (cpu, memory, network)
      required:
      - Cpu
      - Memory
      properties:
        Cpu:
          type: integer
          format: int64
          description: 'Number of cpu of the vm (default: 1)'
          minimum: 0
        Memory:
          type: integer
          format: int64
          description: 'Memory of the vm in MB (default: 512)'
          minimum: 0
        MaxCpu:
          type:
          - integer
          - 'null'
          format: int64
          description: Maximum vCPU count reserved at boot; omitted uses Cpu and disables CPU growth.
          maximum: 255
          minimum: 1
        MaxMemory:
          type:
          - integer
          - 'null'
          format: int64
          description: Maximum memory in MiB reserved at boot; omitted uses Memory and disables memory growth.
          maximum: 8796093022207
          minimum: 1
        NetIface:
          type:
          - string
          - 'null'
          description: 'Network interface of the vm to setup (default: nanocl0)'
        LinkNetIface:
          type:
          - string
          - 'null'
          description: |-
            Docker uplink interface (default: discovered by the runtime).
            If supplied, it must match the network's container interface prefix plus 0.
        Kvm:
          type:
          - boolean
          - 'null'
          description: 'Enable KVM acceleration (default: false)'
        Dns:
          type:
          - array
          - 'null'
          items:
            type: string
          description: A list of DNS servers for the vm to use
        Runtime:
          type:
          - string
          - 'null'
          description: 'Container image name to use for vm (default: nanocl-qemu)'
        NetworkMode:
          type:
          - string
          - 'null'
          description: Container network used by the VM runtime.
        HostTun:
          type:
          - boolean
          - 'null'
          description: Use host tun device
      additionalProperties: false
    VmHostConfigUpdate:
      type: object
      description: |-
        Host settings changed by PATCH. Omitted settings retain their current value;
        explicit null clears optional settings.
      properties:
        Cpu:
          type: integer
          format: int64
          minimum: 0
        Memory:
          type: integer
          format: int64
          minimum: 0
        MaxCpu:
          type:
          - integer
          - 'null'
          format: int64
          maximum: 255
          minimum: 1
        MaxMemory:
          type:
          - integer
          - 'null'
          format: int64
          maximum: 8796093022207
          minimum: 1
        NetIface:
          type:
          - string
          - 'null'
        LinkNetIface:
          type:
          - string
          - 'null'
        Kvm:
          type:
          - boolean
          - 'null'
        Dns:
          type:
          - array
          - 'null'
          items:
            type: string
        Runtime:
          type:
          - string
          - 'null'
        NetworkMode:
          type:
          - string
          - 'null'
        HostTun:
          type:
          - boolean
          - 'null'
      additionalProperties: false
    VmInspect:
      type: object
      description: |-
        A Vm Inspect is a detailed view of a vm
        It is used to inspect a vm
        It contains all the information about the vm
        It also contains the list of containers
      required:
      - NamespaceName
      - CreatedAt
      - InstanceTotal
      - InstanceRunning
      - Status
      - Spec
      - Instances
      properties:
        NamespaceName:
          type: string
          description: Name of the namespace
        CreatedAt:
          type: string
          format: date-time
          description: Creation date of the vm
        InstanceTotal:
          type: integer
          description: Number of instances
          minimum: 0
        InstanceRunning:
          type: integer
          description: Number of running instances
          minimum: 0
        Status:
          $ref: '#/components/schemas/ObjPsStatus'
          description: Status of the vm
        Spec:
          $ref: '#/components/schemas/VmSpec'
          description: Specification of the vm
        Instances:
          type: array
          items:
            $ref: '#/components/schemas/Process'
          description: List of instances
    VmLifecycleOptions:
      type: object
      description: Options for stopping or restarting a VM through its private QMP socket.
      properties:
        Timeout:
          type: integer
          format: int64
          description: Seconds to wait for the guest to shut down cleanly (1 through 3600).
          default: 60
          maximum: 3600
          minimum: 1
        Force:
          type: boolean
          description: Explicitly power off the VM without waiting for guest shutdown.
          default: false
    VmResizeOptions:
      type: object
      description: Grow QEMU resources without restarting the VM. Multiple changes are not atomic.
      properties:
        Cpu:
          type:
          - integer
          - 'null'
          format: int64
          description: Requested total vCPU count; must not decrease the current count.
          minimum: 1
        Memory:
          type:
          - integer
          - 'null'
          format: int64
          description: Requested total QEMU memory in MiB; must not decrease current memory.
          minimum: 1
        DiskSize:
          type:
          - integer
          - 'null'
          format: int64
          description: Requested total boot disk size in bytes; guest partitions and filesystems are unchanged.
          minimum: 1
      additionalProperties: false
    VmResources:
      type: object
      description: Resources observed in QEMU, not guest-online CPUs, memory, or filesystem capacity.
      required:
      - Cpu
      - Memory
      - DiskSize
      - MaxCpu
      - MaxMemory
      - Persistent
      properties:
        Cpu:
          type: integer
          format: int64
          description: Current QEMU vCPU count.
          minimum: 0
        Memory:
          type: integer
          format: int64
          description: Current QEMU memory in MiB.
          minimum: 0
        DiskSize:
          type: integer
          format: int64
          description: Current boot disk size in bytes.
          minimum: 0
        MaxCpu:
          type: integer
          format: int64
          description: Maximum vCPU count reserved when this runtime was created.
          minimum: 0
        MaxMemory:
          type: integer
          format: int64
          description: Maximum memory in MiB reserved when this runtime was created.
          minimum: 0
        Persistent:
          type: boolean
          description: Whether observed CPU and memory match both the saved specification and restart configuration.
    VmRuntimeStatus:
      type: object
      description: Current QEMU execution state, distinct from the runtime container state.
      required:
      - Running
      - Status
      properties:
        Running:
          type: boolean
          description: Whether QEMU is executing guest CPUs.
        Status:
          type: string
          description: QEMU run state, or `exited` when the runtime container is stopped.
    VmSpec:
      type: object
      description: |-
        A vm spec is the specification of a vm
        It used to know the state of the vm
        It keep tracking of an history when you patch an existing vm
      required:
      - Key
      - CreatedAt
      - Name
      - Version
      - VmKey
      - Image
      - HostConfig
      properties:
        Key:
          type: string
          format: uuid
          description: Unique identifier of the vm spec
        CreatedAt:
          type: string
          format: date-time
          description: Creation date of the vm spec
        Name:
          type: string
          description: Name of the vm
        Version:
          type: string
          description: Version of the spec
        VmKey:
          type: string
          description: Canonical VM key in `{namespace}.{name}` format
        Metadata:
          type: object
          description: The metadata (user defined)
          additionalProperties:
            $ref: '#/components/schemas/Any'
          propertyNames:
            type: string
        Hostname:
          type:
          - string
          - 'null'
          description: Hostname of the vm
        Password:
          type:
          - string
          - 'null'
          description: Default password of the vm (cloud)
        SshKey:
          type:
          - string
          - 'null'
          description: Default ssh key for the user
        InitContainer:
          oneOf:
          - $ref: '#/components/schemas/ContainerCreateBody'
            description: Action to run before the VM runtime container
          - type: 'null'
        CloudInit:
          type:
          - boolean
          - 'null'
          description: 'Enable cloud-init provisioning (default: true).'
        CloudInitUserData:
          $ref: '#/components/schemas/VmCloudInitUserData'
          description: |-
            Complete cloud-init user-data as raw text or a cloud-config object.
            Replaces generated user setup; rendered UTF-8 is limited to 64 KiB.
            NanoCL retains its instance ID and DHCP network configuration.
            Stored but ignored when CloudInit is false.
        Console:
          type:
          - boolean
          - 'null'
          description: 'Enable the authenticated browser console (default: false).'
        User:
          type:
          - string
          - 'null'
          description: Default user of the vm (cloud)
        Image:
          type: string
          description: 'The image the vm will use, it must be a full path to the image (ex: /var/lib/nanocl/vm/image.qcow2)'
        MacAddress:
          type:
          - string
          - 'null'
          description: Mac address of the vm
        Labels:
          type:
          - object
          - 'null'
          description: User-defined key/value metadata.
          additionalProperties:
            type: string
          propertyNames:
            type: string
        HostConfig:
          $ref: '#/components/schemas/VmHostConfig'
          description: A vm's resources (cpu, memory, network)
    VmSpecPartial:
      type: object
      description: A vm spec partial is used to create a vm
      required:
      - Name
      - Image
      properties:
        Name:
          type: string
          description: Name of the vm
        Metadata:
          type: object
          description: The metadata (user defined)
          additionalProperties:
            $ref: '#/components/schemas/Any'
          propertyNames:
            type: string
        Hostname:
          type:
          - string
          - 'null'
          description: 'Hostname of the vm (default: generated from name)'
        User:
          type:
          - string
          - 'null'
          description: |-
            Default user of the vm (default: cloud).
            With CloudInit enabled, use lowercase ASCII letters, digits, underscores
            or hyphens, starting with a letter or underscore.
        Password:
          type:
          - string
          - 'null'
          description: 'Default password of the vm (default: cloud)'
        SshKey:
          type:
          - string
          - 'null'
          description: Default ssh pub key for the user (recommended)
        InitContainer:
          oneOf:
          - $ref: '#/components/schemas/ContainerCreateBody'
            description: Action to run before the VM runtime container
          - type: 'null'
        CloudInit:
          type:
          - boolean
          - 'null'
          description: |-
            Enable cloud-init provisioning (default: true).
            Guest networking uses DHCP independently of this setting.
        CloudInitUserData:
          $ref: '#/components/schemas/VmCloudInitUserData'
          description: |-
            Complete cloud-init user-data as raw text or a cloud-config object.
            Replaces generated user setup; rendered UTF-8 is limited to 64 KiB.
            NanoCL retains its instance ID and DHCP network configuration.
            Stored but ignored when CloudInit is false.
            Explicit null restores generated user setup; omission preserves existing data on apply.
        Console:
          type:
          - boolean
          - 'null'
          description: 'Enable the authenticated browser console (default: false).'
        Image:
          type: string
          description: 'The image the vm will use, it must be a full path to the image (ex: /var/lib/nanocl/vm/image.qcow2)'
        MacAddress:
          type:
          - string
          - 'null'
          description: 'Mac address of the vm (default: generated)'
        Labels:
          type:
          - object
          - 'null'
          description: User-defined key/value metadata.
          additionalProperties:
            type: string
          propertyNames:
            type: string
        HostConfig:
          oneOf:
          - $ref: '#/components/schemas/VmHostConfig'
            description: A vm's resources (cpu, memory, network)
          - type: 'null'
      additionalProperties: false
    VmSpecUpdate:
      type: object
      description: |
        ## VmSpecUpdate

        Payload used to patch a vm
        It will create a new [VmSpec](VmSpec) with the new values
        and keep the old values in the history
      properties:
        Name:
          type:
          - string
          - 'null'
          description: Name of the vm
        Metadata:
          type: object
          description: The metadata (user defined)
          additionalProperties:
            $ref: '#/components/schemas/Any'
          propertyNames:
            type: string
        Hostname:
          type:
          - string
          - 'null'
          description: Hostname of the vm
        User:
          type:
          - string
          - 'null'
          description: Default user of the vm (cloud)
        Password:
          type:
          - string
          - 'null'
          description: Default password of the vm (cloud)
        SshKey:
          type:
          - string
          - 'null'
          description: Default ssh key for the user
        InitContainer:
          oneOf:
          - $ref: '#/components/schemas/ContainerCreateBody'
            description: Action to run before the VM runtime container
          - type: 'null'
        CloudInit:
          type:
          - boolean
          - 'null'
          description: Enable cloud-init provisioning; omitted preserves the current setting.
        CloudInitUserData:
          $ref: '#/components/schemas/VmCloudInitUserData'
          description: |-
            Complete cloud-init user-data as raw text or a cloud-config object.
            Replaces generated user setup; rendered UTF-8 is limited to 64 KiB.
            Omitted preserves the current data; null restores generated user setup.
            An empty string replaces the data with an empty document.
            Stored but ignored when CloudInit is false.
        Console:
          type:
          - boolean
          - 'null'
          description: Enable the authenticated browser console; omitted preserves the setting.
        MacAddress:
          type:
          - string
          - 'null'
          description: Stable MAC identity. If supplied, it must match the existing address.
        Labels:
          type:
          - object
          - 'null'
          description: User-defined key/value metadata.
          additionalProperties:
            type: string
          propertyNames:
            type: string
        HostConfig:
          oneOf:
          - $ref: '#/components/schemas/VmHostConfigUpdate'
            description: A vm's resources (cpu, memory, network)
          - type: 'null'
      additionalProperties: false
    VmSummary:
      type: object
      description: |-
        A Vm Summary is a summary of a vm
        It is used to list all the vms
      required:
      - NamespaceName
      - Status
      - CreatedAt
      - InstanceTotal
      - InstanceRunning
      - Spec
      properties:
        NamespaceName:
          type: string
          description: Name of the namespace
        Status:
          $ref: '#/components/schemas/ObjPsStatus'
          description: Status of the vm
        CreatedAt:
          type: string
          format: date-time
          description: Creation date of the vm
        InstanceTotal:
          type: integer
          description: Number of instances
          minimum: 0
        InstanceRunning:
          type: integer
          description: Number of running instances
          minimum: 0
        Spec:
          $ref: '#/components/schemas/VmSpec'
          description: Specification of the vm
    nanocl.Network:
      type: object
      description: A Docker network snapshot stored by Nanocl for one node.
      required:
      - Key
      - CreatedAt
      - UpdatedAt
      - Name
      - NodeName
      - Data
      properties:
        Key:
          type: string
          description: Stable key in the form `{node_name}.{network_name}`.
        CreatedAt:
          type: string
          format: date-time
          description: When this network was first recorded.
        UpdatedAt:
          type: string
          format: date-time
          description: When the Docker inspection snapshot was last refreshed.
        Name:
          type: string
          description: Docker network name.
        NodeName:
          type: string
          description: Node whose Docker daemon owns this network.
        Data:
          $ref: '#/components/schemas/NetworkInspect'
          description: Complete Docker network inspection response.
        Metadata:
          description: User-defined metadata retained across snapshot refreshes.
