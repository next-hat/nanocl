    CloudInit26_2.cc_apk_configure:
      type: object
      properties:
        apk_repos:
          additionalProperties: false
          minProperties: 1
          properties:
            alpine_repo:
              additionalProperties: false
              minProperties: 1
              properties:
                base_url:
                  default: https://dl-cdn.alpinelinux.org/alpine
                  description: The base URL of an Alpine repository, or mirror, to download official packages from. If not specified then it defaults to ``https://dl-cdn.alpinelinux.org/alpine``.
                  type: string
                community_enabled:
                  default: false
                  description: Whether to add the Community repo to the repositories file. By default the Community repo is not included.
                  type: boolean
                testing_enabled:
                  default: false
                  description: Whether to add the Testing repo to the repositories file. By default the Testing repo is not included. It is only recommended to use the Testing repo on a machine running the ``Edge`` version of Alpine as packages installed from Testing may have dependencies that conflict with those in non-Edge Main or Community repos.
                  type: boolean
                version:
                  description: The Alpine version to use (e.g. ``v3.12`` or ``edge``).
                  type: string
              required:
              - version
              type:
              - object
              - 'null'
            local_repo_base_url:
              description: The base URL of an Alpine repository containing unofficial packages.
              type: string
            preserve_repositories:
              default: false
              description: |-
                By default, cloud-init will generate a new repositories file ``/etc/apk/repositories`` based on any valid configuration settings specified within a apk_repos section of cloud config. To disable this behavior and preserve the repositories file from the pristine image, set **preserve_repositories** to ``true``.
                The **preserve_repositories** option overrides all other config keys that would alter ``/etc/apk/repositories``.
              type: boolean
          type: object
    CloudInit26_2.cc_apt_configure:
      properties:
        apt:
          additionalProperties: false
          minProperties: 1
          properties:
            add_apt_repo_match:
              default: ^[\w-]+:\w
              description: All source entries in ``apt-sources`` that match regex in **add_apt_repo_match** will be added to the system using ``add-apt-repository``. If **add_apt_repo_match** is not specified, it defaults to ``^[\w-]+:\w``.
              type: string
            conf:
              description: Specify configuration for apt, such as proxy configuration. This configuration is specified as a string. For multi-line APT configuration, make sure to follow YAML syntax.
              type: string
            debconf_selections:
              additionalProperties: false
              description: |-
                Debconf additional configurations can be specified as a dictionary under the **debconf_selections** config key, with each key in the dict representing a different set of configurations. The value of each key must be a string containing all the debconf configurations that must be applied. We will bundle all of the values and pass them to **debconf-set-selections**. Therefore, each value line must be a valid entry for ``debconf-set-selections``, meaning that they must possess for distinct fields:

                ``pkgname question type answer``

                Where:
                - ``pkgname`` is the name of the package.
                - ``question`` the name of the questions.
                - ``type`` is the type of question.
                - ``answer`` is the value used to answer the question.

                For example: ``ippackage ippackage/ip string 127.0.01``.
              minProperties: 1
              patternProperties:
                ^.+$:
                  type: string
              type: object
            disable_suites:
              description: |-
                Entries in the sources list can be disabled using **disable_suites**, which takes a list of suites to be disabled. If the string ``$RELEASE`` is present in a suite in the **disable_suites** list, it will be replaced with the release name. If a suite specified in **disable_suites** is not present in ``sources.list`` it will be ignored. For convenience, several aliases are provided for **disable_suites**:
                - ``updates`` => ``$RELEASE-updates``
                - ``backports`` => ``$RELEASE-backports``
                - ``security`` => ``$RELEASE-security``
                - ``proposed`` => ``$RELEASE-proposed``
                - ``release`` => ``$RELEASE``.

                When a suite is disabled using **disable_suites**, its entry in ``sources.list`` is not deleted; it is just commented out.
              items:
                type: string
              minItems: 1
              type: array
              uniqueItems: true
            ftp_proxy:
              description: More convenient way to specify ftp APT proxy. ftp proxy url is specified in the format ``ftp://[[user][:pass]@]host[:port]/``.
              type: string
            http_proxy:
              description: More convenient way to specify http APT proxy. http proxy url is specified in the format ``http://[[user][:pass]@]host[:port]/``.
              type: string
            https_proxy:
              description: More convenient way to specify https APT proxy. https proxy url is specified in the format ``https://[[user][:pass]@]host[:port]/``.
              type: string
            preserve_sources_list:
              default: false
              description: |-
                By default, cloud-init will generate a new sources list in ``/etc/apt/sources.list.d`` based on any changes specified in cloud config. To disable this behavior and preserve the sources list from the pristine image, set **preserve_sources_list** to ``true``.

                The **preserve_sources_list** option overrides all other config keys that would alter ``sources.list`` or ``sources.list.d``, **except** for additional sources to be added to ``sources.list.d``.
              type: boolean
            primary:
              $ref: '#/components/schemas/CloudInit26_2.apt_configure.mirror'
              description: |-
                The primary and security archive mirrors can be specified using the **primary** and **security** keys, respectively. Both the **primary** and **security** keys take a list of configs, allowing mirrors to be specified on a per-architecture basis. Each config is a dictionary which must have an entry for **arches**, specifying which architectures that config entry is for. The keyword ``default`` applies to any architecture not explicitly listed. The mirror url can be specified with the **uri** key, or a list of mirrors to check can be provided in order, with the first mirror that can be resolved being selected. This allows the same configuration to be used in different environment, with different hosts used for a local APT mirror. If no mirror is provided by **uri** or **search**, **search_dns** may be used to search for dns names in the format ``<distro>-mirror`` in each of the following:
                - fqdn of this host per cloud metadata,
                - localdomain,
                - domains listed in ``/etc/resolv.conf``.

                If there is a dns entry for ``<distro>-mirror``, then it is assumed that there is a distro mirror at ``http://<distro>-mirror.<domain>/<distro>``. If the **primary** key is defined, but not the **security** key, then then configuration for **primary** is also used for **security**. If **search_dns** is used for the **security** key, the search pattern will be ``<distro>-security-mirror``.

                Each mirror may also specify a key to import via any of the following optional keys:
                - **keyid**: a key to import via shortid or fingerprint.
                - **key**: a raw PGP key.
                - **keyserver**: alternate keyserver to pull **keyid** key from.

                If no mirrors are specified, or all lookups fail, then default mirrors defined in the datasource are used. If none are present in the datasource either the following defaults are used:
                - **primary** => ``http://archive.ubuntu.com/ubuntu``.
                - **security** => ``http://security.ubuntu.com/ubuntu``.
            proxy:
              description: Alias for defining a http APT proxy.
              type: string
            security:
              $ref: '#/components/schemas/CloudInit26_2.apt_configure.mirror'
              description: Please refer to the primary config documentation.
            sources:
              additionalProperties: false
              description: |-
                Source list entries can be specified as a dictionary under the **sources** config key, with each key in the dict representing a different source file. The key of each source entry will be used as an id that can be referenced in other config entries, as well as the filename for the source's configuration under ``/etc/apt/sources.list.d``. If the name does not end with ``.list``, it will be appended. If there is no configuration for a key in **sources**, no file will be written, but the key may still be referred to as an id in other **sources** entries.

                Each entry under **sources** is a dictionary which may contain any of the following optional keys:
                - **source**: a sources.list entry (some variable replacements apply).
                - **keyid**: a key to import via shortid or fingerprint.
                - **key**: a raw PGP key.
                - **keyserver**: alternate keyserver to pull **keyid** key from.
                - **filename**: specify the name of the list file.
                - **append**: If ``true``, append to sources file, otherwise overwrite it. Default: ``true``.

                The **source** key supports variable replacements for the following strings:
                - ``$MIRROR``
                - ``$PRIMARY``
                - ``$SECURITY``
                - ``$RELEASE``
                - ``$KEY_FILE``
              patternProperties:
                ^.+$:
                  additionalProperties: false
                  minProperties: 1
                  properties:
                    append:
                      default: true
                      type: boolean
                    filename:
                      type: string
                    key:
                      type: string
                    keyid:
                      type: string
                    keyserver:
                      type: string
                    source:
                      type: string
                  type: object
              type: object
            sources_list:
              description: |-
                Specifies a custom template for rendering ``sources.list`` . If no **sources_list** template is given, cloud-init will use sane default. Within this template, the following strings will be replaced with the appropriate values:
                - ``$MIRROR``
                - ``$RELEASE``
                - ``$PRIMARY``
                - ``$SECURITY``
                - ``$KEY_FILE``
              type: string
          type: object
    CloudInit26_2.cc_apt_pipelining:
      properties:
        apt_pipelining:
          oneOf:
          - type: integer
          - type: boolean
          - oneOf:
            - enum:
