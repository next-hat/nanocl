          description: List of mounts used by the container.
        Config:
          oneOf:
          - $ref: '#/components/schemas/ContainerConfig'
          - type: 'null'
        NetworkSettings:
          oneOf:
          - $ref: '#/components/schemas/NetworkSettings'
          - type: 'null'
    ContainerMemoryStats:
      type: object
      description: Aggregates all memory stats since container inception on Linux. Windows returns stats for commit and private working set only.
      properties:
        usage:
          type:
          - integer
          - 'null'
          format: int64
          description: Current `res_counter` usage for memory.  This field is Linux-specific and omitted for Windows containers.
          minimum: 0
        max_usage:
          type:
          - integer
          - 'null'
          format: int64
          description: Maximum usage ever recorded.  This field is Linux-specific and only supported on cgroups v1. It is omitted when using cgroups v2 and for Windows containers.
          minimum: 0
        stats:
          type:
          - object
          - 'null'
          description: All the stats exported via memory.stat.  The fields in this object differ between cgroups v1 and v2. On cgroups v1, fields such as `cache`, `rss`, `mapped_file` are available. On cgroups v2, fields such as `file`, `anon`, `inactive_file` are available.  This field is Linux-specific and omitted for Windows containers.
          additionalProperties:
            type: integer
            format: int64
            minimum: 0
          propertyNames:
            type: string
        failcnt:
          type:
          - integer
          - 'null'
          format: int64
          description: Number of times memory usage hits limits.  This field is Linux-specific and only supported on cgroups v1. It is omitted when using cgroups v2 and for Windows containers.
          minimum: 0
        limit:
          type:
          - integer
          - 'null'
          format: int64
          description: This field is Linux-specific and omitted for Windows containers.
          minimum: 0
        commitbytes:
          type:
          - integer
          - 'null'
          format: int64
          description: Committed bytes.  This field is Windows-specific and omitted for Linux containers.
          minimum: 0
        commitpeakbytes:
          type:
          - integer
          - 'null'
          format: int64
          description: Peak committed bytes.  This field is Windows-specific and omitted for Linux containers.
          minimum: 0
        privateworkingset:
          type:
          - integer
          - 'null'
          format: int64
          description: Private working set.  This field is Windows-specific and omitted for Linux containers.
          minimum: 0
    ContainerNetworkStats:
      type: object
      description: Aggregates the network stats of one container
      properties:
        rx_bytes:
          type:
          - integer
          - 'null'
          format: int64
          description: Bytes received. Windows and Linux.
          minimum: 0
        rx_packets:
          type:
          - integer
          - 'null'
          format: int64
          description: Packets received. Windows and Linux.
          minimum: 0
        rx_errors:
          type:
          - integer
          - 'null'
          format: int64
          description: Received errors. Not used on Windows.  This field is Linux-specific and always zero for Windows containers.
          minimum: 0
        rx_dropped:
          type:
          - integer
          - 'null'
          format: int64
          description: Incoming packets dropped. Windows and Linux.
          minimum: 0
        tx_bytes:
          type:
          - integer
          - 'null'
          format: int64
          description: Bytes sent. Windows and Linux.
          minimum: 0
        tx_packets:
          type:
          - integer
          - 'null'
          format: int64
          description: Packets sent. Windows and Linux.
          minimum: 0
        tx_errors:
          type:
          - integer
          - 'null'
          format: int64
          description: Sent errors. Not used on Windows.  This field is Linux-specific and always zero for Windows containers.
          minimum: 0
        tx_dropped:
          type:
          - integer
          - 'null'
          format: int64
          description: Outgoing packets dropped. Windows and Linux.
          minimum: 0
        endpoint_id:
          type:
          - string
          - 'null'
          description: Endpoint ID. Not used on Linux.  This field is Windows-specific and omitted for Linux containers.
        instance_id:
          type:
          - string
          - 'null'
          description: Instance ID. Not used on Linux.  This field is Windows-specific and omitted for Linux containers.
    ContainerPidsStats:
      type: object
      description: PidsStats contains Linux-specific stats of a container's process-IDs (PIDs).  This type is Linux-specific and omitted for Windows containers.
      properties:
        current:
          type:
          - integer
          - 'null'
          format: int64
          description: Current is the number of PIDs in the cgroup.
          minimum: 0
        limit:
          type:
          - integer
          - 'null'
          format: int64
          description: Limit is the hard limit on the number of pids in the cgroup. A \"Limit\" of 0 means that there is no limit.
          minimum: 0
    ContainerSpec:
      type: object
      description: Declaration of one named container in a multi-container Cargo.
      required:
      - Name
      properties:
        Hostname:
          type:
          - string
          - 'null'
          description: The hostname to use for the container, as a valid RFC 1123 hostname.
        Domainname:
          type:
          - string
          - 'null'
          description: The domain name to use for the container.
        User:
          type:
          - string
          - 'null'
          description: Commands run as this user inside the container. If omitted, commands run as the user specified in the image the container was started from.  Can be either user-name or UID, and optional group-name or GID, separated by a colon (`<user-name|UID>[<:group-name|GID>]`).
        AttachStdin:
          type:
          - boolean
          - 'null'
          description: Whether to attach to `stdin`.
        AttachStdout:
          type:
          - boolean
          - 'null'
          description: Whether to attach to `stdout`.
        AttachStderr:
          type:
          - boolean
          - 'null'
          description: Whether to attach to `stderr`.
        ExposedPorts:
          type:
          - object
          - 'null'
          description: 'An object mapping ports to an empty object in the form:  `{\"<port>/<tcp|udp|sctp>\": {}}`'
          additionalProperties:
            type: object
            additionalProperties:
              default: null
            propertyNames:
              default: null
          propertyNames:
            type: string
        Tty:
          type:
          - boolean
          - 'null'
          description: Attach standard streams to a TTY, including `stdin` if it is not closed.
        OpenStdin:
          type:
          - boolean
          - 'null'
          description: Open `stdin`
        StdinOnce:
          type:
          - boolean
          - 'null'
          description: Close `stdin` after one attached client disconnects
        Env:
          type:
          - array
          - 'null'
          items:
            type: string
          description: A list of environment variables to set inside the container in the form `[\"VAR=value\", ...]`. A variable without `=` is removed from the environment, rather than to have an empty value.
        Cmd:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Command to run specified as a string or an array of strings.
        Healthcheck:
          oneOf:
          - $ref: '#/components/schemas/ContainerSpecHealthConfig'
          - type: 'null'
        ArgsEscaped:
          type:
          - boolean
          - 'null'
          description: Command is already escaped (Windows only)
        Image:
          type:
          - string
          - 'null'
          description: The name (or reference) of the image to use when creating the container, or which was used when the container was created.
        Volumes:
          type:
          - object
          - 'null'
          description: An object mapping mount point paths inside the container to empty objects.
          additionalProperties:
            type: object
            additionalProperties:
              default: null
            propertyNames:
              default: null
          propertyNames:
            type: string
        WorkingDir:
          type:
          - string
          - 'null'
          description: The working directory for commands to run in.
        Entrypoint:
          type:
          - array
          - 'null'
          items:
            type: string
          description: The entry point for the container as a string or an array of strings.  If the array consists of exactly one empty string (`[\"\"]`) then the entry point is reset to system default (i.e., the entry point used by docker when there is no `ENTRYPOINT` instruction in the `Dockerfile`).
        NetworkDisabled:
          type:
          - boolean
          - 'null'
          description: Disable networking for the container.
        OnBuild:
          type:
          - array
          - 'null'
          items:
            type: string
          description: '`ONBUILD` metadata that were defined in the image''s `Dockerfile`.'
        Labels:
          type:
          - object
          - 'null'
          description: User-defined key/value metadata.
          additionalProperties:
            type: string
          propertyNames:
            type: string
        StopSignal:
          type:
          - string
          - 'null'
          description: Signal to stop a container as a string or unsigned integer.
        StopTimeout:
          type:
          - integer
          - 'null'
          format: int64
          description: Timeout to stop a container in seconds.
        Shell:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Shell for when `RUN`, `CMD`, and `ENTRYPOINT` uses a shell.
        HostConfig:
          oneOf:
          - $ref: '#/components/schemas/ContainerSpecHostConfig'
          - type: 'null'
        NetworkingConfig:
          oneOf:
          - $ref: '#/components/schemas/ContainerSpecNetworkingConfig'
          - type: 'null'
        Name:
          type: string
          description: Name unique within the Cargo declaration.
        Essential:
          type: boolean
          description: Whether failure of this container makes the Cargo replica unhealthy.
          default: true
        Secrets:
          type: array
          items:
            type: string
          description: Secrets injected into only this container.
          default: []
        ImagePullSecret:
          oneOf:
          - type: 'null'
          - type: string
          description: Secret used to pull this container's image.
        ImagePullPolicy:
          type: string
          description: Policy used to pull this container's image.
          default: IfNotPresent
          enum:
          - Never
          - Always
          - IfNotPresent
      additionalProperties: false
    ContainerSpecDeviceMapping:
      type: object
      description: A device mapping between the host and container
      properties:
        PathOnHost:
          type:
          - string
          - 'null'
        PathInContainer:
          type:
          - string
          - 'null'
        CgroupPermissions:
          type:
          - string
          - 'null'
      additionalProperties: false
    ContainerSpecDeviceRequest:
      type: object
      description: A request for devices to be sent to device drivers
      properties:
        Driver:
          type:
          - string
          - 'null'
          description: The name of the device driver to use for this request.  Note that if this is specified the capabilities are ignored when selecting a device driver.
        Count:
          type:
          - integer
          - 'null'
          format: int64
        DeviceIDs:
          type:
          - array
          - 'null'
          items:
            type: string
        Capabilities:
          type:
          - array
          - 'null'
          items:
            type: array
            items:
              type: string
          description: A list of capabilities; an OR list of AND lists of capabilities.  Note that if a driver is specified the capabilities have no effect on selecting a driver as the driver name is used directly.  Note that if no driver is specified the capabilities are used to select a driver with the required capabilities.
        Options:
          type:
          - object
          - 'null'
          description: Driver-specific options, specified as a key/value pairs. These options are passed directly to the driver.
          additionalProperties:
            type: string
          propertyNames:
            type: string
      additionalProperties: false
    ContainerSpecEndpointIpamConfig:
      type: object
      description: EndpointIPAMConfig represents an endpoint's IPAM configuration.
      properties:
        IPv4Address:
          type:
          - string
          - 'null'
        IPv6Address:
          type:
          - string
          - 'null'
        LinkLocalIPs:
          type:
          - array
          - 'null'
          items:
            type: string
      additionalProperties: false
    ContainerSpecEndpointSettings:
      type: object
      description: Configuration for a network endpoint.
      properties:
        IPAMConfig:
          oneOf:
          - $ref: '#/components/schemas/ContainerSpecEndpointIpamConfig'
          - type: 'null'
        Links:
          type:
          - array
          - 'null'
          items:
            type: string
        MacAddress:
          type:
          - string
          - 'null'
          description: MAC address for the endpoint on this network. The network driver might ignore this parameter.
        Aliases:
          type:
          - array
          - 'null'
          items:
            type: string
        DriverOpts:
          type:
          - object
          - 'null'
          description: DriverOpts is a mapping of driver options and values. These options are passed directly to the driver and are driver specific.
          additionalProperties:
            type: string
          propertyNames:
            type: string
        GwPriority:
          type:
          - integer
          - 'null'
          format: int64
          description: This property determines which endpoint will provide the default gateway for a container. The endpoint with the highest priority will be used. If multiple endpoints have the same priority, endpoints are lexicographically sorted based on their network name, and the one that sorts first is picked.
        NetworkID:
          type:
          - string
          - 'null'
          description: Unique ID of the network.
        EndpointID:
          type:
          - string
          - 'null'
          description: Unique ID for the service endpoint in a Sandbox.
        Gateway:
          type:
          - string
          - 'null'
          description: Gateway address for this network.
        IPAddress:
          type:
          - string
          - 'null'
          description: IPv4 address.
        IPPrefixLen:
          type:
          - integer
          - 'null'
          format: int64
          description: Mask length of the IPv4 address.
        IPv6Gateway:
          type:
          - string
          - 'null'
          description: IPv6 gateway address.
        GlobalIPv6Address:
          type:
          - string
          - 'null'
          description: Global IPv6 address.
        GlobalIPv6PrefixLen:
          type:
          - integer
          - 'null'
          format: int64
          description: Mask length of the global IPv6 address.
        DNSNames:
          type:
          - array
          - 'null'
          items:
            type: string
          description: List of all DNS names an endpoint has on a specific network. This list is based on the container name, network aliases, container short ID, and hostname.  These DNS names are non-fully qualified but can contain several dots. You can get fully qualified DNS names by appending `.<network-name>`. For instance, if container name is `my.ctr` and the network is named `testnet`, `DNSNames` will contain `my.ctr` and the FQDN will be `my.ctr.testnet`.
      additionalProperties: false
    ContainerSpecHealthConfig:
      type: object
      description: A test to perform to check that the container is healthy. Healthcheck commands should be side-effect free.
      properties:
        Test:
          type:
          - array
          - 'null'
          items:
            type: string
          description: 'The test to perform. Possible values are:  - `[]` inherit healthcheck from image or parent image - `[\"NONE\"]` disable healthcheck - `[\"CMD\", args...]` exec arguments directly - `[\"CMD-SHELL\", command]` run command with system''s default shell  A non-zero exit code indicates a failed healthcheck: - `0` healthy - `1` unhealthy - `2` reserved (treated as unhealthy) - other values: error running probe'
        Interval:
          type:
          - integer
          - 'null'
          format: int64
          description: The time to wait between checks in nanoseconds. It should be 0 or at least 1000000 (1 ms). 0 means inherit.
        Timeout:
          type:
          - integer
          - 'null'
          format: int64
          description: The time to wait before considering the check to have hung. It should be 0 or at least 1000000 (1 ms). 0 means inherit.  If the health check command does not complete within this timeout, the check is considered failed and the health check process is forcibly terminated without a graceful shutdown.
        Retries:
          type:
          - integer
          - 'null'
          format: int64
          description: The number of consecutive failures needed to consider a container as unhealthy. 0 means inherit.
        StartPeriod:
          type:
          - integer
          - 'null'
          format: int64
          description: Start period for the container to initialize before starting health-retries countdown in nanoseconds. It should be 0 or at least 1000000 (1 ms). 0 means inherit.
        StartInterval:
          type:
          - integer
          - 'null'
          format: int64
          description: The time to wait between checks in nanoseconds during the start period. It should be 0 or at least 1000000 (1 ms). 0 means inherit.
      additionalProperties: false
    ContainerSpecHostConfig:
      type: object
      description: Container configuration that depends on the host we are running on
      properties:
        CpuShares:
          type:
          - integer
          - 'null'
          format: int64
          description: An integer value representing this container's relative CPU weight versus other containers.
        Memory:
          type:
          - integer
          - 'null'
          format: int64
          description: Memory limit in bytes.
        CgroupParent:
          type:
          - string
          - 'null'
          description: Path to `cgroups` under which the container's `cgroup` is created. If the path is not absolute, the path is considered to be relative to the `cgroups` path of the init process. Cgroups are created if they do not already exist.
        BlkioWeight:
          type:
          - integer
          - 'null'
          format: int32
          description: Block IO weight (relative weight).
          minimum: 0
        BlkioWeightDevice:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ContainerSpecResourcesBlkioWeightDevice'
          description: 'Block IO weight (relative device weight) in the form:  ``` [{\"Path\": \"device_path\", \"Weight\": weight}] ```'
        BlkioDeviceReadBps:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ContainerSpecThrottleDevice'
          description: 'Limit read rate (bytes per second) from a device, in the form:  ``` [{\"Path\": \"device_path\", \"Rate\": rate}] ```'
        BlkioDeviceWriteBps:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ContainerSpecThrottleDevice'
          description: 'Limit write rate (bytes per second) to a device, in the form:  ``` [{\"Path\": \"device_path\", \"Rate\": rate}] ```'
        BlkioDeviceReadIOps:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ContainerSpecThrottleDevice'
          description: 'Limit read rate (IO per second) from a device, in the form:  ``` [{\"Path\": \"device_path\", \"Rate\": rate}] ```'
        BlkioDeviceWriteIOps:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ContainerSpecThrottleDevice'
          description: 'Limit write rate (IO per second) to a device, in the form:  ``` [{\"Path\": \"device_path\", \"Rate\": rate}] ```'
        CpuPeriod:
          type:
          - integer
          - 'null'
          format: int64
          description: The length of a CPU period in microseconds.
        CpuQuota:
          type:
          - integer
          - 'null'
          format: int64
          description: Microseconds of CPU time that the container can get in a CPU period.
        CpuRealtimePeriod:
          type:
          - integer
          - 'null'
          format: int64
          description: The length of a CPU real-time period in microseconds. Set to 0 to allocate no time allocated to real-time tasks.
        CpuRealtimeRuntime:
          type:
          - integer
          - 'null'
          format: int64
          description: The length of a CPU real-time runtime in microseconds. Set to 0 to allocate no time allocated to real-time tasks.
        CpusetCpus:
          type:
          - string
          - 'null'
          description: CPUs in which to allow execution (e.g., `0-3`, `0,1`).
        CpusetMems:
          type:
          - string
          - 'null'
          description: Memory nodes (MEMs) in which to allow execution (0-3, 0,1). Only effective on NUMA systems.
        Devices:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ContainerSpecDeviceMapping'
          description: A list of devices to add to the container.
        DeviceCgroupRules:
          type:
          - array
          - 'null'
          items:
            type: string
          description: a list of cgroup rules to apply to the container
        DeviceRequests:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ContainerSpecDeviceRequest'
          description: A list of requests for devices to be sent to device drivers.
        MemoryReservation:
          type:
          - integer
          - 'null'
          format: int64
          description: Memory soft limit in bytes.
        MemorySwap:
          type:
          - integer
          - 'null'
          format: int64
          description: Total memory limit (memory + swap). Set as `-1` to enable unlimited swap.
        MemorySwappiness:
          type:
          - integer
          - 'null'
          format: int64
          description: Tune a container's memory swappiness behavior. Accepts an integer between 0 and 100.
        NanoCpus:
          type:
          - integer
          - 'null'
          format: int64
          description: CPU quota in units of 10<sup>-9</sup> CPUs.
        OomKillDisable:
          type:
          - boolean
          - 'null'
          description: Disable OOM Killer for the container.
        Init:
          type:
          - boolean
          - 'null'
          description: Run an init inside the container that forwards signals and reaps processes. This field is omitted if empty, and the default (as configured on the daemon) is used.
        PidsLimit:
          type:
          - integer
          - 'null'
          format: int64
          description: Tune a container's PIDs limit. Set `0` or `-1` for unlimited, or `null` to not change.
        Ulimits:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ContainerSpecResourcesUlimits'
          description: 'A list of resource limits to set in the container. For example:  ``` {\"Name\": \"nofile\", \"Soft\": 1024, \"Hard\": 2048} ```'
        CpuCount:
          type:
          - integer
          - 'null'
          format: int64
          description: The number of usable CPUs (Windows only).  On Windows Server containers, the processor resource controls are mutually exclusive. The order of precedence is `CPUCount` first, then `CPUShares`, and `CPUPercent` last.
        CpuPercent:
          type:
          - integer
          - 'null'
          format: int64
          description: The usable percentage of the available CPUs (Windows only).  On Windows Server containers, the processor resource controls are mutually exclusive. The order of precedence is `CPUCount` first, then `CPUShares`, and `CPUPercent` last.
        IOMaximumIOps:
          type:
          - integer
          - 'null'
          format: int64
          description: Maximum IOps for the container system drive (Windows only)
        IOMaximumBandwidth:
          type:
          - integer
          - 'null'
          format: int64
          description: Maximum IO in bytes per second for the container system drive (Windows only).
        Binds:
          type:
          - array
          - 'null'
          items:
            type: string
          description: 'A list of volume bindings for this container. Each volume binding is a string in one of these forms:  - `host-src:container-dest[:options]` to bind-mount a host path   into the container. Both `host-src`, and `container-dest` must   be an _absolute_ path. - `volume-name:container-dest[:options]` to bind-mount a volume   managed by a volume driver into the container. `container-dest`   must be an _absolute_ path.  `options` is an optional, comma-delimited list of:  - `nocopy` disables automatic copying of data from the container   path to the volume. The `nocopy` flag only applies to named volumes. - `[ro|rw]` mounts a volume read-only or read-write, respectively.   If omitted or set to `rw`, volumes are mounted read-write. - `[z|Z]` applies SELinux labels to allow or deny multiple containers   to read and write to the same volume.     - `z`: a _shared_ content label is applied to the content. This       label indicates that multiple containers can share the volume       content, for both reading and writing.     - `Z`: a _private unshared_ label is applied to the content.       This label indicates that only the current container can use       a private volume. Labeling systems such as SELinux require       proper labels to be placed on volume content that is mounted       into a container. Without a label, the security system can       prevent a container''s processes from using the content. By       default, the labels set by the host operating system are not       modified. - `[[r]shared|[r]slave|[r]private]` specifies mount   [propagation behavior](https://www.kernel.org/doc/Documentation/filesystems/sharedsubtree.txt).   This only applies to bind-mounted volumes, not internal volumes   or named volumes. Mount propagation requires the source mount   point (the location where the source directory is mounted in the   host operating system) to have the correct propagation properties.   For shared volumes, the source mount point must be set to `shared`.   For slave volumes, the mount must be set to either `shared` or   `slave`.'
        ContainerIDFile:
          type:
          - string
          - 'null'
          description: Path to a file where the container ID is written
        LogConfig:
          oneOf:
          - $ref: '#/components/schemas/ContainerSpecHostConfigLogConfig'
          - type: 'null'
        NetworkMode:
          type:
          - string
          - 'null'
          description: 'Network mode to use for this container. Supported standard values are: `bridge`, `host`, `none`, and `container:<name|id>`. Any other value is taken as a custom network''s name to which this container should connect to.'
        PortBindings:
          type:
          - object
          - 'null'
          additionalProperties:
            type:
            - array
            - 'null'
            items:
              $ref: '#/components/schemas/ContainerSpecPortBinding'
          propertyNames:
            type: string
        RestartPolicy:
          oneOf:
          - $ref: '#/components/schemas/ContainerSpecRestartPolicy'
          - type: 'null'
        AutoRemove:
          type:
          - boolean
          - 'null'
          description: Automatically remove the container when the container's process exits. This has no effect if `RestartPolicy` is set.
        VolumeDriver:
          type:
          - string
          - 'null'
          description: Driver that this container uses to mount volumes.
        VolumesFrom:
          type:
          - array
          - 'null'
          items:
            type: string
          description: A list of volumes to inherit from another container, specified in the form `<container name>[:<ro|rw>]`.
        Mounts:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ContainerSpecMount'
          description: Specification for mounts to be added to the container.
        ConsoleSize:
          type:
          - array
          - 'null'
          items:
            type: integer
            minimum: 0
          description: Initial console size, as an `[height, width]` array.
        Annotations:
          type:
          - object
          - 'null'
          description: Arbitrary non-identifying metadata attached to container and provided to the runtime when the container is started.
          additionalProperties:
            type: string
          propertyNames:
            type: string
        CapAdd:
          type:
          - array
          - 'null'
          items:
            type: string
          description: A list of kernel capabilities to add to the container. Conflicts with option 'Capabilities'.
        CapDrop:
          type:
          - array
          - 'null'
          items:
            type: string
          description: A list of kernel capabilities to drop from the container. Conflicts with option 'Capabilities'.
        CgroupnsMode:
          oneOf:
          - $ref: '#/components/schemas/ContainerSpecHostConfigCgroupnsModeEnum'
            description: 'cgroup namespace mode for the container. Possible values are:  - `\"private\"`: the container runs in its own private cgroup namespace - `\"host\"`: use the host system''s cgroup namespace  If not specified, the daemon default is used, which can either be `\"private\"` or `\"host\"`, depending on daemon version, kernel support and configuration.'
          - type: 'null'
        Dns:
          type:
          - array
          - 'null'
          items:
            type: string
          description: A list of DNS servers for the container to use.
        DnsOptions:
          type:
          - array
          - 'null'
          items:
            type: string
          description: A list of DNS options.
        DnsSearch:
          type:
          - array
          - 'null'
          items:
            type: string
          description: A list of DNS search domains.
        ExtraHosts:
          type:
          - array
          - 'null'
          items:
            type: string
          description: A list of hostnames/IP mappings to add to the container's `/etc/hosts` file. Specified in the form `[\"hostname:IP\"]`.
        GroupAdd:
          type:
          - array
          - 'null'
          items:
            type: string
          description: A list of additional groups that the container process will run as.
        IpcMode:
          type:
          - string
          - 'null'
          description: 'IPC sharing mode for the container. Possible values are:  - `\"none\"`: own private IPC namespace, with /dev/shm not mounted - `\"private\"`: own private IPC namespace - `\"shareable\"`: own private IPC namespace, with a possibility to share it with other containers - `\"container:<name|id>\"`: join another (shareable) container''s IPC namespace - `\"host\"`: use the host system''s IPC namespace  If not specified, daemon default is used, which can either be `\"private\"` or `\"shareable\"`, depending on daemon version and configuration.'
        Cgroup:
          type:
          - string
          - 'null'
          description: Cgroup to use for the container.
        Links:
          type:
          - array
          - 'null'
          items:
            type: string
          description: A list of links for the container in the form `container_name:alias`.
        OomScoreAdj:
          type:
          - integer
          - 'null'
          format: int64
          description: An integer value containing the score given to the container in order to tune OOM killer preferences.
        PidMode:
          type:
          - string
          - 'null'
          description: 'Set the PID (Process) Namespace mode for the container. It can be either:  - `\"container:<name|id>\"`: joins another container''s PID namespace - `\"host\"`: use the host''s PID namespace inside the container'
        Privileged:
          type:
          - boolean
          - 'null'
          description: Gives the container full access to the host.
        PublishAllPorts:
          type:
          - boolean
          - 'null'
          description: Allocates an ephemeral host port for all of a container's exposed ports.  Ports are de-allocated when the container stops and allocated when the container starts. The allocated port might be changed when restarting the container.  The port is selected from the ephemeral port range that depends on the kernel. For example, on Linux the range is defined by `/proc/sys/net/ipv4/ip_local_port_range`.
        ReadonlyRootfs:
          type:
          - boolean
          - 'null'
          description: Mount the container's root filesystem as read only.
        SecurityOpt:
          type:
          - array
          - 'null'
          items:
            type: string
          description: A list of string values to customize labels for MLS systems, such as SELinux.
        StorageOpt:
          type:
          - object
          - 'null'
          description: 'Storage driver options for this container, in the form `{\"size\": \"120G\"}`.'
          additionalProperties:
            type: string
          propertyNames:
            type: string
        Tmpfs:
          type:
          - object
          - 'null'
          description: 'A map of container directories which should be replaced by tmpfs mounts, and their corresponding mount options. For example:  ``` { \"/run\": \"rw,noexec,nosuid,size=65536k\" } ```'
          additionalProperties:
            type: string
          propertyNames:
            type: string
        UTSMode:
          type:
          - string
          - 'null'
          description: UTS namespace to use for the container.
        UsernsMode:
          type:
          - string
          - 'null'
          description: Sets the usernamespace mode for the container when usernamespace remapping option is enabled.
        ShmSize:
          type:
          - integer
          - 'null'
          format: int64
          description: Size of `/dev/shm` in bytes. If omitted, the system uses 64MB.
        Sysctls:
          type:
          - object
          - 'null'
          description: A list of kernel parameters (sysctls) to set in the container.  This field is omitted if not set.
          additionalProperties:
            type: string
          propertyNames:
            type: string
        Runtime:
          type:
          - string
          - 'null'
          description: Runtime to use with this container.
        Isolation:
          oneOf:
          - $ref: '#/components/schemas/ContainerSpecHostConfigIsolationEnum'
            description: Isolation technology of the container. (Windows only)
          - type: 'null'
        MaskedPaths:
          type:
          - array
          - 'null'
          items:
            type: string
          description: The list of paths to be masked inside the container (this overrides the default set of paths).
        ReadonlyPaths:
          type:
          - array
          - 'null'
          items:
            type: string
          description: The list of paths to be set as read-only inside the container (this overrides the default set of paths).
      additionalProperties: false
    ContainerSpecHostConfigCgroupnsModeEnum:
      type: string
      enum:
      - EMPTY
      - private
      - host
    ContainerSpecHostConfigIsolationEnum:
      type: string
      enum:
      - default
      - process
      - hyperv
      - EMPTY
    ContainerSpecHostConfigLogConfig:
      type: object
      description: The logging configuration for this container
      properties:
        Type:
          type:
          - string
          - 'null'
          description: Name of the logging driver used for the container or \"none\" if logging is disabled.
        Config:
          type:
          - object
          - 'null'
          description: Driver-specific configuration options for the logging driver.
          additionalProperties:
            type: string
          propertyNames:
            type: string
      additionalProperties: false
    ContainerSpecMount:
      type: object
      properties:
        Target:
          type:
          - string
          - 'null'
          description: Container path.
        Source:
          type:
          - string
          - 'null'
          description: Mount source (e.g. a volume name, a host path). The source cannot be specified when using `Type=tmpfs`. For `Type=bind`, the source path must either exist, or the `CreateMountpoint` must be set to `true` to create the source path on the host if missing.  For `Type=npipe`, the pipe must exist prior to creating the container.
        Type:
          oneOf:
          - $ref: '#/components/schemas/ContainerSpecMountType'
          - type: 'null'
        ReadOnly:
          type:
          - boolean
          - 'null'
          description: Whether the mount should be read-only.
        Consistency:
          type:
          - string
          - 'null'
          description: 'The consistency requirement for the mount: `default`, `consistent`, `cached`, or `delegated`.'
        BindOptions:
          oneOf:
          - $ref: '#/components/schemas/ContainerSpecMountBindOptions'
          - type: 'null'
        VolumeOptions:
          oneOf:
          - $ref: '#/components/schemas/ContainerSpecMountVolumeOptions'
          - type: 'null'
        ImageOptions:
          oneOf:
          - $ref: '#/components/schemas/ContainerSpecMountImageOptions'
          - type: 'null'
        TmpfsOptions:
          oneOf:
          - $ref: '#/components/schemas/ContainerSpecMountTmpfsOptions'
          - type: 'null'
      additionalProperties: false
    ContainerSpecMountBindOptions:
      type: object
      description: Optional configuration for the `bind` type.
      properties:
        Propagation:
          oneOf:
          - $ref: '#/components/schemas/ContainerSpecMountBindOptionsPropagationEnum'
            description: A propagation mode with the value `[r]private`, `[r]shared`, or `[r]slave`.
          - type: 'null'
        NonRecursive:
          type:
          - boolean
          - 'null'
          description: Disable recursive bind mount.
        CreateMountpoint:
          type:
          - boolean
          - 'null'
          description: Create mount point on host if missing
        ReadOnlyNonRecursive:
          type:
          - boolean
          - 'null'
          description: Make the mount non-recursively read-only, but still leave the mount recursive (unless NonRecursive is set to `true` in conjunction).  Added in v1.44, before that version all read-only mounts were non-recursive by default. To match the previous behaviour this will default to `true` for clients on versions prior to v1.44.
        ReadOnlyForceRecursive:
          type:
          - boolean
          - 'null'
          description: Raise an error if the mount cannot be made recursively read-only.
      additionalProperties: false
    ContainerSpecMountBindOptionsPropagationEnum:
      type: string
      enum:
      - EMPTY
      - private
      - rprivate
      - shared
      - rshared
      - slave
      - rslave
    ContainerSpecMountImageOptions:
      type: object
      description: Optional configuration for the `image` type.
      properties:
        Subpath:
          type:
          - string
          - 'null'
          description: Source path inside the image. Must be relative without any back traversals.
      additionalProperties: false
    ContainerSpecMountTmpfsOptions:
      type: object
      description: Optional configuration for the `tmpfs` type.
      properties:
        SizeBytes:
          type:
          - integer
          - 'null'
          format: int64
          description: The size for the tmpfs mount in bytes.
        Mode:
          type:
          - integer
          - 'null'
          format: int64
          description: The permission mode for the tmpfs mount in an integer. The value must not be in octal format (e.g. 755) but rather the decimal representation of the octal value (e.g. 493).
        Options:
          type:
          - array
          - 'null'
          items:
            type: array
            items:
              type: string
          description: The options to be passed to the tmpfs mount. An array of arrays. Flag options should be provided as 1-length arrays. Other types should be provided as as 2-length arrays, where the first item is the key and the second the value.
      additionalProperties: false
    ContainerSpecMountType:
      type: string
      description: |-
        The mount type. Available types:  - `bind` Mounts a file or directory from the host into the container. The `Source` must exist prior to creating the container. - `cluster` a Swarm cluster volume - `image` Mounts an image. - `npipe` Mounts a named pipe from the host into the container. The `Source` must exist prior to creating the container. - `tmpfs` Create a tmpfs with the given options. The mount `Source` cannot be specified for tmpfs. - `volume` Creates a volume with the given name and options (or uses a pre-existing volume with the same name and options). These are **not** removed when the container is removed.
        Enumeration of values.
        Since this enum's variants do not hold data, we can easily define them them as `#[repr(C)]`
        which helps with FFI.
      enum:
      - bind
      - cluster
      - image
      - npipe
      - tmpfs
      - volume
    ContainerSpecMountVolumeOptions:
      type: object
      description: Optional configuration for the `volume` type.
      properties:
        NoCopy:
          type:
          - boolean
          - 'null'
          description: Populate volume with data from the target.
        Labels:
          type:
          - object
          - 'null'
          description: User-defined key/value metadata.
          additionalProperties:
            type: string
          propertyNames:
            type: string
        DriverConfig:
          oneOf:
          - $ref: '#/components/schemas/ContainerSpecMountVolumeOptionsDriverConfig'
          - type: 'null'
        Subpath:
          type:
          - string
          - 'null'
          description: Source path inside the volume. Must be relative without any back traversals.
      additionalProperties: false
    ContainerSpecMountVolumeOptionsDriverConfig:
      type: object
      description: Map of driver specific options
      properties:
        Name:
          type:
          - string
          - 'null'
          description: Name of the driver to use to create the volume.
        Options:
          type:
          - object
          - 'null'
          description: key/value map of driver specific options.
          additionalProperties:
            type: string
          propertyNames:
            type: string
      additionalProperties: false
    ContainerSpecNetworkingConfig:
      type: object
      description: NetworkingConfig represents the container's networking configuration for each of its interfaces. It is used for the networking configs specified in the `docker create` and `docker network connect` commands.
      properties:
        EndpointsConfig:
          type:
          - object
          - 'null'
          description: A mapping of network name to endpoint configuration for that network. The endpoint configuration can be left empty to connect to that network with no particular endpoint configuration.
          additionalProperties:
            $ref: '#/components/schemas/ContainerSpecEndpointSettings'
          propertyNames:
            type: string
      additionalProperties: false
    ContainerSpecPortBinding:
      type: object
      description: PortBinding represents a binding between a host IP address and a host port.
      properties:
        HostIp:
          type:
          - string
          - 'null'
          description: Host IP address that the container's port is mapped to.
        HostPort:
          type:
          - string
          - 'null'
          description: Host port number that the container's port is mapped to.
      additionalProperties: false
    ContainerSpecResourcesBlkioWeightDevice:
      type: object
      properties:
        Path:
          type:
          - string
          - 'null'
        Weight:
          type:
          - integer
          - 'null'
          minimum: 0
      additionalProperties: false
    ContainerSpecResourcesUlimits:
      type: object
      properties:
        Name:
          type:
          - string
          - 'null'
          description: Name of ulimit
        Soft:
          type:
          - integer
          - 'null'
          format: int64
          description: Soft limit
        Hard:
          type:
          - integer
          - 'null'
          format: int64
          description: Hard limit
      additionalProperties: false
    ContainerSpecRestartPolicy:
      type: object
      description: The behavior to apply when the container exits. The default is not to restart.  An ever increasing delay (double the previous delay, starting at 100ms) is added before each restart to prevent flooding the server.
      properties:
        Name:
          oneOf:
          - $ref: '#/components/schemas/ContainerSpecRestartPolicyNameEnum'
            description: '- Empty string means not to restart - `no` Do not automatically restart - `always` Always restart - `unless-stopped` Restart always except when the user has manually stopped the container - `on-failure` Restart only when the container exit code is non-zero'
          - type: 'null'
        MaximumRetryCount:
          type:
          - integer
          - 'null'
          format: int64
          description: If `on-failure` is used, the number of times to retry before giving up.
      additionalProperties: false
    ContainerSpecRestartPolicyNameEnum:
      type: string
      enum:
      - EMPTY
      - no
      - always
      - unless-stopped
      - on-failure
    ContainerSpecThrottleDevice:
      type: object
      properties:
        Path:
          type:
          - string
          - 'null'
          description: Device path
        Rate:
          type:
          - integer
          - 'null'
          format: int64
          description: Rate
      additionalProperties: false
    ContainerState:
      type: object
      description: ContainerState stores container's running state. It's part of ContainerJSONBase and will be returned by the \"inspect\" command.
      properties:
        Status:
          oneOf:
          - $ref: '#/components/schemas/ContainerStateStatusEnum'
            description: String representation of the container state. Can be one of \"created\", \"running\", \"paused\", \"restarting\", \"removing\", \"exited\", or \"dead\".
          - type: 'null'
        Running:
          type:
          - boolean
          - 'null'
          description: 'Whether this container is running.  Note that a running container can be _paused_. The `Running` and `Paused` booleans are not mutually exclusive:  When pausing a container (on Linux), the freezer cgroup is used to suspend all processes in the container. Freezing the process requires the process to be running. As a result, paused containers are both `Running` _and_ `Paused`.  Use the `Status` field instead to determine if a container''s state is \"running\".'
        Paused:
          type:
          - boolean
          - 'null'
          description: Whether this container is paused.
        Restarting:
          type:
          - boolean
          - 'null'
          description: Whether this container is restarting.
        OOMKilled:
          type:
          - boolean
          - 'null'
          description: Whether a process within this container has been killed because it ran out of memory since the container was last started.
        Dead:
          type:
          - boolean
          - 'null'
        Pid:
          type:
          - integer
          - 'null'
          format: int64
          description: The process ID of this container
        ExitCode:
          type:
          - integer
          - 'null'
          format: int64
          description: The last exit code of this container
        Error:
          type:
          - string
          - 'null'
        StartedAt:
          type:
          - string
          - 'null'
          description: The time when this container was last started.
        FinishedAt:
          type:
          - string
          - 'null'
          description: The time when this container last exited.
        Health:
          oneOf:
          - $ref: '#/components/schemas/Health'
          - type: 'null'
    ContainerStateStatusEnum:
      type: string
      enum:
      - EMPTY
      - created
      - running
      - paused
      - restarting
      - removing
      - exited
      - dead
      - stopping
    ContainerStatsResponse:
      type: object
      description: Statistics sample for a container.
      properties:
        id:
          type:
          - string
          - 'null'
          description: ID of the container for which the stats were collected.
        name:
          type:
          - string
          - 'null'
          description: Name of the container for which the stats were collected.
        os_type:
          type:
          - string
          - 'null'
          description: OSType is the OS of the container (\"linux\" or \"windows\") to allow platform-specific handling of stats.
        read:
          type:
          - string
          - 'null'
          format: date-time
          description: Date and time at which this sample was collected. The value is formatted as [RFC 3339](https://www.ietf.org/rfc/rfc3339.txt) with nano-seconds.
        cpu_stats:
          oneOf:
          - $ref: '#/components/schemas/ContainerCpuStats'
          - type: 'null'
        memory_stats:
          oneOf:
          - $ref: '#/components/schemas/ContainerMemoryStats'
          - type: 'null'
        networks:
          type:
          - object
          - 'null'
          description: Network statistics for the container per interface.  This field is omitted if the container has no networking enabled.
          additionalProperties:
            $ref: '#/components/schemas/ContainerNetworkStats'
          propertyNames:
            type: string
        pids_stats:
          oneOf:
          - $ref: '#/components/schemas/ContainerPidsStats'
          - type: 'null'
        blkio_stats:
          oneOf:
          - $ref: '#/components/schemas/ContainerBlkioStats'
          - type: 'null'
        num_procs:
          type:
          - integer
          - 'null'
          format: int32
          description: The number of processors on the system.  This field is Windows-specific and always zero for Linux containers.
          minimum: 0
        storage_stats:
          oneOf:
          - $ref: '#/components/schemas/ContainerStorageStats'
          - type: 'null'
        preread:
          type:
          - string
          - 'null'
          format: date-time
          description: Date and time at which this first sample was collected. This field is not propagated if the \"one-shot\" option is set. If the \"one-shot\" option is set, this field may be omitted, empty, or set to a default date (`0001-01-01T00:00:00Z`).  The value is formatted as [RFC 3339](https://www.ietf.org/rfc/rfc3339.txt) with nano-seconds.
        precpu_stats:
          oneOf:
          - $ref: '#/components/schemas/ContainerCpuStats'
          - type: 'null'
    ContainerStorageStats:
      type: object
      description: StorageStats is the disk I/O stats for read/write on Windows.  This type is Windows-specific and omitted for Linux containers.
      properties:
        read_count_normalized:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        read_size_bytes:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        write_count_normalized:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        write_size_bytes:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
    ContainerThrottlingData:
      type: object
      description: CPU throttling stats of the container.  This type is Linux-specific and omitted for Windows containers.
      properties:
        periods:
          type:
          - integer
          - 'null'
          format: int64
          description: Number of periods with throttling active.
          minimum: 0
        throttled_periods:
          type:
          - integer
          - 'null'
          format: int64
          description: Number of periods when the container hit its throttling limit.
          minimum: 0
        throttled_time:
          type:
          - integer
          - 'null'
          format: int64
          description: Aggregated time (in nanoseconds) the container was throttled for.
          minimum: 0
    ContainerdInfo:
      type: object
      description: Information for connecting to the containerd instance that is used by the daemon. This is included for debugging purposes only.
      properties:
        Address:
          type:
          - string
          - 'null'
          description: The address of the containerd socket.
        Namespaces:
          oneOf:
          - $ref: '#/components/schemas/ContainerdInfoNamespaces'
          - type: 'null'
    ContainerdInfoNamespaces:
      type: object
      description: The namespaces that the daemon uses for running containers and plugins in containerd. These namespaces can be configured in the daemon configuration, and are considered to be used exclusively by the daemon, Tampering with the containerd instance may cause unexpected behavior.  As these namespaces are considered to be exclusively accessed by the daemon, it is not recommended to change these values, or to change them to a value that is used by other systems, such as cri-containerd.
      properties:
        Containers:
          type:
          - string
          - 'null'
          description: The default containerd namespace used for containers managed by the daemon.  The default namespace for containers is \"moby\", but will be suffixed with the `<uid>.<gid>` of the remapped `root` if user-namespaces are enabled and the containerd image-store is used.
        Plugins:
          type:
          - string
          - 'null'
          description: The default containerd namespace used for plugins managed by the daemon.  The default namespace for plugins is \"plugins.moby\", but will be suffixed with the `<uid>.<gid>` of the remapped `root` if user-namespaces are enabled and the containerd image-store is used.
    DaemonConfig:
      type: object
      description: |-
        Configuration of the daemon
        It is used to configure the daemon
      required:
      - hosts
      - state_dir
      - gateway
      - hostname
      - nodes
      - advertise_addr
      - conf_dir
      - gid
      properties:
        hosts:
          type: array
          items:
            type: string
          description: List of hosts to listen on
        state_dir:
          type: string
          description: Path to the state directory
        docker_host:
          type: string
          description: Docker host to use
        store_addr:
          type:
          - string
          - 'null'
          description: Store address to connect to
        gateway:
          type: string
          description: Host gateway automatically detected to host default gateway if not set
        hostname:
          type: string
          description: Hostname to use for the node automatically detected if not set
        nodes:
          type: array
          items:
            type: string
          description: List of nodes to join
        advertise_addr:
          type: string
          description: Address to advertise to other nodes
        conf_dir:
          type: string
          description: Config directory
        gid:
          type: integer
          format: int32
          description: Group id
          minimum: 0
        ssl:
          oneOf:
          - $ref: '#/components/schemas/SslConfig'
            description: Optional ssl configuration
          - type: 'null'
    DeviceInfo:
      type: object
      description: DeviceInfo represents a device that can be used by a container.
      properties:
        Source:
          type:
          - string
          - 'null'
          description: The origin device driver.
        ID:
          type:
          - string
          - 'null'
          description: The unique identifier for the device within its source driver. For CDI devices, this would be an FQDN like \"vendor.com/gpu=0\".
    DeviceMapping:
      type: object
      description: A device mapping between the host and container
      properties:
        PathOnHost:
          type:
          - string
          - 'null'
        PathInContainer:
          type:
          - string
          - 'null'
        CgroupPermissions:
          type:
          - string
          - 'null'
    DeviceRequest:
      type: object
      description: A request for devices to be sent to device drivers
      properties:
        Driver:
          type:
          - string
          - 'null'
          description: The name of the device driver to use for this request.  Note that if this is specified the capabilities are ignored when selecting a device driver.
        Count:
          type:
          - integer
          - 'null'
          format: int64
        DeviceIDs:
          type:
          - array
          - 'null'
          items:
            type: string
        Capabilities:
          type:
          - array
          - 'null'
          items:
            type: array
            items:
              type: string
          description: A list of capabilities; an OR list of AND lists of capabilities.  Note that if a driver is specified the capabilities have no effect on selecting a driver as the driver name is used directly.  Note that if no driver is specified the capabilities are used to select a driver with the required capabilities.
        Options:
          type:
          - object
          - 'null'
          description: Driver-specific options, specified as a key/value pairs. These options are passed directly to the driver.
          additionalProperties:
            type: string
          propertyNames:
            type: string
    DnsEntry:
      type: object
      required:
      - Name
      - IpAddress
      properties:
        Name:
          type: string
        IpAddress:
          $ref: '#/components/schemas/NetworkKind'
      additionalProperties: false
    DriverData:
      type: object
      description: Information about the storage driver used to store the container's and image's filesystem.
      required:
      - Name
      - Data
      properties:
        Name:
          type: string
          description: Name of the storage driver.
        Data:
          type: object
          description: Low-level storage metadata, provided as key/value pairs.  This information is driver-specific, and depends on the storage-driver in use, and should be used for informational purposes only.
          additionalProperties:
            type: string
          propertyNames:
            type: string
    EndpointIpamConfig:
      type: object
      description: EndpointIPAMConfig represents an endpoint's IPAM configuration.
      properties:
        IPv4Address:
          type:
          - string
          - 'null'
        IPv6Address:
          type:
          - string
          - 'null'
        LinkLocalIPs:
          type:
          - array
          - 'null'
          items:
            type: string
    EndpointResource:
      type: object
      description: contains network resources allocated and used for a container in a network.
      properties:
        Name:
          type:
          - string
          - 'null'
        EndpointID:
          type:
          - string
          - 'null'
        MacAddress:
          type:
          - string
          - 'null'
        IPv4Address:
          type:
          - string
          - 'null'
        IPv6Address:
          type:
          - string
          - 'null'
    EndpointSettings:
      type: object
      description: Configuration for a network endpoint.
      properties:
        IPAMConfig:
          oneOf:
          - $ref: '#/components/schemas/EndpointIpamConfig'
          - type: 'null'
        Links:
          type:
          - array
          - 'null'
          items:
            type: string
        MacAddress:
          type:
          - string
          - 'null'
          description: MAC address for the endpoint on this network. The network driver might ignore this parameter.
        Aliases:
          type:
          - array
          - 'null'
          items:
            type: string
        DriverOpts:
          type:
          - object
          - 'null'
          description: DriverOpts is a mapping of driver options and values. These options are passed directly to the driver and are driver specific.
          additionalProperties:
            type: string
          propertyNames:
            type: string
        GwPriority:
          type:
          - integer
          - 'null'
          format: int64
          description: This property determines which endpoint will provide the default gateway for a container. The endpoint with the highest priority will be used. If multiple endpoints have the same priority, endpoints are lexicographically sorted based on their network name, and the one that sorts first is picked.
        NetworkID:
          type:
          - string
          - 'null'
          description: Unique ID of the network.
        EndpointID:
          type:
          - string
          - 'null'
          description: Unique ID for the service endpoint in a Sandbox.
        Gateway:
          type:
          - string
          - 'null'
          description: Gateway address for this network.
        IPAddress:
          type:
          - string
          - 'null'
          description: IPv4 address.
        IPPrefixLen:
          type:
          - integer
          - 'null'
          format: int64
          description: Mask length of the IPv4 address.
        IPv6Gateway:
          type:
          - string
          - 'null'
          description: IPv6 gateway address.
        GlobalIPv6Address:
          type:
          - string
          - 'null'
          description: Global IPv6 address.
        GlobalIPv6PrefixLen:
          type:
          - integer
          - 'null'
          format: int64
          description: Mask length of the global IPv6 address.
        DNSNames:
          type:
          - array
          - 'null'
          items:
            type: string
          description: List of all DNS names an endpoint has on a specific network. This list is based on the container name, network aliases, container short ID, and hostname.  These DNS names are non-fully qualified but can contain several dots. You can get fully qualified DNS names by appending `.<network-name>`. For instance, if container name is `my.ctr` and the network is named `testnet`, `DNSNames` will contain `my.ctr` and the FQDN will be `my.ctr.testnet`.
    Event:
      type: object
      description: Event is a generic event type that is used to notify state changes
      required:
      - Key
      - CreatedAt
      - ExpiresAt
      - ReportingNode
      - ReportingController
      - Kind
      - Action
      - Reason
      properties:
        Key:
          type: string
          format: uuid
          description: Unique identifier of this event.
        CreatedAt:
          type: string
          format: date-time
          description: When the event was created.
        ExpiresAt:
          type: string
          format: date-time
          description: When the event expires.
        ReportingNode:
          type: string
          description: Reporting Node is the name of the node where the Event was generated.
        ReportingController:
          type: string
          description: |-
            Reporting Controller is the name of the controller that emitted this Event.
            e.g. `nanocl.io/core`. This field cannot be empty for new Events.
        Kind:
          $ref: '#/components/schemas/EventKind'
          description: |-
            Kind of this event (Error, Normal, Warning), new types could be added in the future.
            It is machine-readable. This field cannot be empty for new Events.
        Action:
          type: string
          description: |-
            Action is what action was taken/failed regarding to the regarding actor.
            It is machine-readable.
            This field cannot be empty for new Events and it can have at most 128 characters.
        Reason:
          type: string
          description: |-
            Reason is why the action was taken. It is human-readable.
            This field cannot be empty for new Events and it can have at most 128 characters.
        Note:
          type:
          - string
          - 'null'
          description: Human-readable description of the status of this operation
        Actor:
          oneOf:
          - $ref: '#/components/schemas/EventActor'
            description: Actor contains the object this Event is about.
          - type: 'null'
        Related:
          oneOf:
          - $ref: '#/components/schemas/EventActor'
            description: |-
              Optional secondary actor for more complex actions.
              E.g. when regarding actor triggers a creation or deletion of related actor.
          - type: 'null'
        Metadata:
          type: object
          description: Standard metadata.
          additionalProperties:
            $ref: '#/components/schemas/Any'
          propertyNames:
            type: string
    EventActor:
      type: object
      description: Actor is the actor that triggered the event
      required:
      - Kind
      properties:
        Key:
          type:
          - string
          - 'null'
        Kind:
          $ref: '#/components/schemas/EventActorKind'
        Attributes:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Any'
          propertyNames:
            type: string
    EventActorKind:
      type: string
      description: Kind is the type of event related to the actor kind
      enum:
      - Namespace
      - Cargo
      - Vm
      - Job
      - Resource
      - Secret
      - Process
      - ContainerImage
    EventCondition:
      type: object
      description: Condition to stop watching for events if their are meet
      required:
      - Kind
      - Action
      properties:
        ActorKey:
          type:
          - string
          - 'null'
        ActorKind:
          oneOf:
          - $ref: '#/components/schemas/EventActorKind'
          - type: 'null'
        RelatedKey:
          type:
          - string
          - 'null'
        RelatedKind:
          oneOf:
          - $ref: '#/components/schemas/EventActorKind'
          - type: 'null'
        Kind:
          type: array
          items:
            $ref: '#/components/schemas/EventKind'
        Action:
          type: array
          items:
            $ref: '#/components/schemas/NativeEventAction'
    EventKind:
      type: string
      description: Kind of event (Error, Normal, Warning), new types could be added in the future.
      enum:
      - error
      - normal
      - warning
    FirewallInfo:
      type: object
      description: Information about the daemon's firewalling configuration.  This field is currently only used on Linux, and omitted on other platforms.
      properties:
        Driver:
          type:
          - string
          - 'null'
          description: The name of the firewall backend driver.
        Info:
          type:
          - array
          - 'null'
          items:
            type: array
            items:
              type: string
          description: 'Information about the firewall backend, provided as \"label\" / \"value\" pairs.  <p><br /></p>  > **Note**: The information returned in this field, including the > formatting of values and labels, should not be considered stable, > and may change without notice.'
    GenericCount:
      type: object
      description: Generic count response
      required:
      - Count
      properties:
        Count:
          type: integer
          format: int64
          description: Number of items
    GenericResourcesInner:
      type: object
      properties:
        NamedResourceSpec:
          oneOf:
          - $ref: '#/components/schemas/GenericResourcesInnerNamedResourceSpec'
          - type: 'null'
        DiscreteResourceSpec:
          oneOf:
          - $ref: '#/components/schemas/GenericResourcesInnerDiscreteResourceSpec'
          - type: 'null'
    GenericResourcesInnerDiscreteResourceSpec:
      type: object
      properties:
        Kind:
          type:
          - string
          - 'null'
        Value:
          type:
          - integer
          - 'null'
          format: int64
    GenericResourcesInnerNamedResourceSpec:
      type: object
      properties:
        Kind:
          type:
          - string
          - 'null'
        Value:
          type:
          - string
          - 'null'
    HashMap:
      type: object
      additionalProperties:
        oneOf:
        - type: 'null'
        - type: array
          items:
            type: object
            description: PortBinding represents a binding between a host IP address and a host port.
            properties:
              HostIp:
                type:
                - string
                - 'null'
                description: Host IP address that the container's port is mapped to.
              HostPort:
                type:
                - string
                - 'null'
                description: Host port number that the container's port is mapped to.
      propertyNames:
        type: string
    Health:
      type: object
      description: Health stores information about the container's healthcheck results.
      properties:
        Status:
          oneOf:
          - $ref: '#/components/schemas/HealthStatusEnum'
            description: Status is one of `none`, `starting`, `healthy` or `unhealthy`  - \"none\"      Indicates there is no healthcheck - \"starting\"  Starting indicates that the container is not yet ready - \"healthy\"   Healthy indicates that the container is running correctly - \"unhealthy\" Unhealthy indicates that the container has a problem
          - type: 'null'
        FailingStreak:
          type:
          - integer
          - 'null'
          format: int64
          description: FailingStreak is the number of consecutive failures
        Log:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/HealthcheckResult'
          description: Log contains the last few results (oldest first)
    HealthConfig:
      type: object
      description: A test to perform to check that the container is healthy. Healthcheck commands should be side-effect free.
      properties:
        Test:
          type:
          - array
          - 'null'
          items:
            type: string
          description: 'The test to perform. Possible values are:  - `[]` inherit healthcheck from image or parent image - `[\"NONE\"]` disable healthcheck - `[\"CMD\", args...]` exec arguments directly - `[\"CMD-SHELL\", command]` run command with system''s default shell  A non-zero exit code indicates a failed healthcheck: - `0` healthy - `1` unhealthy - `2` reserved (treated as unhealthy) - other values: error running probe'
        Interval:
          type:
          - integer
          - 'null'
          format: int64
          description: The time to wait between checks in nanoseconds. It should be 0 or at least 1000000 (1 ms). 0 means inherit.
        Timeout:
          type:
          - integer
          - 'null'
          format: int64
          description: The time to wait before considering the check to have hung. It should be 0 or at least 1000000 (1 ms). 0 means inherit.  If the health check command does not complete within this timeout, the check is considered failed and the health check process is forcibly terminated without a graceful shutdown.
        Retries:
          type:
          - integer
          - 'null'
          format: int64
          description: The number of consecutive failures needed to consider a container as unhealthy. 0 means inherit.
        StartPeriod:
          type:
          - integer
          - 'null'
          format: int64
          description: Start period for the container to initialize before starting health-retries countdown in nanoseconds. It should be 0 or at least 1000000 (1 ms). 0 means inherit.
        StartInterval:
          type:
          - integer
          - 'null'
          format: int64
          description: The time to wait between checks in nanoseconds during the start period. It should be 0 or at least 1000000 (1 ms). 0 means inherit.
    HealthStatusEnum:
      type: string
      enum:
      - EMPTY
      - none
      - starting
      - healthy
      - unhealthy
    HealthcheckResult:
      type: object
      description: HealthcheckResult stores information about a single run of a healthcheck probe
      properties:
        Start:
          type:
          - string
          - 'null'
          format: date-time
          description: Date and time at which this check started in [RFC 3339](https://www.ietf.org/rfc/rfc3339.txt) format with nano-seconds.
        End:
          type:
          - string
          - 'null'
          format: date-time
          description: Date and time at which this check ended in [RFC 3339](https://www.ietf.org/rfc/rfc3339.txt) format with nano-seconds.
        ExitCode:
          type:
          - integer
          - 'null'
          format: int64
          description: 'ExitCode meanings:  - `0` healthy - `1` unhealthy - `2` reserved (considered unhealthy) - other values: error running probe'
        Output:
          type:
          - string
          - 'null'
          description: Output from last check
    HostConfig:
      type: object
      description: Container configuration that depends on the host we are running on
      properties:
        CpuShares:
          type:
          - integer
          - 'null'
          format: int64
          description: An integer value representing this container's relative CPU weight versus other containers.
        Memory:
          type:
          - integer
          - 'null'
          format: int64
          description: Memory limit in bytes.
        CgroupParent:
          type:
          - string
          - 'null'
          description: Path to `cgroups` under which the container's `cgroup` is created. If the path is not absolute, the path is considered to be relative to the `cgroups` path of the init process. Cgroups are created if they do not already exist.
        BlkioWeight:
          type:
          - integer
          - 'null'
          format: int32
          description: Block IO weight (relative weight).
          minimum: 0
        BlkioWeightDevice:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ResourcesBlkioWeightDevice'
          description: 'Block IO weight (relative device weight) in the form:  ``` [{\"Path\": \"device_path\", \"Weight\": weight}] ```'
        BlkioDeviceReadBps:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ThrottleDevice'
          description: 'Limit read rate (bytes per second) from a device, in the form:  ``` [{\"Path\": \"device_path\", \"Rate\": rate}] ```'
        BlkioDeviceWriteBps:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ThrottleDevice'
          description: 'Limit write rate (bytes per second) to a device, in the form:  ``` [{\"Path\": \"device_path\", \"Rate\": rate}] ```'
        BlkioDeviceReadIOps:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ThrottleDevice'
          description: 'Limit read rate (IO per second) from a device, in the form:  ``` [{\"Path\": \"device_path\", \"Rate\": rate}] ```'
        BlkioDeviceWriteIOps:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ThrottleDevice'
          description: 'Limit write rate (IO per second) to a device, in the form:  ``` [{\"Path\": \"device_path\", \"Rate\": rate}] ```'
        CpuPeriod:
          type:
          - integer
          - 'null'
          format: int64
          description: The length of a CPU period in microseconds.
        CpuQuota:
          type:
          - integer
          - 'null'
          format: int64
          description: Microseconds of CPU time that the container can get in a CPU period.
        CpuRealtimePeriod:
          type:
          - integer
          - 'null'
          format: int64
          description: The length of a CPU real-time period in microseconds. Set to 0 to allocate no time allocated to real-time tasks.
        CpuRealtimeRuntime:
          type:
          - integer
          - 'null'
          format: int64
          description: The length of a CPU real-time runtime in microseconds. Set to 0 to allocate no time allocated to real-time tasks.
        CpusetCpus:
          type:
          - string
          - 'null'
          description: CPUs in which to allow execution (e.g., `0-3`, `0,1`).
        CpusetMems:
          type:
          - string
          - 'null'
          description: Memory nodes (MEMs) in which to allow execution (0-3, 0,1). Only effective on NUMA systems.
        Devices:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/DeviceMapping'
          description: A list of devices to add to the container.
        DeviceCgroupRules:
          type:
          - array
          - 'null'
          items:
            type: string
          description: a list of cgroup rules to apply to the container
        DeviceRequests:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/DeviceRequest'
          description: A list of requests for devices to be sent to device drivers.
        MemoryReservation:
          type:
          - integer
          - 'null'
          format: int64
          description: Memory soft limit in bytes.
        MemorySwap:
          type:
          - integer
          - 'null'
          format: int64
          description: Total memory limit (memory + swap). Set as `-1` to enable unlimited swap.
        MemorySwappiness:
          type:
          - integer
          - 'null'
          format: int64
          description: Tune a container's memory swappiness behavior. Accepts an integer between 0 and 100.
        NanoCpus:
          type:
          - integer
          - 'null'
          format: int64
          description: CPU quota in units of 10<sup>-9</sup> CPUs.
        OomKillDisable:
          type:
          - boolean
          - 'null'
          description: Disable OOM Killer for the container.
        Init:
          type:
          - boolean
          - 'null'
          description: Run an init inside the container that forwards signals and reaps processes. This field is omitted if empty, and the default (as configured on the daemon) is used.
        PidsLimit:
          type:
          - integer
          - 'null'
          format: int64
          description: Tune a container's PIDs limit. Set `0` or `-1` for unlimited, or `null` to not change.
        Ulimits:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ResourcesUlimits'
          description: 'A list of resource limits to set in the container. For example:  ``` {\"Name\": \"nofile\", \"Soft\": 1024, \"Hard\": 2048} ```'
        CpuCount:
          type:
          - integer
          - 'null'
          format: int64
          description: The number of usable CPUs (Windows only).  On Windows Server containers, the processor resource controls are mutually exclusive. The order of precedence is `CPUCount` first, then `CPUShares`, and `CPUPercent` last.
        CpuPercent:
          type:
          - integer
          - 'null'
          format: int64
          description: The usable percentage of the available CPUs (Windows only).  On Windows Server containers, the processor resource controls are mutually exclusive. The order of precedence is `CPUCount` first, then `CPUShares`, and `CPUPercent` last.
        IOMaximumIOps:
          type:
          - integer
          - 'null'
          format: int64
          description: Maximum IOps for the container system drive (Windows only)
        IOMaximumBandwidth:
          type:
          - integer
          - 'null'
          format: int64
          description: Maximum IO in bytes per second for the container system drive (Windows only).
        Binds:
          type:
          - array
          - 'null'
          items:
            type: string
          description: 'A list of volume bindings for this container. Each volume binding is a string in one of these forms:  - `host-src:container-dest[:options]` to bind-mount a host path   into the container. Both `host-src`, and `container-dest` must   be an _absolute_ path. - `volume-name:container-dest[:options]` to bind-mount a volume   managed by a volume driver into the container. `container-dest`   must be an _absolute_ path.  `options` is an optional, comma-delimited list of:  - `nocopy` disables automatic copying of data from the container   path to the volume. The `nocopy` flag only applies to named volumes. - `[ro|rw]` mounts a volume read-only or read-write, respectively.   If omitted or set to `rw`, volumes are mounted read-write. - `[z|Z]` applies SELinux labels to allow or deny multiple containers   to read and write to the same volume.     - `z`: a _shared_ content label is applied to the content. This       label indicates that multiple containers can share the volume       content, for both reading and writing.     - `Z`: a _private unshared_ label is applied to the content.       This label indicates that only the current container can use       a private volume. Labeling systems such as SELinux require       proper labels to be placed on volume content that is mounted       into a container. Without a label, the security system can       prevent a container''s processes from using the content. By       default, the labels set by the host operating system are not       modified. - `[[r]shared|[r]slave|[r]private]` specifies mount   [propagation behavior](https://www.kernel.org/doc/Documentation/filesystems/sharedsubtree.txt).   This only applies to bind-mounted volumes, not internal volumes   or named volumes. Mount propagation requires the source mount   point (the location where the source directory is mounted in the   host operating system) to have the correct propagation properties.   For shared volumes, the source mount point must be set to `shared`.   For slave volumes, the mount must be set to either `shared` or   `slave`.'
        ContainerIDFile:
          type:
          - string
          - 'null'
          description: Path to a file where the container ID is written
        LogConfig:
          oneOf:
          - $ref: '#/components/schemas/HostConfigLogConfig'
          - type: 'null'
        NetworkMode:
          type:
          - string
          - 'null'
          description: 'Network mode to use for this container. Supported standard values are: `bridge`, `host`, `none`, and `container:<name|id>`. Any other value is taken as a custom network''s name to which this container should connect to.'
        PortBindings:
          type:
          - object
          - 'null'
          additionalProperties:
            type:
            - array
            - 'null'
            items:
              $ref: '#/components/schemas/PortBinding'
          propertyNames:
            type: string
        RestartPolicy:
          oneOf:
          - $ref: '#/components/schemas/RestartPolicy'
          - type: 'null'
        AutoRemove:
          type:
          - boolean
          - 'null'
          description: Automatically remove the container when the container's process exits. This has no effect if `RestartPolicy` is set.
        VolumeDriver:
          type:
          - string
          - 'null'
          description: Driver that this container uses to mount volumes.
        VolumesFrom:
          type:
          - array
          - 'null'
          items:
            type: string
          description: A list of volumes to inherit from another container, specified in the form `<container name>[:<ro|rw>]`.
        Mounts:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Mount'
          description: Specification for mounts to be added to the container.
        ConsoleSize:
          type:
          - array
          - 'null'
          items:
            type: integer
            minimum: 0
          description: Initial console size, as an `[height, width]` array.
        Annotations:
          type:
          - object
          - 'null'
          description: Arbitrary non-identifying metadata attached to container and provided to the runtime when the container is started.
          additionalProperties:
            type: string
          propertyNames:
            type: string
        CapAdd:
          type:
          - array
          - 'null'
          items:
            type: string
          description: A list of kernel capabilities to add to the container. Conflicts with option 'Capabilities'.
        CapDrop:
          type:
          - array
          - 'null'
          items:
            type: string
          description: A list of kernel capabilities to drop from the container. Conflicts with option 'Capabilities'.
        CgroupnsMode:
          oneOf:
          - $ref: '#/components/schemas/HostConfigCgroupnsModeEnum'
            description: 'cgroup namespace mode for the container. Possible values are:  - `\"private\"`: the container runs in its own private cgroup namespace - `\"host\"`: use the host system''s cgroup namespace  If not specified, the daemon default is used, which can either be `\"private\"` or `\"host\"`, depending on daemon version, kernel support and configuration.'
          - type: 'null'
        Dns:
          type:
          - array
          - 'null'
          items:
            type: string
          description: A list of DNS servers for the container to use.
        DnsOptions:
          type:
          - array
          - 'null'
          items:
            type: string
          description: A list of DNS options.
        DnsSearch:
          type:
          - array
          - 'null'
          items:
            type: string
          description: A list of DNS search domains.
        ExtraHosts:
          type:
          - array
          - 'null'
          items:
            type: string
          description: A list of hostnames/IP mappings to add to the container's `/etc/hosts` file. Specified in the form `[\"hostname:IP\"]`.
        GroupAdd:
          type:
          - array
          - 'null'
          items:
            type: string
          description: A list of additional groups that the container process will run as.
        IpcMode:
          type:
          - string
          - 'null'
          description: 'IPC sharing mode for the container. Possible values are:  - `\"none\"`: own private IPC namespace, with /dev/shm not mounted - `\"private\"`: own private IPC namespace - `\"shareable\"`: own private IPC namespace, with a possibility to share it with other containers - `\"container:<name|id>\"`: join another (shareable) container''s IPC namespace - `\"host\"`: use the host system''s IPC namespace  If not specified, daemon default is used, which can either be `\"private\"` or `\"shareable\"`, depending on daemon version and configuration.'
        Cgroup:
          type:
          - string
          - 'null'
          description: Cgroup to use for the container.
        Links:
          type:
          - array
          - 'null'
          items:
            type: string
          description: A list of links for the container in the form `container_name:alias`.
        OomScoreAdj:
          type:
          - integer
          - 'null'
          format: int64
          description: An integer value containing the score given to the container in order to tune OOM killer preferences.
        PidMode:
          type:
          - string
          - 'null'
          description: 'Set the PID (Process) Namespace mode for the container. It can be either:  - `\"container:<name|id>\"`: joins another container''s PID namespace - `\"host\"`: use the host''s PID namespace inside the container'
        Privileged:
          type:
          - boolean
          - 'null'
          description: Gives the container full access to the host.
        PublishAllPorts:
          type:
          - boolean
          - 'null'
          description: Allocates an ephemeral host port for all of a container's exposed ports.  Ports are de-allocated when the container stops and allocated when the container starts. The allocated port might be changed when restarting the container.  The port is selected from the ephemeral port range that depends on the kernel. For example, on Linux the range is defined by `/proc/sys/net/ipv4/ip_local_port_range`.
        ReadonlyRootfs:
          type:
          - boolean
          - 'null'
          description: Mount the container's root filesystem as read only.
        SecurityOpt:
          type:
          - array
          - 'null'
          items:
            type: string
          description: A list of string values to customize labels for MLS systems, such as SELinux.
        StorageOpt:
          type:
          - object
          - 'null'
          description: 'Storage driver options for this container, in the form `{\"size\": \"120G\"}`.'
          additionalProperties:
            type: string
          propertyNames:
            type: string
        Tmpfs:
          type:
          - object
          - 'null'
          description: 'A map of container directories which should be replaced by tmpfs mounts, and their corresponding mount options. For example:  ``` { \"/run\": \"rw,noexec,nosuid,size=65536k\" } ```'
          additionalProperties:
            type: string
          propertyNames:
            type: string
        UTSMode:
          type:
          - string
          - 'null'
          description: UTS namespace to use for the container.
        UsernsMode:
          type:
          - string
          - 'null'
          description: Sets the usernamespace mode for the container when usernamespace remapping option is enabled.
        ShmSize:
          type:
          - integer
          - 'null'
          format: int64
          description: Size of `/dev/shm` in bytes. If omitted, the system uses 64MB.
        Sysctls:
          type:
          - object
          - 'null'
          description: A list of kernel parameters (sysctls) to set in the container.  This field is omitted if not set.
          additionalProperties:
            type: string
          propertyNames:
            type: string
        Runtime:
          type:
          - string
          - 'null'
          description: Runtime to use with this container.
        Isolation:
          oneOf:
          - $ref: '#/components/schemas/HostConfigIsolationEnum'
            description: Isolation technology of the container. (Windows only)
          - type: 'null'
        MaskedPaths:
          type:
          - array
          - 'null'
          items:
            type: string
          description: The list of paths to be masked inside the container (this overrides the default set of paths).
        ReadonlyPaths:
          type:
          - array
          - 'null'
          items:
            type: string
          description: The list of paths to be set as read-only inside the container (this overrides the default set of paths).
    HostConfigCgroupnsModeEnum:
      type: string
      enum:
      - EMPTY
      - private
      - host
    HostConfigIsolationEnum:
      type: string
      enum:
      - default
      - process
      - hyperv
      - EMPTY
    HostConfigLogConfig:
      type: object
      description: The logging configuration for this container
      properties:
        Type:
          type:
          - string
          - 'null'
          description: Name of the logging driver used for the container or \"none\" if logging is disabled.
        Config:
          type:
          - object
          - 'null'
          description: Driver-specific configuration options for the logging driver.
          additionalProperties:
            type: string
          propertyNames:
            type: string
    HostInfo:
      allOf:
      - $ref: '#/components/schemas/SystemInfo'
        description: Docker contains information about the docker daemon
      - type: object
        required:
        - HostGateway
        - Network
        - Config
        properties:
          HostGateway:
            type: string
            description: HostGateway is the gateway address of the host
          Network:
            $ref: '#/components/schemas/NetworkInspect'
            description: Network configuration
          Config:
            $ref: '#/components/schemas/DaemonConfig'
            description: Daemon configuration
      description: HostInfo contains information about the host and the docker daemon
    Hsts:
      oneOf:
      - type: string
        enum:
        - Recommended
      - type: string
        enum:
        - Strict
      - type: object
        required:
        - Config
        properties:
          Config:
            $ref: '#/components/schemas/HstsConfig'
    HstsConfig:
      type: object
      required:
      - MaxAge
      - Preload
      - Always
      - IncludeSubDomains
      properties:
        MaxAge:
          type: integer
          format: int64
          minimum: 0
        Preload:
          type: boolean
        Always:
          type: boolean
        IncludeSubDomains:
          type: boolean
      additionalProperties: false
    HttpTarget:
      type: object
      required:
      - Url
      properties:
        Url:
          type: string
          description: Url to target
        Redirect:
          oneOf:
          - $ref: '#/components/schemas/UrlRedirect'
            description: Redirect type if it's a redirect
          - type: 'null'
      additionalProperties: false
    ImagePullPolicy:
      type: string
      description: Policy for pulling images related to process objects (job, cargo, vm)
      enum:
      - Never
      - Always
      - IfNotPresent
    IndexInfo:
      type: object
      description: IndexInfo contains information about a registry.
      properties:
        Name:
          type:
          - string
          - 'null'
          description: Name of the registry, such as \"docker.io\".
        Mirrors:
          type:
          - array
          - 'null'
          items:
            type: string
          description: List of mirrors, expressed as URIs.
        Secure:
          type:
          - boolean
          - 'null'
          description: 'Indicates if the registry is part of the list of insecure registries.  If `false`, the registry is insecure. Insecure registries accept un-encrypted (HTTP) and/or untrusted (HTTPS with certificates from unknown CAs) communication.  > **Warning**: Insecure registries can be useful when running a local > registry. However, because its use creates security vulnerabilities > it should ONLY be enabled for testing purposes. For increased > security, users should add their CA to their system''s list of > trusted CAs instead of enabling this option.'
        Official:
          type:
          - boolean
          - 'null'
          description: Indicates whether this is an official registry (i.e., Docker Hub / docker.io)
    Ipam:
      type: object
      properties:
        Driver:
          type:
          - string
          - 'null'
          description: Name of the IPAM driver to use.
        Config:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/IpamConfig'
          description: 'List of IPAM configuration options, specified as a map:  ``` {\"Subnet\": <CIDR>, \"IPRange\": <CIDR>, \"Gateway\": <IP address>, \"AuxAddress\": <device_name:IP address>} ```'
        Options:
          type:
          - object
          - 'null'
          description: Driver-specific options, specified as a map.
          additionalProperties:
            type: string
          propertyNames:
            type: string
    IpamConfig:
      type: object
      properties:
        Subnet:
          type:
          - string
          - 'null'
        IPRange:
          type:
          - string
          - 'null'
        Gateway:
          type:
          - string
          - 'null'
        AuxiliaryAddresses:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
          propertyNames:
            type: string
    IpamStatus:
      type: object
      properties:
        Subnets:
          type:
          - object
          - 'null'
          additionalProperties:
            $ref: '#/components/schemas/SubnetStatus'
          propertyNames:
            type: string
    Job:
      type: object
      description: A job and its current runtime state.
      required:
      - IncarnationKey
      - SpecKey
      - CreatedAt
      - UpdatedAt
      - Status
      - Spec
      properties:
        IncarnationKey:
          type: string
          format: uuid
          description: Retained identity of this creation of the named job
        SpecKey:
          type: string
          format: uuid
          description: Immutable authored specification used by the live job
        CurrentRunKey:
          type:
          - string
          - 'null'
          format: uuid
          description: Most recently accepted execution, if any
        CreatedAt:
          type: string
          format: date-time
          description: When the job was created
        UpdatedAt:
          type: string
          format: date-time
          description: When the job was updated
        Status:
          $ref: '#/components/schemas/ObjPsStatus'
          description: Status of the job
        Spec:
          $ref: '#/components/schemas/JobSpec'
          description: Specification of the job
    JobDeleteQuery:
      type: object
      description: Optional identity fence for deleting the exact Job inspected by a caller.
      properties:
        incarnation:
          type:
          - string
          - 'null'
          format: uuid
          description: Expected incarnation. Omission preserves ordinary deletion by name.
        run:
          type:
          - string
          - 'null'
          format: uuid
          description: Expected current run. With an incarnation and no run, require no run.
    JobHistoryQuery:
      type: object
      description: Bounded pagination for Job configuration history and retained executions.
      properties:
        limit:
          type:
          - integer
          - 'null'
          format: int64
          description: Page size, defaults to 50 and must be between 1 and 100
        offset:
          type:
          - integer
          - 'null'
          format: int64
          description: Number of records to skip, defaults to zero
    JobInspect:
      type: object
      description: Detailed information about a job
      required:
      - IncarnationKey
      - SpecKey
      - CreatedAt
      - UpdatedAt
      - Status
      - InstanceTotal
      - InstanceSuccess
      - InstanceRunning
      - InstanceFailed
      - Spec
      - Instances
      properties:
        IncarnationKey:
          type: string
          format: uuid
          description: Retained identity of this creation of the named job
        SpecKey:
          type: string
          format: uuid
          description: Immutable authored specification used by the live job
        CurrentRunKey:
          type:
          - string
          - 'null'
          format: uuid
          description: Most recently accepted execution, if any
        CreatedAt:
          type: string
          format: date-time
          description: When the job was created
        UpdatedAt:
          type: string
          format: date-time
          description: When the job was updated
        Status:
          $ref: '#/components/schemas/ObjPsStatus'
          description: Status of the job
        InstanceTotal:
          type: integer
          description: Number of instances
          minimum: 0
        InstanceSuccess:
          type: integer
          description: Number of instance that succeeded
          minimum: 0
        InstanceRunning:
          type: integer
          description: Number of instance running
          minimum: 0
        InstanceFailed:
          type: integer
          description: Number of instance failed
          minimum: 0
        Spec:
          $ref: '#/components/schemas/JobSpec'
          description: Specification of the job
        Instances:
          type: array
          items:
            $ref: '#/components/schemas/Process'
          description: List of instances
    JobPartial:
      type: object
      description: Job partial is used to create a new job
      required:
      - Name
      - Containers
      properties:
        Name:
          type: string
          description: Name of the job
        Secrets:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Secrets to load as environment variables
        Metadata:
          type: object
          description: Metadata (user defined)
          additionalProperties:
            $ref: '#/components/schemas/Any'
          propertyNames:
            type: string
        Schedule:
          type:
          - string
          - 'null'
          description: |-
            Five-field cron expression or supported shortcut; see
            [`crate::cron::validate_schedule`].
        Ttl:
          type:
          - integer
          - 'null'
          description: Remove the job after (x) seconds after execution
          minimum: 0
        ImagePullSecret:
          type:
          - string
          - 'null'
          description: Secret to use when pulling the image
        ImagePullPolicy:
          oneOf:
          - $ref: '#/components/schemas/ImagePullPolicy'
          - type: 'null'
        Containers:
          type: array
          items:
            $ref: '#/components/schemas/ContainerCreateBody'
          description: List of container to run
      additionalProperties: false
    JobRun:
      type: object
      description: A retained execution of an exact Job incarnation and authored revision.
      required:
      - Key
      - JobName
      - IncarnationKey
      - SpecKey
      - OperationKey
      - AcceptedAt
      - State
      properties:
        Key:
          type: string
          format: uuid
        JobName:
          type: string
        IncarnationKey:
          type: string
          format: uuid
        SpecKey:
          type: string
          format: uuid
        OperationKey:
          type: string
          format: uuid
        AcceptedAt:
          type: string
          format: date-time
        StartedAt:
          type:
          - string
          - 'null'
          format: date-time
        FinishedAt:
          type:
          - string
          - 'null'
          format: date-time
        State:
          $ref: '#/components/schemas/JobRunState'
        Reason:
          type:
          - string
          - 'null'
    JobRunInspect:
      type: object
      description: |-
        Execution history, including the authored definition before secret injection.
        Retaining this history does not retain Docker logs.
      required:
      - Run
      - Spec
      - Operation
      - Steps
      properties:
        Run:
          $ref: '#/components/schemas/JobRun'
        Spec:
          $ref: '#/components/schemas/JobSpec'
        Operation:
          $ref: '#/components/schemas/JobRunOperation'
        Steps:
          type: array
          items:
            $ref: '#/components/schemas/JobRunStep'
          description: Results in ascending step index order
    JobRunOperation:
      type: object
      description: |-
        Public initiating control operation, excluding internal ownership and locks.
        Its completion acknowledges dispatch, not successful workload completion.
      required:
      - Key
      - IncarnationKey
      - ResourceKind
      - ResourceKey
      - Action
      - SpecKey
      - AcceptedAt
      properties:
        Key:
          type: string
          format: uuid
        IncarnationKey:
          type: string
          format: uuid
        ResourceKind:
          type: string
        ResourceKey:
          type: string
        Action:
          type: string
        SpecKey:
          type: string
          format: uuid
        AcceptedAt:
          type: string
          format: date-time
        CompletedAt:
          type:
          - string
          - 'null'
          format: date-time
        Outcome:
          type:
          - string
          - 'null'
        Diagnostic:
          oneOf:
          - $ref: '#/components/schemas/Any'
          - type: 'null'
    JobRunState:
      type: string
      description: |-
        Durable execution state. Unknown remains active until runtime evidence
        confirms that no work belonging to this run is still executing.
      enum:
      - Pending
      - Running
      - Stopping
      - Succeeded
      - Failed
      - Interrupted
      - Unknown
    JobRunStep:
      type: object
      description: Retained result of one step; a missing exit code means it was not observed.
      required:
      - RunKey
      - StepIndex
      - State
      properties:
        RunKey:
          type: string
          format: uuid
        StepIndex:
          type: integer
          format: int32
          description: Zero-based position in the accepted definition
        ContainerId:
          type:
          - string
          - 'null'
          description: Immutable Docker container ID, when container creation was observed
        State:
          $ref: '#/components/schemas/JobStepState'
        StartedAt:
          type:
          - string
          - 'null'
          format: date-time
        FinishedAt:
          type:
          - string
          - 'null'
          format: date-time
        ExitCode:
          type:
          - integer
          - 'null'
          format: int64
        Error:
          type:
          - string
          - 'null'
    JobSpec:
      type: object
      description: |-
        Stored revision of a Job declaration, including immutable revision metadata.
        Its containers run in sequence as a single unit to act like a command.
      required:
      - Key
      - JobKey
      - Version
      - CreatedAt
      - Name
      - Containers
      properties:
        Key:
          type: string
          format: uuid
          description: Unique identifier of the immutable Job specification
        JobKey:
          type: string
          description: Job resource key (Jobs are identified by their global name)
        Version:
          type: string
          description: Version of the specification
        CreatedAt:
          type: string
          format: date-time
          description: Creation date of the specification revision
        Name:
          type: string
          description: Name of the job
        Secrets:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Secrets to load as environment variables
        Metadata:
          type: object
          description: Metadata (user defined)
          additionalProperties:
            $ref: '#/components/schemas/Any'
          propertyNames:
            type: string
        Schedule:
          type:
          - string
          - 'null'
          description: Schedule of the job (cron)
        Ttl:
          type:
          - integer
          - 'null'
          description: Remove the job after (x) seconds after execution
          minimum: 0
        ImagePullSecret:
          type:
          - string
          - 'null'
          description: Secret to use when pulling the image
        ImagePullPolicy:
          oneOf:
          - $ref: '#/components/schemas/ImagePullPolicy'
            description: Image pull policy
          - type: 'null'
        Containers:
          type: array
          items:
            $ref: '#/components/schemas/ContainerCreateBody'
          description: Containers to run
    JobStepState:
      type: string
      description: Observed state of one ordered container step in a Job execution.
      enum:
      - Pending
      - Creating
      - Running
      - Succeeded
      - Failed
      - Interrupted
      - Unknown
      - Skipped
    JobSummary:
      type: object
      description: Summary of a job (used in list)
      required:
      - IncarnationKey
      - SpecKey
      - CreatedAt
      - UpdatedAt
      - Status
      - InstanceTotal
      - InstanceSuccess
      - InstanceRunning
      - InstanceFailed
      - Spec
      properties:
        IncarnationKey:
          type: string
          format: uuid
          description: Retained identity of this creation of the named job
        SpecKey:
          type: string
          format: uuid
          description: Immutable authored specification used by the live job
        CurrentRunKey:
          type:
          - string
          - 'null'
          format: uuid
          description: Most recently accepted execution, if any
        CreatedAt:
          type: string
          format: date-time
          description: When the job was created
        UpdatedAt:
          type: string
          format: date-time
          description: When the job was updated
        Status:
          $ref: '#/components/schemas/ObjPsStatus'
          description: Status of the job
        InstanceTotal:
          type: integer
          description: Number of instances
          minimum: 0
        InstanceSuccess:
          type: integer
          description: Number of instance that succeeded
          minimum: 0
        InstanceRunning:
          type: integer
          description: Number of instance running
          minimum: 0
        InstanceFailed:
          type: integer
          description: Number of instance failed
          minimum: 0
        Spec:
          $ref: '#/components/schemas/JobSpec'
          description: Specification of the job
    LimitReq:
      type: object
      required:
      - Burst
      properties:
        Burst:
          type: integer
          description: The burst size
          minimum: 0
        Delay:
          type:
          - integer
          - 'null'
          description: The delay to wait before retrying
          minimum: 0
      additionalProperties: false
    LimitReqZone:
      type: object
      required:
      - Size
      - Rate
      properties:
        Size:
          type: integer
          description: The max size of the cache in megabytes
          minimum: 0
        Rate:
          type: integer
          description: The max number of request per second
          minimum: 0
      additionalProperties: false
    LocalNodeState:
      type: string
      description: |-
        Current local status of this node.
        Enumeration of values.
        Since this enum's variants do not hold data, we can easily define them them as `#[repr(C)]`
        which helps with FFI.
      enum:
      - EMPTY
      - inactive
      - pending
      - active
      - error
      - locked
    LocationTarget:
      oneOf:
      - $ref: '#/components/schemas/UpstreamTarget'
        description: Target an existing cargo
      - $ref: '#/components/schemas/HttpTarget'
        description: Target a specific http url
      - $ref: '#/components/schemas/UnixTarget'
        description: Target a specific unix socket
    Metric:
      type: object
      description: Metric entry
      required:
      - Key
      - CreatedAt
      - ExpiresAt
      - NodeName
      - Kind
      - Data
      properties:
        Key:
          type: string
          format: uuid
          description: The key of the metric in the database `UUID`
        CreatedAt:
          type: string
          format: date-time
          description: When the metric was created
        ExpiresAt:
          type: string
          format: date-time
          description: When the metric will expire
        NodeName:
          type: string
          description: The node where the metric come from
        Kind:
          type: string
          description: The kind of the metric
        Data:
          description: The data of the metric
        Note:
          type:
          - string
          - 'null'
          description: Optional note about the metric
    MetricPartial:
      type: object
      description: Used to create a new metric
      required:
      - Kind
      - Data
      properties:
        Kind:
          type: string
          description: The kind of the metric
        Data:
          description: The data of the metric
        Note:
          type:
          - string
          - 'null'
          description: Optional note about the metric
    Mount:
      type: object
      properties:
        Target:
          type:
          - string
          - 'null'
          description: Container path.
        Source:
          type:
          - string
          - 'null'
          description: Mount source (e.g. a volume name, a host path). The source cannot be specified when using `Type=tmpfs`. For `Type=bind`, the source path must either exist, or the `CreateMountpoint` must be set to `true` to create the source path on the host if missing.  For `Type=npipe`, the pipe must exist prior to creating the container.
        Type:
          oneOf:
          - $ref: '#/components/schemas/MountType'
          - type: 'null'
        ReadOnly:
          type:
          - boolean
          - 'null'
          description: Whether the mount should be read-only.
        Consistency:
          type:
          - string
          - 'null'
          description: 'The consistency requirement for the mount: `default`, `consistent`, `cached`, or `delegated`.'
        BindOptions:
          oneOf:
          - $ref: '#/components/schemas/MountBindOptions'
          - type: 'null'
        VolumeOptions:
          oneOf:
          - $ref: '#/components/schemas/MountVolumeOptions'
          - type: 'null'
        ImageOptions:
          oneOf:
          - $ref: '#/components/schemas/MountImageOptions'
          - type: 'null'
        TmpfsOptions:
          oneOf:
          - $ref: '#/components/schemas/MountTmpfsOptions'
          - type: 'null'
    MountBindOptions:
      type: object
      description: Optional configuration for the `bind` type.
      properties:
        Propagation:
          oneOf:
          - $ref: '#/components/schemas/MountBindOptionsPropagationEnum'
            description: A propagation mode with the value `[r]private`, `[r]shared`, or `[r]slave`.
          - type: 'null'
        NonRecursive:
          type:
          - boolean
          - 'null'
          description: Disable recursive bind mount.
        CreateMountpoint:
          type:
          - boolean
          - 'null'
          description: Create mount point on host if missing
        ReadOnlyNonRecursive:
          type:
          - boolean
          - 'null'
          description: Make the mount non-recursively read-only, but still leave the mount recursive (unless NonRecursive is set to `true` in conjunction).  Added in v1.44, before that version all read-only mounts were non-recursive by default. To match the previous behaviour this will default to `true` for clients on versions prior to v1.44.
        ReadOnlyForceRecursive:
          type:
          - boolean
          - 'null'
          description: Raise an error if the mount cannot be made recursively read-only.
    MountBindOptionsPropagationEnum:
      type: string
      enum:
      - EMPTY
      - private
      - rprivate
      - shared
      - rshared
      - slave
      - rslave
    MountImageOptions:
      type: object
      description: Optional configuration for the `image` type.
      properties:
        Subpath:
          type:
          - string
          - 'null'
          description: Source path inside the image. Must be relative without any back traversals.
    MountPoint:
      type: object
      description: MountPoint represents a mount point configuration inside the container. This is used for reporting the mountpoints in use by a container.
      properties:
        Type:
          type:
          - string
          - 'null'
        Name:
          type:
          - string
          - 'null'
          description: Name is the name reference to the underlying data defined by `Source` e.g., the volume name.
        Source:
          type:
          - string
          - 'null'
          description: Source location of the mount.  For volumes, this contains the storage location of the volume (within `/var/lib/docker/volumes/`). For bind-mounts, and `npipe`, this contains the source (host) part of the bind-mount. For `tmpfs` mount points, this field is empty.
        Destination:
          type:
          - string
          - 'null'
          description: Destination is the path relative to the container root (`/`) where the `Source` is mounted inside the container.
        Driver:
          type:
          - string
          - 'null'
          description: Driver is the volume driver used to create the volume (if it is a volume).
        Mode:
          type:
          - string
          - 'null'
          description: Mode is a comma separated list of options supplied by the user when creating the bind/volume mount.  The default is platform-specific (`\"z\"` on Linux, empty on Windows).
        RW:
          type:
          - boolean
          - 'null'
          description: Whether the mount is mounted writable (read-write).
        Propagation:
          type:
          - string
          - 'null'
          description: Propagation describes how mounts are propagated from the host into the mount point, and vice-versa. Refer to the [Linux kernel documentation](https://www.kernel.org/doc/Documentation/filesystems/sharedsubtree.txt) for details. This field is not used on Windows.
    MountTmpfsOptions:
      type: object
      description: Optional configuration for the `tmpfs` type.
      properties:
        SizeBytes:
          type:
          - integer
          - 'null'
          format: int64
          description: The size for the tmpfs mount in bytes.
        Mode:
          type:
          - integer
          - 'null'
          format: int64
          description: The permission mode for the tmpfs mount in an integer. The value must not be in octal format (e.g. 755) but rather the decimal representation of the octal value (e.g. 493).
        Options:
          type:
          - array
          - 'null'
          items:
            type: array
            items:
              type: string
          description: The options to be passed to the tmpfs mount. An array of arrays. Flag options should be provided as 1-length arrays. Other types should be provided as as 2-length arrays, where the first item is the key and the second the value.
    MountType:
      type: string
      description: |-
        The mount type. Available types:  - `bind` Mounts a file or directory from the host into the container. The `Source` must exist prior to creating the container. - `cluster` a Swarm cluster volume - `image` Mounts an image. - `npipe` Mounts a named pipe from the host into the container. The `Source` must exist prior to creating the container. - `tmpfs` Create a tmpfs with the given options. The mount `Source` cannot be specified for tmpfs. - `volume` Creates a volume with the given name and options (or uses a pre-existing volume with the same name and options). These are **not** removed when the container is removed.
        Enumeration of values.
        Since this enum's variants do not hold data, we can easily define them them as `#[repr(C)]`
        which helps with FFI.
      enum:
      - bind
      - cluster
      - image
      - npipe
      - tmpfs
      - volume
    MountVolumeOptions:
      type: object
      description: Optional configuration for the `volume` type.
      properties:
        NoCopy:
          type:
          - boolean
          - 'null'
          description: Populate volume with data from the target.
        Labels:
          type:
          - object
          - 'null'
          description: User-defined key/value metadata.
          additionalProperties:
            type: string
          propertyNames:
            type: string
        DriverConfig:
          oneOf:
          - $ref: '#/components/schemas/MountVolumeOptionsDriverConfig'
          - type: 'null'
        Subpath:
          type:
          - string
          - 'null'
          description: Source path inside the volume. Must be relative without any back traversals.
    MountVolumeOptionsDriverConfig:
      type: object
      description: Map of driver specific options
      properties:
        Name:
          type:
          - string
          - 'null'
          description: Name of the driver to use to create the volume.
        Options:
          type:
          - object
          - 'null'
          description: key/value map of driver specific options.
          additionalProperties:
            type: string
          propertyNames:
            type: string
    Namespace:
      type: object
      description: |-
        Namespace is a identifier for a set of cargoes
        It is used to group cargoes together
      required:
      - Name
      - CreatedAt
      properties:
        Name:
          type: string
          description: The name as primary key of the namespace
        CreatedAt:
          type: string
          format: date-time
          description: When the namespace was created
        Metadata:
          description: User defined metadata
    NamespaceInspect:
      type: object
      description: |-
        A Namespace Inspect is a detailed view of a namespace
        It is used to inspect a namespace
        It contains all the information about the namespace
        It also contains the list of cargoes
      required:
      - Name
      - Cargoes
      properties:
        Name:
          type: string
          description: Name of the namespace
        Cargoes:
          type: array
          items:
            $ref: '#/components/schemas/CargoInspect'
          description: Number of cargoes
    NamespacePartial:
      type: object
      description: A Namespace partial is a payload used to create a new namespace
      required:
      - Name
      properties:
        Name:
          type: string
          description: Name of the namespace
        Metadata:
          description: User defined metadata
      additionalProperties: false
    NamespaceSummary:
      type: object
      description: |-
        A Namespace Summary is a summary of a namespace
        It is used to list all the namespaces
        It contains the number of cargoes and instances existing in the namespace
      required:
      - Name
      - Cargoes
      - Instances
      - CreatedAt
      properties:
        Name:
          type: string
          description: Name of the namespace
        Cargoes:
          type: integer
          description: Number of cargoes
          minimum: 0
        Instances:
          type: integer
          description: Number of instances
          minimum: 0
        CreatedAt:
          type: string
          format: date-time
          description: When the namespace was created
    NativeEventAction:
      oneOf:
      - type: string
        enum:
        - create
      - type: string
        enum:
        - starting
      - type: string
        enum:
        - start
      - type: string
        enum:
        - updating
      - type: string
        enum:
        - update
      - type: string
        enum:
        - destroying
      - type: string
        enum:
        - destroy
      - type: string
        enum:
        - stopping
      - type: string
        enum:
        - stop
      - type: string
        enum:
        - restart
      - type: string
        enum:
        - healthy
      - type: string
        enum:
        - unhealthy
      - type: string
        enum:
        - finish
      - type: string
        enum:
        - fail
      - type: string
        enum:
        - die
      - type: string
        enum:
        - downloading
      - type: string
        enum:
        - download
      - type: object
        required:
        - other
        properties:
          other:
            type: string
      description: Action is the action that triggered the event
    NetworkInspect:
      type: object
      description: The body of the \"get network\" http response message.
      properties:
        Name:
          type:
          - string
          - 'null'
          description: Name of the network.
        Id:
          type:
          - string
          - 'null'
          description: ID that uniquely identifies a network on a single machine.
        Created:
          type:
          - string
          - 'null'
          format: date-time
          description: Date and time at which the network was created in [RFC 3339](https://www.ietf.org/rfc/rfc3339.txt) format with nano-seconds.
        Scope:
          type:
          - string
          - 'null'
          description: The level at which the network exists (e.g. `swarm` for cluster-wide or `local` for machine level)
        Driver:
          type:
          - string
          - 'null'
          description: The name of the driver used to create the network (e.g. `bridge`, `overlay`).
        EnableIPv4:
          type:
          - boolean
          - 'null'
          description: Whether the network was created with IPv4 enabled.
        EnableIPv6:
          type:
          - boolean
          - 'null'
          description: Whether the network was created with IPv6 enabled.
        IPAM:
          oneOf:
          - $ref: '#/components/schemas/Ipam'
            description: The network's IP Address Management.
          - type: 'null'
        Internal:
          type:
          - boolean
          - 'null'
          description: Whether the network is created to only allow internal networking connectivity.
        Attachable:
          type:
          - boolean
          - 'null'
          description: Whether a global / swarm scope network is manually attachable by regular containers from workers in swarm mode.
        Ingress:
          type:
          - boolean
          - 'null'
          description: Whether the network is providing the routing-mesh for the swarm cluster.
        ConfigFrom:
          oneOf:
          - $ref: '#/components/schemas/ConfigReference'
          - type: 'null'
        ConfigOnly:
          type:
          - boolean
          - 'null'
          description: Whether the network is a config-only network. Config-only networks are placeholder networks for network configurations to be used by other networks. Config-only networks cannot be used directly to run containers or services.
        Options:
          type:
          - object
          - 'null'
          description: Network-specific options uses when creating the network.
          additionalProperties:
            type: string
          propertyNames:
            type: string
        Labels:
          type:
          - object
          - 'null'
          description: Metadata specific to the network being created.
          additionalProperties:
            type: string
          propertyNames:
            type: string
        Peers:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/PeerInfo'
          description: List of peer nodes for an overlay network. This field is only present for overlay networks, and omitted for other network types.
        Containers:
          type:
          - object
          - 'null'
          description: Contains endpoints attached to the network.
          additionalProperties:
            $ref: '#/components/schemas/EndpointResource'
          propertyNames:
            type: string
        Services:
          type:
          - object
          - 'null'
          description: List of services using the network. This field is only present for swarm scope networks, and omitted for local scope networks.
          additionalProperties: {}
          propertyNames:
            type: string
        Status:
          oneOf:
          - $ref: '#/components/schemas/NetworkStatus'
            description: provides runtime information about the network such as the number of allocated IPs.
          - type: 'null'
    NetworkKind:
      oneOf:
      - type: string
        description: A reserved selector, IP address, or user-defined network name
      - type: object
        description: Tagged escape form for a network name which looks like a reserved selector or IP address
        required:
        - Named
        properties:
          Named:
            type: string
      - type: object
        description: Backwards-compatible tagged IP address form
        required:
        - Other
        properties:
          Other:
            type: string
      description: Network binding selector
    NetworkSettings:
      type: object
      description: NetworkSettings exposes the network settings in the API
      properties:
        SandboxID:
          type:
          - string
          - 'null'
          description: SandboxID uniquely represents a container's network stack.
        SandboxKey:
          type:
          - string
          - 'null'
          description: SandboxKey is the full path of the netns handle
        Ports:
          type:
          - object
          - 'null'
          additionalProperties:
            type:
            - array
            - 'null'
            items:
              $ref: '#/components/schemas/PortBinding'
          propertyNames:
            type: string
        Networks:
          type:
          - object
          - 'null'
          description: Information about all networks that the container is connected to.
          additionalProperties:
            $ref: '#/components/schemas/EndpointSettings'
          propertyNames:
            type: string
    NetworkStatus:
      type: object
      description: provides runtime information about the network such as the number of allocated IPs.
      properties:
        IPAM:
          oneOf:
          - $ref: '#/components/schemas/IpamStatus'
          - type: 'null'
    NetworkingConfig:
      type: object
      description: NetworkingConfig represents the container's networking configuration for each of its interfaces. It is used for the networking configs specified in the `docker create` and `docker network connect` commands.
      properties:
        EndpointsConfig:
          type:
          - object
          - 'null'
          description: A mapping of network name to endpoint configuration for that network. The endpoint configuration can be left empty to connect to that network with no particular endpoint configuration.
          additionalProperties:
            $ref: '#/components/schemas/EndpointSettings'
          propertyNames:
            type: string
    NginxDuration:
      type: string
      description: A validated nginx timeout value, such as `900s` or `5m`.
    NginxSize:
      type: string
      description: A validated nginx size value, such as `0`, `10m`, or `2g`.
    Node:
      type: object
      required:
      - Name
      - CreatedAt
      - Endpoint
      - Version
      properties:
        Name:
          type: string
          description: The name of the node
        CreatedAt:
          type: string
          format: date-time
          description: The created at date
        Endpoint:
          type: string
          description: Endpoint to connect to the node
        Version:
          type: string
          description: Version of the node
        Metadata:
          description: User defined metadata
    NodeConstraint:
      type: object
      description: Arbitrary node constraint expressed as key/operator/value
      required:
      - Key
      - Operator
      - Value
      properties:
        Key:
          type: string
          description: 'Constraint key (eg: "region", "label", "group", etc.)'
        Operator:
          $ref: '#/components/schemas/ConstraintOp'
          description: Constraint operator (Eq/Ne)
        Value:
          type: string
          description: Constraint value
      additionalProperties: false
    NriInfo:
      type: object
      description: Information about the Node Resource Interface (NRI).  This field is only present if NRI is enabled.
      properties:
        Info:
          type:
          - array
          - 'null'
          items:
            type: array
            items:
              type: string
          description: 'Information about NRI, provided as \"label\" / \"value\" pairs.  <p><br /></p>  > **Note**: The information returned in this field, including the > formatting of values and labels, should not be considered stable, > and may change without notice.'
    ObjPsHealthStatusKind:
      type: string
      enum:
      - healthy
      - unhealthy
      - unknown
    ObjPsStatus:
      type: object
      required:
      - UpdatedAt
      - Wanted
      - PrevWanted
      - Actual
      - PrevActual
      - Health
      properties:
        UpdatedAt:
          type: string
          format: date-time
        Wanted:
          $ref: '#/components/schemas/ObjPsStatusKind'
        PrevWanted:
          $ref: '#/components/schemas/ObjPsStatusKind'
        Actual:
          $ref: '#/components/schemas/ObjPsStatusKind'
        PrevActual:
          $ref: '#/components/schemas/ObjPsStatusKind'
        Health:
          $ref: '#/components/schemas/ObjPsHealthStatusKind'
    ObjPsStatusKind:
      type: string
      enum:
      - create
      - starting
      - start
      - updating
      - update
      - destroying
      - destroy
      - stopping
      - stop
      - fail
      - finish
      - unknown
    ObjectVersion:
      type: object
      description: The version number of the object such as node, service, etc. This is needed to avoid conflicting writes. The client must send the version number along with the modified specification when updating these objects.  This approach ensures safe concurrency and determinism in that the change on the object may not be applied if the version number has changed from the last read. In other words, if two update requests specify the same base version, only one of the requests can succeed. As a result, two separate update requests that happen at the same time will not unintentionally overwrite each other.
      properties:
        Index:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
    OciDescriptor:
      type: object
      description: A descriptor struct containing digest, media type, and size, as defined in the [OCI Content Descriptors Specification](https://github.com/opencontainers/image-spec/blob/v1.0.1/descriptor.md).
      properties:
        mediaType:
          type:
          - string
          - 'null'
          description: The media type of the object this schema refers to.
        digest:
          type:
          - string
          - 'null'
          description: The digest of the targeted content.
        size:
          type:
          - integer
          - 'null'
          format: int64
          description: The size in bytes of the blob.
        urls:
          type:
          - array
          - 'null'
          items:
            type: string
          description: List of URLs from which this object MAY be downloaded.
        annotations:
          type:
          - object
          - 'null'
          description: Arbitrary metadata relating to the targeted content.
          additionalProperties:
            type: string
          propertyNames:
            type: string
        data:
          type:
          - string
          - 'null'
          description: Data is an embedding of the targeted content. This is encoded as a base64 string when marshalled to JSON (automatically, by encoding/json). If present, Data can be used directly to avoid fetching the targeted content.
        platform:
          oneOf:
          - $ref: '#/components/schemas/OciPlatform'
          - type: 'null'
        artifactType:
          type:
          - string
          - 'null'
          description: ArtifactType is the IANA media type of this artifact.
    OciPlatform:
      type: object
      description: Describes the platform which the image in the manifest runs on, as defined in the [OCI Image Index Specification](https://github.com/opencontainers/image-spec/blob/v1.0.1/image-index.md).
      properties:
        architecture:
          type:
          - string
          - 'null'
          description: The CPU architecture, for example `amd64` or `ppc64`.
        os:
          type:
          - string
          - 'null'
          description: The operating system, for example `linux` or `windows`.
        os.version:
          type:
          - string
          - 'null'
          description: Optional field specifying the operating system version, for example on Windows `10.0.19041.1165`.
        os.features:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Optional field specifying an array of strings, each listing a required OS feature (for example on Windows `win32k`).
        variant:
          type:
          - string
          - 'null'
          description: Optional field specifying a variant of the CPU, for example `v7` to specify ARMv7 when architecture is `arm`.
    PeerInfo:
