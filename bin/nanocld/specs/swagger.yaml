              description: Required. Keyboard layout. Corresponds to XKBLAYOUT.
              type: string
            model:
              default: pc105
              description: 'Optional. Keyboard model. Corresponds to XKBMODEL. Default: ``pc105``.'
              type: string
            options:
              description: Optional. Keyboard options. Corresponds to XKBOPTIONS.
