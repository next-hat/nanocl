ApiVersion: v0.16

Namespace: global

# See all options:
# https://docs.next-hat.com/references/nanocl/objects/resource
Resources:
- Name: tcp-example
  Kind: ncproxy.io/rule
  Data:
    Rules:
    - Network: Local
      Protocol: Tcp
      Port: 9000
      Target:
        Key: global.tcp-example.c
        Port: 9000
    - Network: Local
      Protocol: Tcp
      Port: 9001
      Target:
        UnixPath: /run/nanocl/proxy.sock

# See all options:
# https://docs.next-hat.com/references/nanocl/objects/cargo
Cargoes:
- Name: tcp-example
  Containers:
  - Name: tcp-example
    Image: ghcr.io/next-hat/nanocl-get-started:latest
    Env:
    - APP=GET_STARTED1
