###
# This is an example of a virtual machine deployment
# It will take over a physical interface from the host
###
ApiVersion: v0.16

Namespace: global

# See all options:
# https://docs.next-hat.com/references/nanocl/objects/virtual-machine
VirtualMachines:
- Name: vm-test
  InitContainer:
    Image: alpine:latest
    Cmd:
    - sh
    - -c
    - wget -O /tmp/vm-test.img https://cloud-images.ubuntu.com/minimal/releases/jammy/release/ubuntu-22.04-minimal-cloudimg-amd64.img
  Disk:
    Image: /tmp/vm-test.img
  HostConfig:
    Cpu: 4
    Memory: 4096
    Kvm: true
    RuntimeNetwork: host # use host networks
    LinkNetIface: wlp6s0 # Use physical interface from host
