###
# A DHCP-capable guest without cloud-init on a named Docker bridge.
# Build the candidate runtime locally; see doc/vm-runtime.md.
# Prepare this guest image with a DHCP client and its own login credentials.
###
ApiVersion: v0.19

Namespace: global

# See all options:
# https://docs.next-hat.com/references/nanocl/objects/virtual-machine
VirtualMachines:
- Name: vm-test
  Image: /var/lib/nanocl/vm/plain-dhcp.qcow2
  CloudInit: false
  Console: true
  HostConfig:
    Cpu: 4
    Memory: 4096
    Kvm: true
    Runtime: ghcr.io/next-hat/nanocl-qemu:8.0.5.0
    NetworkMode: vm-private
