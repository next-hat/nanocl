ApiVersion: v0.16

Namespace: global

# See all options:
# https://docs.next-hat.com/references/nanocl/objects/resource
Resources:
- Name: crash-example.com
  Kind: ncproxy.io/rule
  Data:
    Rules:
    - Domain: crash-example.com
      Network: Local
      Locations:
      - Path: /
        Target:
          Key: global.crash-example.c
          Port: 9000

# See all options:
# https://docs.next-hat.com/references/nanocl/objects/cargo
Cargoes:
- Name: crash-example
  Containers:
  - Name: crash-example
    Image: ubuntu:latest
    Cmd:
    - bash
    - -c
    - |
      echo "Going to crash 1"
      exit 123
      sleep 1
      exit 432423
