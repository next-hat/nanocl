ApiVersion: v0.19
# AutoRemove does not archive logs. If Docker removes a container before its
# exit is observed, history retains an unknown exit code rather than success.

Jobs:
- Name: certbot-gen
  Ttl: 5
  Containers:
  - Image: ubuntu:latest
    Tty: true
    HostConfig:
      AutoRemove: true
    Cmd:
    - /bin/sh
    - -c
    - |
      echo "Hello world!"
