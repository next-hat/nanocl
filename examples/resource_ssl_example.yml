ApiVersion: v0.16

# See all options:
# https://docs.next-hat.com/references/nanocl/objects/resource
Resources:
- Name: resource-example
  Kind: ncproxy.io/rule
  Data:
    Rules:
      - Domain: deploy-example.com
        Network: Local
        # Reference a nanocl.io/tls secret. Its PEM values are persisted in
        # CockroachDB; ncproxy materializes them only for Nginx at runtime.
        Ssl: tls.secret
        Locations:
          - Path: /
            Target:
              Key: global.deploy-example.c
              Port: 9000
