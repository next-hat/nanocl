ApiVersion: v0.16

Args:
- Name: init
  Kind: Boolean

# {% if Args.init %}
Jobs:
- Name: init-db-cluster
  Ttl: 4
  Containers:
  - Image: cockroachdb/cockroach:v24.3.8
    HostConfig:
      NetworkMode: global
    Entrypoint:
    - /bin/sh
    Cmd:
    - -c
    - |
      echo "initializing db cluster"
      sleep 5
      cockroach init --insecure --host=store.local:26257
# {% endif %}

Cargoes:
# The final shared-sandbox model does not expose stable per-replica DNS names.
# Replace the legacy join names below with deployment-specific discovery before
# using this as an operational CockroachDB cluster.
- Name: db-replication
  Replicas: 3
  Containers:
  - Name: db-replication
    Image: cockroachdb/cockroach:v24.3.8
    Entrypoint:
    - /bin/sh
    Tty: true
    Cmd:
    - -c
    - |
      echo "starting cockroachdb"
      cockroach start --join=store.local,1store.local,2store.local --advertise-addr=$(hostname -i) --listen-addr=:26257 --sql-addr=:26258 --insecure
