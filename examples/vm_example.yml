ApiVersion: v0.19

Namespace: global

# See all options:
# https://docs.next-hat.com/references/nanocl/objects/resource
Resources:
- Name: vm-test
  Kind: ncproxy.io/rule
  Data:
    Rules:
    - Network: Local
      Protocol: Tcp
      Port: 5555
      Target:
        Key: global.vm-test.v
        Port: 22

# See all options:
# https://docs.next-hat.com/references/nanocl/objects/virtual-machine
VirtualMachines:
- Name: vm-test
  Image: ./tests/ubuntu-24.04-minimal-cloudimg-amd64.img
  # Build this candidate locally; see doc/vm-runtime.md.
  CloudInit: true
  Console: false
  HostConfig:
    Cpu: 2
    Memory: 2048
    Runtime: ghcr.io/next-hat/nanocl-qemu:8.0.5.0
