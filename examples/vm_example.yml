ApiVersion: v0.16

Namespace: global

# See all options:
# https://docs.next-hat.com/references/nanocl/objects/resource
Resources:
- Name: vm-test
  Kind: ncproxy.io/rule
  Data:
    Rules:
    - Network: Local
      Protocol: Tcp
      Port: 5555
      Target:
        Key: vm-test.global.v
        Port: 22

# See all options:
# https://docs.next-hat.com/references/nanocl/objects/virtual-machine
VirtualMachines:
- Name: vm-test
  InitContainer:
    Image: alpine:latest
    Cmd:
    - sh
    - -c
    - wget -O /tmp/vm-test.img https://cloud-images.ubuntu.com/minimal/releases/jammy/release/ubuntu-22.04-minimal-cloudimg-amd64.img
  Disk:
    Image: /tmp/vm-test.img
  HostConfig:
    Cpu: 2
    Memory: 2048
