ApiVersion: v0.16

Args:
  - Name: name
    Kind: String
    Required: true
  - Name: domain
    Kind: String
    Required: true
  - Name: image
    Kind: String
    Required: true
  - Name: port
    Kind: Number
    Required: true
  - Name: ssl_enabled
    Kind: Boolean
  # Optional single-value with default string
  - Name: env
    Kind: String
    Default: dev
  # Optional single-value with default number
  - Name: retries
    Kind: Number
    Default: 3
  # Multiple strings with default array (tests default_values)
  - Name: tags
    Kind: String
    Multiple: true
    Default: ["one", "two"]
  # Multiple numbers with default array (tests default_values)
  - Name: extra_ports
    Kind: Number
    Multiple: true
    Default: [8080, 8081]
  # Array default provided while Multiple is false -> should pick first
  - Name: color
    Kind: String
    Default: ["red", "blue"]
  # Array number default while Multiple is false -> should pick first
  - Name: scale
    Kind: Number
    Default: [1, 2]

Namespace: global

# See all options:
# https://docs.next-hat.com/references/nanocl/objects/cargo
Cargoes:
- Name: ${{ Args.name }}
  Containers:
  - Name: ${{ Args.name }}
    Image: ${{ Args.image }}

# See all options:
# https://docs.next-hat.com/references/nanocl/objects/resource
Resources:
- Name: ${{ Args.domain }}
  Kind: ncproxy.io/rule
  Data:
    Rules:
    - Domain: ${{ Args.domain }}
      Network: All
      Locations:
      - Path: /
        Target:
          Key: global.${{ Args.name }}.c
          Port: ${{ Args.port }}
