ApiVersion: v0.17

Cargoes:
- Name: health-check
  Containers:
  - Name: health-check
    Image: leone-website:0.5.7

Resources:
- Name: http.deploy-example.com
  Kind: ncproxy.io/rule
  Data:
    Rules:
    - Domain: deploy-example.com
      Network: All
      Locations:
      - Path: /
        Target:
          Key: global.health-check.c
          Port: 8080
