ApiVersion: v0.19
# Each admitted tick is a separate run; an active run causes a conflict.

Jobs:
- Name: cron-job-example
  Schedule: "*/1 * * * *"
  Metadata:
    GG: WP
  Containers:
  - Image: alpine:latest
    Cmd:
    - echo
    - Hello World
  - Image: alpine:latest
    Cmd:
    - echo
    - Hello World2
